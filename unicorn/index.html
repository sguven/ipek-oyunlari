<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İpek ve Pırıl'ın Gökkuşağı</title>
<meta name="description" content="tek boynuzlu at Pırıl ile örüntü, çok-az ve gölge oyunu. Sparkle the unicorn: patterns, more or less and shadow matching.">
<meta name="theme-color" content="#efe6ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='38,92 62,92 54,6' fill='%23ffcb3d' stroke='%233b2a5c' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* layout: lavanta gökyüzü; üstte Pırıl'ın sahnesi ve gökkuşağı, altında soru kartı. Tek tema, bilinçli olarak pastel. */
:root{
  --sky:#efe6ff;--sky2:#e0d2ff;--ink:#3b2a5c;--ink2:#6c5a92;--card:#fffdfb;--tint:#f6f0ff;
  --pink:#ff7eb6;--mint:#5fd3b5;--gold:#ffcb3d;--ok:#1f9e66;--okbg:#dcf6e9;--warnbg:#fff3cc;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{font:700 28px/1 var(--display);display:flex;align-items:center;gap:8px;margin:0;text-wrap:balance}
.brand svg{width:40px;height:40px;flex:none}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button{font-family:inherit}
.pill{font:800 15px var(--body);background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--ink)}
.pill svg{width:20px;height:20px}
.pill.small{font-size:13px;padding:6px 11px;box-shadow:0 3px 0 var(--ink)}
.pill:active,.tile:active,.ch:active,.cloud:active{transform:translateY(3px)}
.lang{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--ink)}
.lang button{font:800 14px var(--body);border:0;background:none;color:var(--ink);padding:7px 12px;cursor:pointer;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.scene{position:relative;background:linear-gradient(#fbe9ff,#e8f3ff);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);overflow:hidden}
.scene svg.sky{display:block;width:100%;height:auto}
.scene.mini svg.sky{max-height:150px}
.uni{position:absolute;left:50%;bottom:4%;width:42%;max-width:270px;transform:translateX(-50%);cursor:pointer;background:none;border:0;padding:0}
.scene.mini .uni{width:26%;max-width:150px}
.uni svg{width:100%;height:auto;display:block;overflow:visible}
.uni.hop{animation:hop .6s}
.uni.party{animation:party 2.2s ease-in-out}
.bandname{position:absolute;top:10px;right:12px;font:800 13px var(--body);background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.twinkle{animation:twinkle 1.6s ease-in-out infinite}
.hello{margin:0;font:700 18px/1.5 var(--body);color:var(--ink2);text-align:center;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.tile{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:16px 12px 14px;box-shadow:0 6px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.tile .art{height:64px;display:flex;align-items:center;justify-content:center;gap:2px}
.tile .art{width:100%;min-width:0}
.tile .art svg{height:100%;width:auto;min-width:0;max-width:calc((100% - 4px) / 3);flex:0 1 auto}
.tile b{font:700 24px/1.1 var(--display);text-align:center}
.tile span{font:700 12px var(--body);color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.board{background:var(--card);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:16px}
.ask{display:flex;align-items:center;gap:12px}
.ask h2{flex:1;min-width:0;margin:0;font:700 clamp(22px,5.4vw,34px)/1.15 var(--display);text-wrap:balance}
.round{width:56px;height:56px;border-radius:50%;border:4px solid var(--ink);cursor:pointer;flex:none;display:grid;place-items:center;padding:0;box-shadow:0 4px 0 var(--ink);background:var(--card)}
.round svg{width:26px;height:26px}
.round.speak{background:var(--gold)}
.stage{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;min-height:80px;background:var(--tint);border-radius:22px;padding:14px}
.stage .it{width:clamp(44px,12vw,72px);animation:pop .45s backwards}
.stage .it svg{width:100%;height:auto;display:block}
.stage .q{width:clamp(44px,12vw,72px);aspect-ratio:1;border:4px dashed var(--ink2);border-radius:18px;display:grid;place-items:center;font:700 34px var(--display);color:var(--ink2);box-sizing:border-box}
.stage .q.filled{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.stage .q svg{width:84%}
.stage .big{width:clamp(110px,30vw,160px);animation:pop .45s backwards}
.stage .big svg{width:100%;height:auto;display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:14px}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.ch{background:var(--card);border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:12px;cursor:pointer;display:grid;place-items:center;min-height:120px;color:var(--ink);animation:pop .4s backwards}
.ch svg{width:min(100%,96px);height:auto;display:block}
.cloud{background:#fff;border:4px solid var(--ink);border-radius:60px 60px 48px 48px;box-shadow:0 6px 0 var(--ink);padding:18px 12px;cursor:pointer;min-height:150px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;animation:pop .4s backwards}
.cloud svg{width:clamp(28px,8vw,40px);height:auto}
.ch.ok,.cloud.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 6px 0 var(--ok);animation:bounce .55s}
.ch.no,.cloud.no{animation:shake .45s;opacity:.3;pointer-events:none}
.streak{font:800 14px var(--body);color:var(--ink2);text-align:center;min-height:20px;margin:0}
.voice-note{background:var(--warnbg);border:3px solid var(--ink);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.voice-note b{font:700 18px/1.2 var(--display)}
.voice-note p,.voice-note li{margin:0;font-weight:700;font-size:14px;line-height:1.5}
.voice-note ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.ov{position:fixed;inset:0;background:rgba(59,42,92,.55);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--card);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);padding:22px 18px;max-width:540px;width:100%;box-sizing:border-box;max-height:88vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:14px}
.card h3{margin:0;font:700 28px/1.15 var(--display);text-wrap:balance}
.card p{margin:0;color:var(--ink2);font-weight:700;line-height:1.5}
.reward svg{width:min(70vw,260px);height:auto;animation:spin-in .7s}
.wardrobe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.acc{border-radius:20px;background:var(--tint);border:3px dashed #b9a6dc;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 13px var(--body);color:var(--ink);cursor:pointer}
.acc svg{width:64px;height:64px}
.acc.got{border:3px solid var(--ink);background:#fff}
.acc.on{background:#ffe6f2;border-color:var(--pink)}
.acc.locked{cursor:default;color:#9d8cc0}
.acc small{font:700 11px var(--body);color:var(--ink2)}
.stats{display:flex;flex-direction:column;gap:12px;text-align:left}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--tint);border-radius:16px;padding:10px;text-align:center}
.kpi b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font:700 12px var(--body);color:var(--ink2)}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 78px;align-items:center;gap:10px;font-weight:800;font-size:14px}
.track{height:14px;border-radius:999px;background:var(--tint);overflow:hidden}
.track i{display:block;height:100%;background:var(--ok);border-radius:999px}
.row em{font-style:normal;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px!important;font-weight:600!important}
.voice-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--tint);border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}70%{transform:scale(.96)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
@keyframes spin-in{from{transform:scale(.2) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
@keyframes hop{0%,100%{transform:translate(-50%,0)}40%{transform:translate(-50%,-18%)}}
@keyframes party{0%{transform:translate(-50%,0)}20%{transform:translate(-120%,-30%) rotate(-8deg)}45%{transform:translate(-50%,-55%) rotate(0)}70%{transform:translate(20%,-30%) rotate(8deg)}100%{transform:translate(-50%,0)}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes grow{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:420px){.brand{font-size:23px}.ch{min-height:100px}.cloud{min-height:120px}}
.seg{display:inline-flex;align-items:stretch;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}.seg span{font:800 13px var(--body);padding:6px 4px 6px 12px;align-self:center}.seg button{font:800 13px var(--body);border:0;background:none;color:var(--ink);padding:6px 11px;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lang button,.seg button{min-height:40px}.pill.small{min-height:40px}
.card>.btns:last-child{position:sticky;bottom:-22px;background:var(--card);padding-block:10px 4px;margin-bottom:-4px}
@media (max-height:520px) and (orientation:landscape){.scene.mini{display:none}.wrap{gap:10px;padding-block:8px 24px}.board{padding:10px;gap:10px}.ask h2{font-size:22px}.round{width:46px;height:46px}.stage{min-height:56px;padding:8px}.stage .o,.stage .it,.stage .q{width:48px}.stage .big{width:96px}.ch{min-height:86px;padding:6px}.ch svg{width:min(100%,70px)}.cloud{min-height:96px;padding:10px}.choices{gap:10px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand" id="brand"></h1>
    <div class="hud">
      <div class="lang" role="group" aria-label="Dil / Language">
        <button id="lang-tr" data-lang="tr">TR</button>
        <button id="lang-en" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div class="voice-note" id="voiceNote" hidden></div>

  <div class="scene" id="scene">
    <svg class="sky" id="sky" viewBox="0 0 400 230" aria-hidden="true"></svg>
    <button class="uni" id="uni"></button>
    <span class="bandname" id="bandCount"></span>
  </div>

  <section id="home" style="display:flex;flex-direction:column;gap:16px">
    <p class="hello" id="hello"></p>
    <div class="tiles" id="tiles"></div>
    <div class="btns">
      <button class="pill" id="wardBtn"></button>
      <button class="pill small" id="soundBtn"></button>
      <div class="seg" id="voiceSel" role="group" hidden><span id="voiceSelLabel"></span><button data-voice="kadin"></button></div>
      <button class="pill small" id="parentBtn"></button>
    </div>
  </section>

  <section id="play" class="board" hidden>
    <div class="ask">
      <button class="round" id="backBtn"></button>
      <h2 id="prompt"></h2>
      <button class="round speak" id="speakBtn"></button>
    </div>
    <div class="stage" id="stage"></div>
    <div class="choices" id="choices"></div>
    <p class="streak" id="streak"></p>
  </section>
</div>

<div class="ov" id="rewardOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
    <div class="reward" id="rewardArt"></div>
    <h3 id="rewardTitle"></h3>
    <p id="rewardText"></p>
    <div class="btns"><button class="pill" id="rewardGo"></button></div>
  </div>
</div>

<div class="ov" id="wardOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="wardTitle">
    <h3 id="wardTitle"></h3>
    <p id="wardText"></p>
    <div class="wardrobe" id="wardrobe"></div>
    <div class="btns"><button class="pill" data-close="wardOv" id="wardClose"></button></div>
  </div>
</div>

<div class="ov" id="parentOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="parentTitle">
    <h3 id="parentTitle"></h3>
    <div class="stats" id="stats"></div>
    <p class="note" id="parentNote"></p>
    <div class="btns">
      <button class="pill small" id="resetBtn"></button>
      <button class="pill" data-close="parentOv" id="parentClose"></button>
    </div>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
const INK='#3b2a5c';
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const cap=(s,l)=>s?s[0].toLocaleUpperCase(l==='tr'?'tr-TR':'en-US')+s.slice(1):s;

const RAINBOW=['#ff5a5a','#ff9f43','#ffd93d','#4cd17a','#4aa8ff','#5a63e0','#a66bff'];
const ACC=['crown','wings','cape','glasses','necklace','sparkles'];

  tr:{

    hello:"Merhaba İpek! Pırıl'a gökkuşağı yapmasında yardım eder misin? Her doğru cevap gökkuşağına bir renk ekler. Gökkuşağı tamamlanınca Pırıl'a yeni bir süs gelir.",
    modes:{pattern:'Örüntüler',more:'Çok mu, az mı?',shadow:'Gölgeler',mix:'Karışık'},

    retry:'Yeniden kontrol et',voiceBuiltIn:'oyunun kendi Türkçe sesi',voiceLabel:'Ses:',voiceNames:{kadin:'Kadın'}

    colors:['red','orange','yellow','green','blue','indigo','purple'],
    patternQ:'What comes next?',patternSay:'What comes next? Look and find it!',patternGood:'You found the pattern!',

const VOICE={tr:null,en:null};let voicesChecked=false;
const hasTTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
function normLang(l){return String(l||'').toLowerCase().replace('_','-')}
function scoreVoice(v,l){
  const n=v.name.toLowerCase(),lg=normLang(v.lang);let s=0;
  if(/natural|neural|premium|enhanced|online|siri/.test(n))s+=6;
  if(/google/.test(n))s+=3;
  if(l==='tr'&&/yelda|emel|ahmet|filiz|tolga|cem|seda/.test(n))s+=3;
  if(l==='tr'&&lg==='tr-tr')s+=2;
  if(l==='en'&&lg==='en-us')s+=3;
  if(l==='en'&&/samantha|ava|allison|aria|jenny|zoe|karen|daniel/.test(n))s+=2;
  if(/compact|eloquence|grandpa|grandma|bad news|bells|bubbles|cellos|jester|organ|trinoids|whisper|wobble|zarvox|albert|boing|fred|junior|ralph|kathy|bahh|hysterical|superstar|good news|pipe organ/.test(n))s-=8;
  if(v.default)s+=1;
  return s;
}
function loadVoices(){
  if(!hasTTS)return true;
  let vs=[];try{vs=speechSynthesis.getVoices()||[]}catch(e){}
  if(!vs.length)return false;
  ['tr','en'].forEach(l=>{const c=vs.filter(v=>{const lg=normLang(v.lang);return lg===l||lg.startsWith(l+'-')});c.sort((a,b)=>scoreVoice(b,l)-scoreVoice(a,l));VOICE[l]=c[0]||null});
  voicesChecked=true;renderVoiceNote();return true;
}
function watchVoices(){
  voicesChecked=false;let tries=0;
  if(loadVoices())return;
  const iv=setInterval(()=>{tries++;if(loadVoices()||tries>24){clearInterval(iv);if(!voicesChecked){voicesChecked=true;renderVoiceNote()}}},250);
}
if(hasTTS){try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){try{speechSynthesis.onvoiceschanged=loadVoices}catch(_){}}}
function renderVoiceNote(){
  const box=$('voiceNote');const missing=voicesChecked&&!VOICE[S.lang]&&S.sound&&!ownVoice();
  box.hidden=!missing;if(!missing)return;
  const steps=GUIDE[S.lang][platform()];
  box.innerHTML=`<b>${L().noVoiceTitle}</b><p>${L().noVoiceBody}</p><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol><div><button class="pill small" id="retryVoice">${L().retry}</button></div>`;
  $('retryVoice').onclick=watchVoices;
}

const CLIPS={base:'audio/',map:null};
try{fetch(CLIPS.base+'manifest.json').then(r=>r.ok?r.json():null).then(m=>{if(m&&m.clips&&m.voices&&m.voices.length){CLIPS.map=m;renderVoiceNote();renderVoiceSel()}}).catch(()=>{})}catch(e){}
function curVoice(){const vs=CLIPS.map?CLIPS.map.voices:[];return vs.includes(S.voice)?S.voice:vs[0]}
function ownVoice(){return S.lang==='tr'&&!!CLIPS.map}
function audioCtx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC}catch(e){return null}}
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
let audioUnlocked=false;
function unlockAudio(){const a=audioCtx();if(!a)return;if(a.state!=='running')a.resume().catch(()=>{});if(!audioUnlocked){try{const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0);audioUnlocked=true}catch(e){}}}
['pointerdown','pointerup','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state!=='running')AC.resume().catch(()=>{})});
const clipBufs={};
function clipBuf(id){
  const a=audioCtx(),key=curVoice()+'/'+id;if(!a)return Promise.reject(new Error('no audio'));
  if(!clipBufs[key]){clipBufs[key]=fetch(CLIPS.base+key+'.mp3').then(r=>{if(!r.ok)throw new Error('missing');return r.arrayBuffer()}).then(b=>new Promise((res,rej)=>a.decodeAudioData(b,res,rej)));clipBufs[key].catch(()=>{delete clipBufs[key]})}
  return clipBufs[key];
}
let clipGen=0,clipSrc=null,clipChain=Promise.resolve();
function stopClips(){clipGen++;try{clipSrc&&clipSrc.stop()}catch(e){}clipSrc=null}
function hush(){stopClips();try{speechSynthesis.cancel()}catch(e){}}
function playBuf(buf,gen){return new Promise(async res=>{const a=audioCtx();if(gen!==clipGen||!a)return res();if(a.state!=='running'){try{await Promise.race([a.resume(),new Promise(r=>setTimeout(r,600))])}catch(e){}}if(gen!==clipGen)return res();const s=a.createBufferSource();s.buffer=buf;s.connect(a.destination);s.onended=()=>{if(clipSrc===s)clipSrc=null;res()};clipSrc=s;try{s.start()}catch(e){res()}})}
function playClips(parts,queue){
  if(!queue){stopClips();clipChain=Promise.resolve()}
  const gen=clipGen,loads=parts.map(p=>clipBuf(CLIPS.map.clips[p]));loads.forEach(p=>p.catch(()=>{}));
  clipChain=clipChain.then(async()=>{for(let i=0;i<loads.length;i++){if(gen!==clipGen)return;let b;try{b=await loads[i]}catch(e){continue}await playBuf(b,gen);if(i<loads.length-1)await new Promise(r=>setTimeout(r,140))}}).catch(()=>{});
}
function say(t,queue){
  if(!S.sound)return;
  const parts=(Array.isArray(t)?t:[t]).filter(Boolean);if(!parts.length)return;
  if(ownVoice()&&parts.every(p=>CLIPS.map.clips[p])){try{speechSynthesis.cancel()}catch(e){}playClips(parts,queue);return}
  if(!hasTTS)return;const v=VOICE[S.lang];if(!v)return;
  if(!queue)stopClips();
  try{if(!queue)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(parts.join(' '));u.voice=v;u.lang=v.lang;u.rate=S.lang==='tr'?.9:.92;u.pitch=1.12;speechSynthesis.speak(u)}catch(e){}
}
function renderVoiceSel(){
  const box=$('voiceSel');if(!box)return;const l=L(),vs=CLIPS.map?CLIPS.map.voices:[];
  box.hidden=!(S.lang==='tr'&&vs.length>1);$('voiceSelLabel').textContent=l.voiceLabel;box.setAttribute('aria-label',l.voiceLabel);
  box.querySelectorAll('button').forEach(b=>{b.hidden=!vs.includes(b.dataset.voice);b.textContent=l.voiceNames[b.dataset.voice];b.setAttribute('aria-pressed',String(curVoice()===b.dataset.voice))});
}
document.querySelectorAll('#voiceSel button').forEach(b=>b.onclick=()=>{S.voice=b.dataset.voice;save();renderVoiceSel();say(L().voiceTestSay)});

function tone(f,d,t0,type,vol){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.17,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const chime=n=>{const base=[523,587,659,698,784,880,988][n%7];tone(base,.3);tone(base*1.5,.3,.08)};
const boop=()=>{tone(330,.18,0,'sine',.14);tone(262,.25,.13,'sine',.14)};
const harp=()=>[523,587,659,698,784,880,988,1047].forEach((f,i)=>tone(f,.35,i*.08));
const fx=$('fx');let ctx=null;try{ctx=fx.getContext('2d')}catch(e){}
let parts=[],fxOn=false;
function confetti(n,rainbow){if(reduce||!ctx)return;fx.width=innerWidth;fx.height=innerHeight;for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.5,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:5+Math.random()*7,c:rainbow?RAINBOW[i%7]:pick(['#ff7eb6','#ffd93d','#5fd3b5','#a66bff','#4aa8ff']),a:Math.random()*6,va:(Math.random()-.5)*.3,life:1,star:Math.random()<.5});if(!fxOn){fxOn=true;requestAnimationFrame(tick)}}
function tick(){if(!ctx)return;ctx.clearRect(0,0,fx.width,fx.height);parts.forEach(p=>{p.vy+=.42;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life-=.011;ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;if(p.star){ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?p.r*.45:p.r,an=-Math.PI/2+i*Math.PI/5;ctx.lineTo(r*Math.cos(an),r*Math.sin(an))}ctx.fill()}else ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);ctx.restore()});parts=parts.filter(p=>p.life>0&&p.y<fx.height+40);if(parts.length)requestAnimationFrame(tick);else{fxOn=false;ctx.clearRect(0,0,fx.width,fx.height)}}

/* ---------- sahne ---------- */
function renderSky(newBand){
  let g='';
  [[40,40,24],[330,30,30],[300,190,22],[70,180,20]].forEach(([x,y,r])=>{g+=`<g fill="#ffffff" opacity=".9"><circle cx="${x}" cy="${y}" r="${r}"/><circle cx="${x+r}" cy="${y+4}" r="${r*.8}"/><circle cx="${x-r}" cy="${y+6}" r="${r*.7}"/></g>`});
  for(let i=0;i<7;i++){
    const r=170-i*13,len=(Math.PI*r).toFixed(0),on=i<S.bands,isNew=newBand&&i===S.bands-1;
    const d=`M${200-r} 222 A${r} ${r} 0 0 1 ${200+r} 222`;
    g+=on?`<path d="${d}" stroke="${RAINBOW[i]}" stroke-width="13" fill="none" ${isNew&&!reduce?`style="--len:${len};stroke-dasharray:${len};animation:grow .9s ease-out"`:''}/>`
          :`<path d="${d}" stroke="#ffffff" stroke-width="13" fill="none" opacity=".55"/><path d="${d}" stroke="#c9b8ea" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>`;
  }
  g+=`<g fill="#ffffff" stroke="${INK}" stroke-width="3"><ellipse cx="200" cy="222" rx="120" ry="18"/></g>`;
  $('sky').innerHTML=g;
  $('bandCount').textContent=L().bands(S.bands);
}
function renderUni(){$('uni').innerHTML=unicorn(S.worn);$('uni').setAttribute('aria-label',L().uni)}
$('uni').onclick=()=>{const u=$('uni');u.classList.remove('hop');void u.offsetWidth;u.classList.add('hop');tone(880,.15);tone(1175,.2,.1);say(pick(L().tapUni))};

/* ---------- sorular ---------- */
let mode='mix',Q=null,locked=false,firstTry=true,screen='home';
function makePattern(){
  const lv=level();const shapes=Object.keys(TOKSHAPES);
  const mk=()=>({s:pick(shapes),c:pick(TOKCOLORS)});const same=(a,b)=>a.s===b.s&&a.c===b.c;
  let units,type;
  if(lv===1){const s=pick(shapes),cs=shuffle(TOKCOLORS.slice());units=[{s,c:cs[0]},{s,c:cs[1]}];type='AB'}
  else{
    let a=mk(),b=mk();while(same(a,b)||a.s===b.s)b=mk();
    if(lv===2){type=pick(['AB','AAB','ABB']);units=type==='AB'?[a,b]:type==='AAB'?[a,a,b]:[a,b,b]}
    else{let c=mk();while(same(c,a)||same(c,b)||c.s===a.s||c.s===b.s)c=mk();type=pick(['ABC','ABC','AAB','ABB']);units=type==='ABC'?[a,b,c]:type==='AAB'?[a,a,b]:[a,b,b]}
  }
  const showLen=units.length===2?5:units.length*2-1;
  const seq=[];for(let i=0;i<showLen;i++)seq.push(units[i%units.length]);
  const ans=units[showLen%units.length];
  const opts=[ans];const pool=[...units,mk(),mk(),mk(),mk()];
  for(const p of pool){if(opts.length>=3)break;if(!opts.some(o=>same(o,p)))opts.push(p)}
  while(opts.length<3){const p=mk();if(!opts.some(o=>same(o,p)))opts.push(p)}
  return{cat:'pattern',type,seq,answer:`${ans.s}|${ans.c}`,ans,options:shuffle(opts.map(o=>({...o,key:`${o.s}|${o.c}`})))};
}
function makeMore(){
  const lv=level();const max=[5,7,9][lv-1],minDiff=lv===1?2:1;
  let a,b;do{a=1+rnd(max);b=1+rnd(max)}while(Math.abs(a-b)<minDiff);
  const ask=lv===1?'more':pick(['more','less']);
  const win=ask==='more'?(a>b?0:1):(a<b?0:1);
  return{cat:'more',ask,counts:[a,b],answer:String(win)};
}
function makeShadow(){
  const lv=level();const keys=shuffle(Object.keys(OBJ));const n=lv===1?3:4;
  const opts=keys.slice(0,n);const target=pick(opts);
  return{cat:'shadow',answer:target,options:shuffle(opts.slice())};
}
function questionText(q){
  const l=L();
  if(q.cat==='pattern')return{html:l.patternQ,speech:l.patternSay};
  if(q.cat==='more'){const s=q.ask==='more'?l.moreQ:l.lessQ;return{html:s,speech:s}}
  return{html:l.shadowQ,speech:l.shadowSay(l.objects[q.answer])};
}
function goodText(q){
  const l=L();
  if(q.cat==='pattern')return l.patternGood;
  if(q.cat==='more'){const w=+q.answer,a=q.counts[w],b=q.counts[1-w];return q.ask==='more'?l.moreGood(a,b,l):l.lessGood(a,b,l)}
  return l.shadowGood(l.objects[q.answer]);
}
function renderQuestion(){
  const q=Q,tx=questionText(q),stage=$('stage'),ch=$('choices');
  $('prompt').innerHTML=tx.html;ch.className='choices';
  if(q.cat==='pattern'){
    stage.hidden=false;
    stage.innerHTML=q.seq.map((u,i)=>`<div class="it" style="animation-delay:${i*90}ms">${token(u.s,u.c)}</div>`).join('')+`<div class="q" id="qslot">?</div>`;
    ch.innerHTML=q.options.map((o,i)=>`<button class="ch" data-v="${o.key}" style="animation-delay:${300+i*80}ms" aria-label="${i+1}">${token(o.s,o.c)}</button>`).join('');
  }else if(q.cat==='more'){
    stage.hidden=true;stage.innerHTML='';ch.className='choices two';
    const star=svg(`<polygon points="${starPts(50,54,44,19)}" fill="#ffd93d" ${st(5)}/>`);
    ch.innerHTML=q.counts.map((n,i)=>`<button class="cloud" data-v="${i}" style="animation-delay:${i*100}ms" aria-label="${n}">${star.repeat(n)}</button>`).join('');
  }else{
    stage.hidden=false;
    stage.innerHTML=`<div class="big">${objSvg(q.answer)}</div>`;
    ch.innerHTML=q.options.map((k,i)=>`<button class="ch" data-v="${k}" style="animation-delay:${200+i*80}ms" aria-label="${i+1}">${objSvg(k,SHADOW)}</button>`).join('');
  }
  ch.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b));
}
let greeted=false;
function next(){
  const cat=mode==='mix'?pick(['pattern','more','shadow']):mode;
  Q=cat==='pattern'?makePattern():cat==='more'?makeMore():makeShadow();
  locked=false;firstTry=true;renderQuestion();
  const first=!greeted;greeted=true;setTimeout(()=>{if(screen==='play')say(first?[L().greet,questionText(Q).speech]:questionText(Q).speech)},250);
}
function answer(b){
  if(locked)return;
  const st_=S.stats[Q.cat];
  if(b.dataset.v===Q.answer){
    locked=true;if(firstTry){st_[0]++;st_[1]++}
    b.classList.add('ok');
    if(Q.cat==='pattern'){const slot=$('qslot');if(slot){slot.classList.add('filled');slot.innerHTML=token(Q.ans.s,Q.ans.c)}}
    S.total++;S.streak=(S.streak||0)+1;S.best=Math.max(S.best,S.streak);
    S.bands++;const bandIdx=S.bands-1;chime(bandIdx);confetti(36);
    say([pick(L().praise),goodText(Q),cap(L().colors[bandIdx],S.lang)+'!']);
    $('streak').textContent=S.streak>=3?L().streak(S.streak):'';
    const done=S.bands>=7;
    save();renderSky(true);
    const u=$('uni');u.classList.remove('hop');void u.offsetWidth;u.classList.add('hop');
    setTimeout(()=>done?finishRainbow():next(),done?1500:2200);
  }else{
    if(firstTry){st_[1]++;firstTry=false}
    S.streak=0;$('streak').textContent='';save();
    b.classList.add('no');boop();say(L().tryAgain);
  }
}
function finishRainbow(){
  S.rainbows++;const idx=S.rainbows-1;let newAcc=null;
  if(idx<ACC.length){newAcc=ACC[idx];S.worn[newAcc]=true}
  save();harp();confetti(160,true);
  const u=$('uni');u.classList.remove('hop','party');void u.offsetWidth;u.classList.add('party');
  say(L().rainbowDone);
  setTimeout(()=>{
    const l=L();
    $('rewardArt').innerHTML=unicorn(S.worn);
    $('rewardTitle').textContent=newAcc?l.newAcc(l.accNames[newAcc]):l.rainbowDone;
    $('rewardText').textContent=unlocked()>=ACC.length?l.accAll:l.accNext;
    $('rewardGo').textContent=l.cont;$('rewardOv').hidden=false;$('rewardGo').focus();
    if(newAcc)say(l.accSay(l.accNames[newAcc]),true);
    S.bands=0;save();renderSky();renderUni();
  },reduce?200:2300);
}
$('rewardGo').onclick=()=>{$('rewardOv').hidden=true;if(screen==='play')next()};

/* ---------- ekranlar ---------- */
function renderHome(){
  const l=L();
  $('hello').textContent=l.hello;
  const art={
    pattern:token('heart','#ff7eb6')+token('heart','#4aa8ff')+token('heart','#ff7eb6'),
    more:svg(`<polygon points="${starPts(50,54,44,19)}" fill="#ffd93d" ${st(5)}/>`).repeat(3),
    shadow:objSvg('butterfly')+objSvg('butterfly',SHADOW),
    mix:svg(`<path d="M10 90 A40 40 0 0 1 90 90" stroke="#ff5a5a" stroke-width="10" fill="none"/><path d="M22 90 A28 28 0 0 1 78 90" stroke="#ffd93d" stroke-width="10" fill="none"/><path d="M34 90 A16 16 0 0 1 66 90" stroke="#4aa8ff" stroke-width="10" fill="none"/>`)
  };
  $('tiles').innerHTML=['pattern','more','shadow','mix'].map(k=>`<button class="tile" data-mode="${k}"><div class="art">${art[k]}</div><b>${l.modes[k]}</b><span>${k==='mix'?l.allInOne:l.level(level())}</span></button>`).join('');
}
function renderStatic(){
  const l=L();
  document.documentElement.lang=S.lang;document.title=l.name;
  $('brand').innerHTML=ICON.logo+l.name;
  ['tr','en'].forEach(k=>$('lang-'+k).setAttribute('aria-pressed',String(S.lang===k)));
  $('soundBtn').innerHTML=(S.sound?ICON.speaker:ICON.mute)+(S.sound?l.soundOn:l.soundOff);
  $('parentBtn').textContent=l.parent;$('wardBtn').innerHTML=ACCICON.crown+l.wardrobe;
  $('backBtn').innerHTML=ICON.back;$('backBtn').setAttribute('aria-label',l.back);
  $('speakBtn').innerHTML=ICON.speaker;$('speakBtn').setAttribute('aria-label',l.replay);
  $('parentTitle').textContent=l.parentTitle;$('parentNote').textContent=l.parentNote;$('parentClose').textContent=l.close;
  $('resetBtn').textContent=l.reset;$('wardTitle').textContent=l.wardrobe;$('wardClose').textContent=l.close;$('rewardGo').textContent=l.cont;
}
function renderAll(){renderVoiceSel();renderStatic();renderSky();renderUni();renderVoiceNote();if(screen==='home')renderHome();else if(Q)renderQuestion()}
function show(s){
  screen=s;$('home').hidden=s!=='home';$('play').hidden=s!=='play';
  $('scene').classList.toggle('mini',s==='play');
  if(s==='home'){renderHome();hush()}
}
function renderWardrobe(){
  const l=L(),n=unlocked();
  $('wardText').textContent=n?l.wardText:l.accNext;
  $('wardrobe').innerHTML=ACC.map((k,i)=>i<n
    ?`<button class="acc got ${S.worn[k]?'on':''}" data-acc="${k}" aria-pressed="${!!S.worn[k]}">${ACCICON[k]}${l.accNames[k]}</button>`
    :`<div class="acc locked"><span style="font:700 34px var(--display)">?</span>${l.locked}<small>${l.lockedHint(i+1)}</small></div>`).join('');
  $('wardrobe').querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{const k=b.dataset.acc;S.worn[k]=!S.worn[k];save();renderUni();renderWardrobe();tone(S.worn[k]?988:660,.2)});
}
function renderStats(){
  const l=L();const lab={pattern:l.modes.pattern,more:l.modes.more,shadow:l.modes.shadow};
  const rows=Object.keys(lab).map(k=>{const[c,t]=S.stats[k],p=t?Math.round(c/t*100):0;return`<div class="row"><span>${lab[k]}</span><div class="track"><i style="width:${p}%"></i></div><em>${t?p+'%':'—'} <small>(${c}/${t})</small></em></div>`}).join('');
  const v=VOICE[S.lang];
  $('stats').innerHTML=`<div class="kpis"><div class="kpi"><b>${S.total}</b><span>${l.totalStars}</span></div><div class="kpi"><b>${S.rainbows}</b><span>${l.rainbows}</span></div><div class="kpi"><b>${S.best}</b><span>${l.bestStreak}</span></div></div><p class="note" style="margin:0">${l.firstTry}</p>${rows}<p class="note" style="margin:0">${l.lvlNote(level())}</p><div class="voice-line"><span>${ownVoice()?l.voiceUsed(`${l.voiceNames[curVoice()]} · ${l.voiceBuiltIn}`):v?l.voiceUsed(`${v.name} (${v.lang})`):l.voiceNone}</span>${(v||ownVoice())?`<button class="pill small" id="testVoice">${l.voiceTest}</button>`:''}</div>`;
  if(v||ownVoice())$('testVoice').onclick=()=>{const was=S.sound;S.sound=true;say(l.voiceTestSay);S.sound=was};
}
let resetArm=false;
$('resetBtn').onclick=()=>{const l=L();if(!resetArm){resetArm=true;$('resetBtn').textContent=l.resetSure;setTimeout(()=>{resetArm=false;$('resetBtn').textContent=L().reset},4000);return}const keep={sound:S.sound,lang:S.lang};S=Object.assign(fresh(),keep);save();resetArm=false;renderAll();renderStats()};

$('tiles').onclick=e=>{const t=e.target.closest('.tile');if(!t)return;mode=t.dataset.mode;show('play');next()};
$('backBtn').onclick=()=>show('home');
$('speakBtn').onclick=()=>Q&&say(questionText(Q).speech);
$('wardBtn').onclick=()=>{renderWardrobe();$('wardOv').hidden=false};
$('parentBtn').onclick=()=>{renderStats();$('parentOv').hidden=false};
$('soundBtn').onclick=()=>{S.sound=!S.sound;save();renderStatic();renderVoiceNote();if(!S.sound)hush()};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{if(S.lang===b.dataset.lang)return;S.lang=b.dataset.lang;save();hush();renderAll();if(screen==='play'&&Q)say(questionText(Q).speech)});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close).hidden=true});
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o&&o.id!=='rewardOv')o.hidden=true}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')['wardOv','parentOv'].forEach(id=>$(id).hidden=true)});
addEventListener('resize',()=>{if(ctx){fx.width=innerWidth;fx.height=innerHeight}});

renderAll();show('home');watchVoices();
</script>
