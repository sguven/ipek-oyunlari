<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ipek at the Wheel</title>
<meta name="description" content="İpek Direksiyonda: arabanı seç, denize, çiftliğe, ormana ya da oyun parkına sür; yıldız topla. Ipek at the Wheel: an easy driving game for little children.">
<meta name="theme-color" content="#bfe6ff">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İpek Direksiyonda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* layout: a garage screen (pick a car, then a place) and a full-screen drive (road drawn on a canvas, progress bar on top,
   big left / steering-wheel horn / right buttons at the bottom). Made for a 3-year-old: no reading, every step is spoken. Single pastel theme. */
:root{
  --ink:#3b2a5c;--ink2:#6c5a92;--card:#fffdfb;--sun:#ffcb3d;--pink:#ff7eb6;--mint:#5fd3b5;--sky:#bfe6ff;--tint:#f3eefc;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow-x:hidden;
  background:linear-gradient(180deg,#a9dcff 0%,#dff3ff 55%,#c6efb0 55%,#a6e08c 100%) fixed}
button,a{font-family:inherit;color:var(--ink)}
:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.pill{font:800 14px var(--body);background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:6px 12px;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--ink);text-decoration:none}
.pill svg{width:22px;height:22px;flex:none}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.stars{cursor:default}
.stars b{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.lang{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--ink)}
.lang button{font:800 14px var(--body);border:0;background:none;padding:7px 12px;cursor:pointer;letter-spacing:.04em;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.round{width:58px;height:58px;border-radius:50%;border:4px solid var(--ink);cursor:pointer;flex:none;display:grid;place-items:center;padding:0;box-shadow:0 4px 0 var(--ink);background:var(--sun)}
.round svg{width:28px;height:28px}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.round.white{background:var(--card)}

/* ---------- garage (pick a car / a place) ---------- */
#garage{min-height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.brand{margin:0;font:700 clamp(22px,5vw,32px)/1.05 var(--display);display:flex;align-items:center;gap:8px}
.brand svg{width:44px;height:44px;flex:none}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ask{margin:0;display:flex;align-items:center;gap:12px;background:rgba(255,253,251,.92);border:4px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);padding:10px 14px}
.ask .step{display:flex;gap:6px;flex:none}
.ask .step i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.ask .step i.on{background:var(--pink)}
.ask p{margin:0;flex:1;font:700 clamp(18px,4.4vw,26px)/1.2 var(--display);text-wrap:balance}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2.6vw,18px)}
@media (min-width:860px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pick{position:relative;background:var(--card);border:4px solid var(--ink);border-radius:30px;box-shadow:0 7px 0 var(--ink);padding:0;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;animation:pop .45s backwards;min-height:0}
.pick:nth-child(2){animation-delay:.07s}.pick:nth-child(3){animation-delay:.14s}.pick:nth-child(4){animation-delay:.21s}
.pick:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
.pick .pic{display:grid;place-items:center;padding:8px 6px 2px;aspect-ratio:200/130}
.pick .pic svg{width:100%;height:100%;display:block;overflow:visible}
.pick.car .pic svg{animation:idle 1.1s ease-in-out infinite}
.pick.car:nth-child(2n) .pic svg{animation-delay:.3s}
.pick.place .pic{padding:0}
.pick .nm{font:700 clamp(16px,3.6vw,21px)/1.1 var(--display);padding:6px 8px 10px;text-align:center;border-top:4px solid var(--ink);background:#fff8e6}
.pick.car .nm{border-top:0;background:none}
.pick .got{position:absolute;top:6px;right:6px;width:44px;height:44px;animation:spin-in .6s}
.pick.chosen{outline:5px solid var(--pink);outline-offset:3px}

/* ---------- drive ---------- */
#drive{position:fixed;inset:0;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#bfe6ff}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.dtop{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));display:flex;align-items:center;gap:10px;z-index:5}
.trip{flex:1;position:relative;height:40px;min-width:0;background:rgba(255,253,251,.92);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink)}
.trip .road{position:absolute;left:22px;right:46px;top:50%;height:10px;margin-top:-5px;border-radius:9px;background:repeating-linear-gradient(90deg,#8d89a8 0 14px,#a7a3c0 14px 22px)}
.trip .fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#ffcb3d,#ff7eb6);width:0}
.trip .me{position:absolute;top:50%;width:46px;height:30px;margin:-17px 0 0 -23px;left:0}
.trip .me svg,.trip .goal svg{width:100%;height:100%;display:block}
.trip .goal{position:absolute;right:2px;top:50%;width:40px;height:40px;margin-top:-21px}
.dstars{font:700 22px/1 var(--display);background:var(--card);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);padding:5px 12px 5px 6px;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;flex:none}
.dstars svg{width:30px;height:30px}
.dstars.bump{animation:bounce .4s}
.task{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:5;background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:0 5px 0 var(--ink);padding:6px 14px;display:flex;align-items:center;gap:8px;animation:drop .4s backwards}
.task svg{width:clamp(44px,10vw,64px);height:auto;animation:bob 1.2s ease-in-out infinite}
.task svg.tl{width:clamp(30px,7vw,40px);animation:none}
.task svg.q{width:clamp(30px,7vw,42px);animation:none}
.ctl{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;border-radius:50%;border:5px solid var(--ink);box-shadow:0 7px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;touch-action:none;
  width:clamp(84px,24vw,124px);height:clamp(84px,24vw,124px);transition:transform .08s}
.ctl svg{width:62%;height:62%;pointer-events:none}
.ctl.on,.ctl:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
#leftBtn{left:calc(14px + env(safe-area-inset-left));background:#7fd0ff}
#rightBtn{right:calc(14px + env(safe-area-inset-right));background:#7fd0ff}
#horn{left:50%;margin-left:calc(clamp(72px,19vw,104px) / -2);width:clamp(72px,19vw,104px);height:clamp(72px,19vw,104px);background:var(--sun)}
#horn svg{width:78%;height:78%}
.ctl.glow{animation:glow 1s ease-in-out infinite}
#horn.toot svg{animation:wiggle .35s}
.hand{position:absolute;left:0;top:0;width:clamp(56px,13vw,80px);pointer-events:none;z-index:8;opacity:0}
.hand svg{width:100%;height:auto;display:block}
.fly{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:9;pointer-events:none}
.fly svg{width:100%;height:100%}

.ov{position:fixed;inset:0;background:rgba(59,42,92,.45);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--card);border:4px solid var(--ink);border-radius:34px;box-shadow:0 8px 0 var(--ink);padding:16px;max-width:560px;width:100%;max-height:94vh;overflow:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;animation:pop .5s backwards}
.card .scene{width:100%;max-width:420px;border:4px solid var(--ink);border-radius:24px;overflow:hidden;line-height:0}
.card .scene svg{width:100%;height:auto;display:block}
.card h3{margin:0;font:700 clamp(24px,6vw,32px)/1.1 var(--display);text-wrap:balance}
.got-stars{display:flex;align-items:center;gap:8px;font:700 clamp(34px,9vw,48px)/1 var(--display)}
.got-stars svg{width:clamp(44px,11vw,60px);height:auto;animation:bounce 1s ease-in-out infinite}
.btns{display:flex;gap:16px;justify-content:center}
.round.big{width:84px;height:84px;background:var(--mint)}
.round.big svg{width:42px;height:42px}
.round.big.alt{background:var(--sun)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}70%{transform:scale(.92)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes spin-in{from{transform:scale(.2) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-18deg)}70%{transform:rotate(18deg)}}
@keyframes glow{0%,100%{box-shadow:0 7px 0 var(--ink),0 0 0 0 rgba(255,126,182,0)}50%{box-shadow:0 7px 0 var(--ink),0 0 0 14px rgba(255,126,182,.6)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* short landscape phones: smaller buttons, cards in one row */
@media (orientation:landscape) and (max-height:560px){
  #garage{gap:8px;padding-top:calc(6px + env(safe-area-inset-top))}
  .brand{font-size:20px}.brand svg{width:32px;height:32px}
  .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ask{padding:6px 12px;border-radius:22px}.ask p{font-size:19px}
  .round{width:48px;height:48px}.round svg{width:24px;height:24px}
  .ctl{width:clamp(66px,20vh,92px);height:clamp(66px,20vh,92px);border-width:4px}
  #horn{width:clamp(58px,17vh,80px);height:clamp(58px,17vh,80px);margin-left:calc(clamp(58px,17vh,80px) / -2)}
  .trip{height:36px}.dtop .round{width:44px;height:44px}
  .task{top:calc(54px + env(safe-area-inset-top));padding:4px 10px}
  .card{padding:10px;gap:8px}.card .scene{max-width:260px}.round.big{width:64px;height:64px}
}
</style>
</head>
<body>
<section id="garage">
  <header>
    <h1 class="brand" id="brand"></h1>
    <div class="hud">
      <a class="pill" id="gamesLink" href="../"></a>
      <span class="pill stars" id="stars"></span>
      <button class="pill" id="soundBtn"></button>
      <div class="lang" role="group" aria-label="Dil / Language">
        <button data-lang="tr">TR</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </header>
  <div class="ask"><button class="round white" id="pickBack" hidden></button><span class="step"><i id="st1"></i><i id="st2"></i></span><p id="askText"></p><button class="round" id="askSpeak"></button></div>
  <div class="cards" id="cards"></div>
</section>

<section id="drive" hidden>
  <canvas id="scene"></canvas>
  <div class="dtop">
    <button class="round white" id="homeBtn"></button>
    <div class="trip" aria-hidden="true"><div class="road"><div class="fill" id="tripFill"></div><div class="me" id="tripMe"></div></div><div class="goal" id="tripGoal"></div></div>
    <span class="dstars" id="dstars"></span>
    <button class="round" id="speakBtn"></button>
  </div>
  <div class="task" id="task" hidden></div>
  <button class="ctl" id="leftBtn"></button>
  <button class="ctl" id="horn"></button>
  <button class="ctl" id="rightBtn"></button>
  <div class="hand" id="hand"></div>
</section>

<div class="ov" id="doneOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
    <div class="scene" id="doneScene"></div>
    <h3 id="doneTitle"></h3>
    <div class="got-stars" id="doneStars"></div>
    <div class="btns"><button class="round big" id="againBtn"></button><button class="round big alt" id="otherBtn"></button></div>
  </div>
</div>
<canvas id="fx"></canvas>

<script>
'use strict';
const $=id=>document.getElementById(id);
const INK='#3b2a5c';
const svg=(inner,vb='0 0 100 100')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
const st=(w=4)=>`stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
function starPts(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- pictures (SVG) for the garage, the progress bar and the arrival card ---------- */
const BAL={red:'#ff5a5a',blue:'#4aa8ff',yellow:'#ffd93d',green:'#4cd17a'};
const HEAD=(x,y)=>`<circle cx="${x}" cy="${y}" r="9" fill="#ffd9b8" ${st(2.5)}/><path d="M${x-9} ${y-1} Q${x-9} ${y-11} ${x} ${y-11} Q${x+9} ${y-11} ${x+9} ${y-3} Q${x+3} ${y-7} ${x-3} ${y-4} Z" fill="#6b3f26" ${st(2)}/><circle cx="${x-10}" cy="${y+1}" r="4" fill="#6b3f26" ${st(2)}/><circle cx="${x+4}" cy="${y-1}" r="1.6" fill="${INK}"/><path d="M${x+1} ${y+4} Q${x+4} ${y+6} ${x+7} ${y+3}" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M${x-7} ${y-12} l-5 -4 v8z M${x-7} ${y-12} l5 -4 v8z" fill="#ff7eb6" ${st(1.6)}/>`;
const WHEEL=(x,y,r=15)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/><circle cx="${x}" cy="${y}" r="${r*.42}" fill="#e9e6f5"/>`;
const CARS={
  car:{color:'#4aa8ff',side:svg(`<ellipse cx="100" cy="110" rx="86" ry="6" fill="${INK}" opacity=".15"/><path d="M14 84 Q14 62 36 60 L56 34 Q62 26 74 26 H124 Q136 26 144 36 L162 60 Q186 62 186 84 V94 H14Z" fill="#4aa8ff" ${st(5)}/>
    <path d="M64 58 L78 36 H98 V58Z M106 58 V36 H122 Q130 36 136 44 L146 58Z" fill="#cfe9ff" ${st(4)}/>${HEAD(118,49)}<path d="M30 74 H170" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    <circle cx="182" cy="74" r="5" fill="#ffe27a" ${st(3)}/><rect x="12" y="68" width="8" height="10" rx="3" fill="#ff5a5a" ${st(2.5)}/>${WHEEL(52,96)}${WHEEL(150,96)}`,'0 0 200 120')},
  bus:{color:'#ffcb3d',side:svg(`<ellipse cx="100" cy="110" rx="90" ry="6" fill="${INK}" opacity=".15"/><rect x="10" y="20" width="180" height="76" rx="18" fill="#ffcb3d" ${st(5)}/>
    <rect x="22" y="32" width="30" height="26" rx="6" fill="#cfe9ff" ${st(3.5)}/><rect x="60" y="32" width="30" height="26" rx="6" fill="#cfe9ff" ${st(3.5)}/><rect x="98" y="32" width="30" height="26" rx="6" fill="#cfe9ff" ${st(3.5)}/><rect x="146" y="32" width="32" height="50" rx="6" fill="#cfe9ff" ${st(3.5)}/>
    ${HEAD(113,47)}<path d="M12 70 H140" stroke="${INK}" stroke-width="5"/><circle cx="186" cy="84" r="5" fill="#fff" ${st(3)}/>${WHEEL(48,96)}${WHEEL(152,96)}`,'0 0 200 120')},
  ice:{color:'#ff9fc8',side:svg(`<ellipse cx="100" cy="110" rx="88" ry="6" fill="${INK}" opacity=".15"/><path d="M84 30 L96 8 L108 30Z" fill="#f2c27a" ${st(3.5)}/><circle cx="96" cy="8" r="9" fill="#ff7eb6" ${st(3.5)}/><circle cx="96" cy="-2" r="3.5" fill="#ff5a5a" ${st(2)}/>
    <path d="M12 94 V40 Q12 30 22 30 H140 Q150 30 154 40 L168 58 Q188 60 188 78 V94Z" fill="#ff9fc8" ${st(5)}/><path d="M30 44 H110 V66 H30Z" fill="#fff4c2" ${st(3.5)}/><path d="M26 44 H114 L108 36 H32Z" fill="#5fd3b5" ${st(3)}/>
    <path d="M144 58 L132 40 H124 V58Z" fill="#cfe9ff" ${st(3.5)}/>${HEAD(70,57)}<circle cx="40" cy="80" r="4" fill="#fff"/><circle cx="62" cy="84" r="4" fill="#fff"/><circle cx="84" cy="80" r="4" fill="#fff"/><circle cx="106" cy="84" r="4" fill="#fff"/>${WHEEL(50,96)}${WHEEL(150,96)}`,'0 0 200 120')},
  fire:{color:'#ff5a5a',side:svg(`<ellipse cx="100" cy="110" rx="90" ry="6" fill="${INK}" opacity=".15"/><rect x="22" y="14" width="110" height="10" rx="4" fill="#d9d6e8" ${st(3)}/><path d="M34 14 V24 M50 14 V24 M66 14 V24 M82 14 V24 M98 14 V24 M114 14 V24" stroke="${INK}" stroke-width="3"/>
    <path d="M10 94 V34 Q10 28 16 28 H130 V40 H150 Q160 40 166 50 L180 66 Q190 68 190 80 V94Z" fill="#ff5a5a" ${st(5)}/><rect x="150" y="30" width="16" height="10" rx="4" fill="#4aa8ff" ${st(3)}/>
    <path d="M140 66 V48 H152 Q158 48 162 54 L170 66Z" fill="#cfe9ff" ${st(3.5)}/>${HEAD(152,59)}<path d="M12 72 H186" stroke="#fff" stroke-width="7"/><rect x="24" y="40" width="40" height="22" rx="5" fill="#ffcb3d" ${st(3)}/><rect x="74" y="40" width="40" height="22" rx="5" fill="#ffcb3d" ${st(3)}/>${WHEEL(46,96)}${WHEEL(152,96)}`,'0 0 200 120')}
};
const SCENES={
  beach:svg(`<rect width="200" height="130" fill="#9fdcff"/><circle cx="160" cy="30" r="16" fill="#ffd93d" ${st(3)}/><path d="M0 70 Q25 64 50 70 T100 70 T150 70 T200 70 V96 H0Z" fill="#4fb9ec"/><path d="M14 80 q8 -5 16 0 M70 84 q8 -5 16 0 M130 80 q8 -5 16 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M0 96 Q100 86 200 96 V130 H0Z" fill="#ffe08a" ${st(3)}/><path d="M48 118 V70" stroke="${INK}" stroke-width="4"/><path d="M14 74 Q48 40 82 74 Z" fill="#ff7eb6" ${st(3.5)}/><path d="M36 74 Q48 46 60 74" fill="#fff" ${st(3)}/>
    <path d="M118 120 V100 h8 v6 h8 v-6 h8 v6 h8 v-6 h8 v20Z" fill="#f2c27a" ${st(3)}/><path d="M138 100 V86 l10 5 l-10 5" fill="#ff5a5a" ${st(2.5)}/><circle cx="100" cy="114" r="6" fill="#ff5a5a" ${st(2.5)}/>`,'0 0 200 130'),

/* =====================================================================================
   ROAD ENGINE: a classic "pseudo-3D" road. The road is a list of short segments; each frame the next ~200 segments are
   projected to the screen, drawn far-to-near, then the scenery, stars and animals on them, then İpek's car.
   ===================================================================================== */
const cv=$('scene'),ctx=cv.getContext('2d');

let W=0,H=0,DPR=1,K=1,HY=0,CAMH=1000,SCAR=1,PZ=1000,CARW=100,CARY=100;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(2,window.devicePixelRatio||1,Math.sqrt(2.6e6/Math.max(1,W*H)));cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingQuality='high';layout();sizeFx()}
function layout(){
  K=W/2;HY=Math.round(H*(W>H*1.2?.36:.4));
  const hb=$('horn').getBoundingClientRect();
  CARY=hb.height?Math.min(H-10,hb.top-2):H*.86;
  CARW=Math.min(W*.3,(CARY-HY)*.66,270);
  const half=CARW*1.875; /* half of the road at the car line: three lanes, each a little wider than the car */
  SCAR=half/(RW*K);CAMH=(CARY-HY)/(SCAR*K);PZ=DEPTH/SCAR;
}

function ell(g,x,y,rx,ry,fill,lw,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);sh(g,fill,lw)}
function rrect(g,x,y,w,h,r,fill,lw){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();sh(g,fill,lw)}

  const th=THEMES[place],segs=[];

  function add(n,curve,dy){const y0=lastY();for(let i=0;i<n;i++){const k=segs.length,ein=Math.min(1,i/(n*.25)),eout=Math.min(1,(n-i)/(n*.25)),c=curve*Math.min(ein,eout);

/* ----- per-frame update ----- */
const segAt=z=>G.segs[clamp(Math.floor(z/SEG),0,G.segs.length-1)];

function draw(){

/* ----- controls ----- */
function steer(dir){if(!G||!G.started||G.arrived)return;G.lastInput=G.t;const nl=clamp(G.lane+dir,-1,1);if(nl!==G.lane){G.lane=nl;SFX.lane()}else{G.bump=Math.max(G.bump,.15)}hideHand();
  const b=$(dir<0?'leftBtn':'rightBtn');b.classList.add('on');setTimeout(()=>b.classList.remove('on'),140)}
function honk(){if(!G)return;if(G.started)G.lastInput=G.t;G.hornT=.6;SFX.horn(G.car);const h=$('horn');h.classList.remove('toot');void h.offsetWidth;h.classList.add('toot');
  const e=G.ev.find(e=>e.type==='cross'&&e.go&&!e.clear);if(e)setTimeout(()=>SFX.animal(e.animal),350)}
$('leftBtn').addEventListener('pointerdown',e=>{e.preventDefault();steer(-1)});
$('rightBtn').addEventListener('pointerdown',e=>{e.preventDefault();steer(1)});
$('horn').addEventListener('pointerdown',e=>{e.preventDefault();honk()});
['leftBtn','rightBtn','horn'].forEach(id=>$(id).addEventListener('click',e=>{if(e.detail===0){id==='horn'?honk():steer(id==='leftBtn'?-1:1)}}));
/* tapping or swiping the road works too: left third / right third steer, the middle (or the car) honks */
let swipe=null;
cv.addEventListener('pointerdown',e=>{swipe={x:e.clientX,y:e.clientY,t:performance.now()}});
cv.addEventListener('pointerup',e=>{if(!swipe)return;const dx=e.clientX-swipe.x;if(Math.abs(dx)>40)steer(dx>0?1:-1);else if(e.clientX<W/3)steer(-1);else if(e.clientX>W*2/3)steer(1);else honk();swipe=null});
document.addEventListener('keydown',e=>{if(screen!=='drive')return;if(e.key==='ArrowLeft'||e.key==='a'){steer(-1);e.preventDefault()}else if(e.key==='ArrowRight'||e.key==='d'){steer(1);e.preventDefault()}else if(e.key===' '||e.key==='h'){honk();e.preventDefault()}});

/* ----- screens ----- */
function renderChrome(){
  const l=L();document.documentElement.lang=S.lang;document.title=l.title;
  $('brand').innerHTML=BRAND+l.title;
  $('gamesLink').innerHTML=ICON.games+l.games;
  $('stars').innerHTML=ICON.star+`<b>${S.total}</b>`;
  $('soundBtn').innerHTML=(S.sound?ICON.speaker:ICON.mute)+(S.sound?l.soundOn:l.soundOff);
  [['askSpeak',ICON.speaker,l.replay],['speakBtn',ICON.speaker,l.replay],['pickBack',ICON.back,l.back],['homeBtn',ICON.home,l.home],['leftBtn',ICON.left,l.left],['rightBtn',ICON.right,l.right],['horn',ICON.wheel,l.horn],['againBtn',ICON.again,l.again],['otherBtn',ICON.map,l.other]]
    .forEach(([id,ic,lab])=>{$(id).innerHTML=ic;$(id).setAttribute('aria-label',lab)});
  $('hand').innerHTML=ICON.hand;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===S.lang)));
  renderPick();
}
function renderPick(){
  const l=L();$('askText').textContent=pickStep==='car'?l.pickCar:l.pickPlace;$('pickBack').hidden=pickStep==='car';
  $('st1').className='on';$('st2').className=pickStep==='place'?'on':'';
  if(pickStep==='car')$('cards').innerHTML=Object.keys(CARS).map(k=>`<button class="pick car${S.car===k?' chosen':''}" data-car="${k}" aria-label="${l.carNames[k]}"><span class="pic">${CARS[k].side}</span><span class="nm">${l.carNames[k]}</span></button>`).join('');
  else $('cards').innerHTML=Object.keys(SCENES).map(k=>`<button class="pick place" data-place="${k}" aria-label="${l.placeNames[k]}"><span class="pic">${SCENES[k]}</span><span class="nm">${l.placeNames[k]}</span>${S.visited.includes(k)?`<span class="got">${ICON.check}</span>`:''}</button>`).join('');
}
$('cards').addEventListener('click',e=>{const b=e.target.closest('.pick');if(!b)return;SFX.tap();
  if(b.dataset.car){S.car=b.dataset.car;save();say([L().cars[S.car],L().pickPlace]);SFX.horn(S.car);pickStep='place';renderPick()}
  else if(b.dataset.place){startTrip(S.car,b.dataset.place)}});
$('pickBack').onclick=()=>{SFX.tap();pickStep='car';renderPick();say(L().pickCar)};
$('askSpeak').onclick=()=>say(pickStep==='car'?L().pickCar:L().pickPlace);
$('soundBtn').onclick=()=>{S.sound=!S.sound;save();if(!S.sound){hush();setMusic(false)}renderChrome()};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{if(S.lang===b.dataset.lang)return;S.lang=b.dataset.lang;save();hush();renderChrome();say(pickStep==='car'?L().pickCar:L().pickPlace)});

let raf=0,lastT=0;
function startTrip(car,place){
  hush();buildTrip(car,place);screen='drive';$('garage').hidden=true;$('drive').hidden=false;$('doneOv').hidden=true;hideTask();
  $('horn').classList.remove('glow');shownStars=-1;shownPct=-1;resize();
  $('tripMe').innerHTML=CARS[car].side;$('tripGoal').innerHTML=SCENES[place].replace('<svg','<svg preserveAspectRatio="xMidYMid slice" style="border-radius:50%;border:3px solid #3b2a5c;background:#fff"');
  say([L().go[place],L().start]);setMusic(true);
  setTimeout(()=>{if(G&&G.place===place&&!G.started){G.started=true;G.lastInput=G.t}},1200/(G.fast||1));
  cancelAnimationFrame(raf);lastT=performance.now();raf=requestAnimationFrame(loop);
}
function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;if(screen==='drive'&&G){update(dt);draw()}fxStep(dt);raf=requestAnimationFrame(loop)}
function arrive(){
  hideTask();SFX.fanfare();confetti(140);setMusic(false);
  if(!S.visited.includes(G.place))S.visited.push(G.place);save();
  setTimeout(()=>{if(screen!=='drive')return;const l=L();$('doneScene').innerHTML=SCENES[G.place];$('doneTitle').textContent=l.placeNames[G.place];$('doneStars').innerHTML=ICON.starFace+`<span>${G.stars}</span>`;$('doneOv').hidden=false;
    say([l.arrive[G.place],l.lots]);G.ended=true},900/(G.fast||1));
}
function goGarage(step){hush();setMusic(false);screen='garage';$('drive').hidden=true;$('doneOv').hidden=true;$('garage').hidden=false;pickStep=step||'car';renderChrome();say(pickStep==='car'?L().pickCar:L().pickPlace)}
$('homeBtn').onclick=()=>{SFX.tap();goGarage('car')};
$('againBtn').onclick=()=>{SFX.tap();startTrip(G.car,G.place)};
$('otherBtn').onclick=()=>{SFX.tap();goGarage('place')};
$('speakBtn').onclick=()=>{if(!G)return;const b=G.ev.find(e=>e.type==='balloon'&&e.announced&&!e.resolved&&!e.done);const c=G.ev.find(e=>e.type==='cross'&&e.go&&!e.clear);
  if(c)say(L().cross[c.animal]);else if(b)say(L().find[b.target]);else say(L().start)};
addEventListener('resize',()=>{if(screen==='drive')resize();else sizeFx()});

buildSprites();renderChrome();sizeFx();raf=requestAnimationFrame(loop);
/* test hooks */
window.__drv={get G(){return G},get PZ(){return PZ},get S(){return S},get screen(){return screen},get said(){return said},T,startTrip,steer,honk,setFast(f){if(G)G.fast=f;window.__fast=f}};
</script>
</body>
</html>
