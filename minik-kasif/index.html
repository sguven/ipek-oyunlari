<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minik Kâşif İpek</title>
<meta name="description" content="Sesli, iki dilli sayı, renk ve şekil oyunu. A talking counting, colors and shapes game.">
<meta name="theme-color" content="#d6efff">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minik Kâşif">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* layout: single-column game table, sky background with a grassy hill at the bottom; single theme (a child's world) */
:root{
  --sky:#d6efff;--ink:#2b2d5c;--ink2:#5c5f92;--sun:#ffc531;--coral:#ff6f61;--card:#ffffff;--tint:#eef7ff;--ok:#26b56b;--okbg:#dcf6e7;--grass:#8fd16f;--grass2:#79c25a;--warnbg:#fff4d6;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.hills{position:fixed;left:0;right:0;bottom:0;height:90px;pointer-events:none;z-index:0;overflow:hidden}
.hills::before,.hills::after{content:"";position:absolute;bottom:-60px;height:140px;border-radius:50%}
.hills::before{left:-10%;width:70%;background:var(--grass2)}
.hills::after{right:-10%;width:75%;background:var(--grass)}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{font:800 30px/1 var(--display);display:flex;align-items:center;gap:8px;margin:0}
.brand svg{width:38px;height:38px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
a.games-link{text-decoration:none;min-height:40px;box-sizing:border-box}
.bar{display:flex;gap:2px;background:var(--card);padding:5px 10px;border-radius:999px;border:3px solid var(--ink)}
.bar svg{width:28px;height:28px;display:block}
.bar svg.pulse{animation:bounce .5s}
button{font-family:inherit}
.pill{font:800 15px var(--body);background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--ink)}
.pill svg{width:20px;height:20px}
.pill:active,.tile:active,.ch:active{transform:translateY(3px)}
.pill.small{font-size:13px;padding:6px 11px;box-shadow:0 3px 0 var(--ink)}
.lang{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--ink)}
.lang button{font:800 14px var(--body);border:0;background:none;color:var(--ink);padding:7px 12px;cursor:pointer;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.tile{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:18px 12px 14px;box-shadow:0 6px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.tile .art{height:78px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.tile .art{width:100%;min-width:0}
.tile .art svg{height:100%;width:auto;min-width:0;max-width:calc((100% - 4px) / 3);flex:0 1 auto}
.tile b{font:800 26px/1 var(--display)}
.tile span{font:700 12px var(--body);color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.hello{margin:0;font:700 18px/1.5 var(--body);color:var(--ink2);text-align:center;text-wrap:balance}
.voice-note{background:var(--warnbg);border:3px solid var(--ink);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.voice-note b{font:800 18px/1.2 var(--display)}
.voice-note p,.voice-note li{margin:0;font-weight:700;font-size:14px;line-height:1.5;color:var(--ink)}
.voice-note ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.board{background:var(--card);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:16px}
.ask{display:flex;align-items:center;gap:12px}
.ask h2{flex:1;min-width:0;margin:0;font:800 clamp(24px,5.5vw,36px)/1.1 var(--display);text-wrap:balance}
.round{width:56px;height:56px;border-radius:50%;border:4px solid var(--ink);cursor:pointer;flex:none;display:grid;place-items:center;padding:0;box-shadow:0 4px 0 var(--ink)}
.round svg{width:26px;height:26px}
.speak{background:var(--sun)}
.back{background:var(--card)}
.stage{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:6px;min-height:96px;background:var(--tint);border-radius:22px;padding:14px}
.stage .o{width:clamp(54px,14vw,76px);cursor:pointer;position:relative;animation:pop .45s backwards;background:none;border:0;padding:0}
.stage .o svg{width:100%;height:auto;display:block}
.stage .o[data-n]::after{content:attr(data-n);position:absolute;top:-4px;right:-4px;background:var(--ink);color:#fff;font:800 16px/1 var(--display);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px}
.ch{background:var(--card);border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:130px;font:800 60px/1 var(--display);color:var(--ink);animation:pop .4s backwards}
.ch svg{width:min(100%,108px);height:auto;display:block}
.dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:92px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--coral)}
.ch.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 6px 0 var(--ok);animation:bounce .55s}
.ch.no{animation:shake .45s;opacity:.3;pointer-events:none}
.streak{font:800 14px var(--body);color:var(--ink2);text-align:center;min-height:20px;margin:0}
:focus-visible{outline:4px solid var(--coral);outline-offset:3px}
.ov{position:fixed;inset:0;background:rgba(43,45,92,.55);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--card);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);padding:22px 18px;max-width:540px;width:100%;max-height:88vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:14px}
.card h3{margin:0;font:800 30px/1.1 var(--display);text-wrap:balance}
.card p{margin:0;color:var(--ink2);font-weight:700;line-height:1.5}
.big svg{width:min(60vw,220px);height:auto;animation:spin-in .7s}
.album{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.slot{aspect-ratio:1;max-width:100%;border-radius:20px;background:var(--tint);border:3px dashed #a9bddc;display:grid;place-items:center;font:800 30px var(--display);color:#a9bddc}
.slot.got{border:3px solid var(--ink);background:#fff6d2}
.slot svg{width:86%;height:auto}
.slot small{display:block;font:800 12px var(--body);color:var(--ink)}
.stats{display:flex;flex-direction:column;gap:12px;text-align:left}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--tint);border-radius:16px;padding:10px;text-align:center}
.kpi b{display:block;font:800 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font:700 12px var(--body);color:var(--ink2)}
.row{display:grid;grid-template-columns:80px minmax(0,1fr) 72px;align-items:center;gap:10px;font-weight:800;font-size:14px}
.track{height:14px;border-radius:999px;background:var(--tint);overflow:hidden}
.track i{display:block;height:100%;background:var(--ok);border-radius:999px}
.row em{font-style:normal;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px!important;font-weight:600!important}
.voice-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--tint);border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.15)}70%{transform:scale(.95)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
@keyframes spin-in{from{transform:scale(.2) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:420px){.ch{min-height:110px;font-size:50px}.brand{font-size:26px}}
.seg{display:inline-flex;align-items:stretch;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}.seg span{font:800 13px var(--body);padding:6px 4px 6px 12px;align-self:center}.seg button{font:800 13px var(--body);border:0;background:none;color:var(--ink);padding:6px 11px;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lang button,.seg button{min-height:40px}.pill.small{min-height:40px}
.card>.btns:last-child{position:sticky;bottom:-22px;background:var(--card);padding-block:10px 4px;margin-bottom:-4px}
@media (max-height:520px) and (orientation:landscape){.wrap{gap:10px;padding-block:8px 24px}.board{padding:10px;gap:10px}.ask h2{font-size:22px}.round{width:46px;height:46px}.stage{min-height:56px;padding:8px}.stage .o,.stage .it,.stage .q{width:48px}.stage .big{width:96px}.ch{min-height:86px;padding:6px}.ch svg{width:min(100%,70px)}.cloud{min-height:96px;padding:10px}.choices{gap:10px}}
</style>
</head>
<body>
<div class="hills" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <h1 class="brand" id="brand"></h1>
    <div class="hud">
      <a class="pill small games-link" id="gamesLink" href="../"></a>
      <div class="bar" id="bar"></div>
      <button class="pill" id="albumBtn"></button>
      <div class="lang" role="group" aria-label="Dil / Language">
        <button id="lang-tr" data-lang="tr">TR</button>
        <button id="lang-en" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <section id="home" style="display:flex;flex-direction:column;gap:16px">
    <p class="hello" id="hello"></p>
    <div class="voice-note" id="voiceNote" hidden></div>
    <div class="tiles" id="tiles"></div>
    <div class="btns">
      <button class="pill small" id="soundBtn"></button>
      <div class="seg" id="voiceSel" role="group" hidden><span id="voiceSelLabel"></span><button data-voice="kadin"></button></div>
      <button class="pill small" id="parentBtn"></button>
    </div>
  </section>

  <section id="play" class="board" hidden>
    <div class="ask">
      <button class="round back" id="backBtn"></button>
      <h2 id="prompt"></h2>
      <button class="round speak" id="speakBtn"></button>
    </div>
    <div class="stage" id="stage"></div>
    <div class="choices" id="choices"></div>
    <p class="streak" id="streak"></p>
  </section>
</div>

<div class="ov" id="rewardOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
    <div class="big" id="rewardArt"></div>
    <h3 id="rewardTitle"></h3>
    <p id="rewardText"></p>
    <div class="btns"><button class="pill" id="rewardGo"></button></div>
  </div>
</div>

<div class="ov" id="albumOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="albumTitle">
    <h3 id="albumTitle"></h3>
    <p id="albumText"></p>
    <div class="album" id="album"></div>
    <div class="btns"><button class="pill" data-close="albumOv" data-t="close"></button></div>
  </div>
</div>

<div class="ov" id="parentOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="parentTitle">
    <h3 id="parentTitle" data-t="parentTitle"></h3>
    <div class="stats" id="stats"></div>
    <p class="note" data-t="parentNote"></p>
    <div class="btns">
      <button class="pill small" id="resetBtn"></button>
      <button class="pill" data-close="parentOv" data-t="close"></button>
    </div>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

  }else{
    stage.hidden=true;stage.innerHTML='';
    ch.innerHTML=Q.options.map((o,i)=>`<button class="ch" data-v="${o.k}" style="${delay(i*80)}" aria-label="${cat==='color'?l.colors[o.k]:l.shapes[o.k][0]}">${cat==='color'?balloon(o.c):svg(o.d(o.c))}</button>`).join('');
  }
  ch.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(b));
}
function answer(b){
  if(locked)return;
  const v=Q.cat==='count'?+b.dataset.v:b.dataset.v,st=S.stats[Q.cat],l=L();
  if(v===Q.answer){
    locked=true;if(firstTry){st[0]++;st[1]++}
    b.classList.add('ok');ding();confetti(40);
    S.total++;S.stars++;S.streak=(S.streak||0)+1;S.best=Math.max(S.best,S.streak);
    say([pick(l.praise),goodText(Q)]);
    $('streak').textContent=S.streak>=3?l.streak(S.streak):'';
    if(S.streak%3===0)setTimeout(()=>confetti(70),300);
    const unlock=S.stars%5===0&&S.stickers<ANIMALS.length;
    if(unlock)S.stickers++;
    save();renderHud();
    const svgs=$('bar').querySelectorAll('svg'),last=svgs[(S.stars-1)%5];if(last&&!unlock)last.classList.add('pulse');
    setTimeout(()=>unlock?reward():next(),unlock?900:1700);
  }else{
    if(firstTry){st[1]++;firstTry=false}
    S.streak=0;$('streak').textContent='';save();
    b.classList.add('no');boop();say(l.tryAgain);
  }
}
function reward(){
  const l=L(),i=S.stickers-1,name=l.animals[i];
  $('rewardArt').innerHTML=animal(ANIMALS[i]);$('rewardTitle').textContent=l.newSticker(name);
  $('rewardText').textContent=S.stickers===ANIMALS.length?l.albumDone:l.albumSoFar(S.stickers,5);
  $('rewardOv').hidden=false;fanfare();confetti(140);say(l.stickerSay(S.lang==='en'?name.toLowerCase():name));
  $('rewardGo').focus();
}

/* ---------- interface ---------- */
function renderHud(){
  const l=L();
  $('brand').innerHTML=ICON.logo+l.name;
  $('gamesLink').innerHTML=svg(`<rect x="10" y="10" width="34" height="34" rx="9" fill="#ff7eb6" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><rect x="56" y="10" width="34" height="34" rx="9" fill="#ffd93d" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><rect x="10" y="56" width="34" height="34" rx="9" fill="#4aa8ff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><rect x="56" y="56" width="34" height="34" rx="9" fill="#5fd3b5" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`)+(S.lang==='tr'?'Oyunlar':'Games');$('gamesLink').setAttribute('aria-label',S.lang==='tr'?'Tüm oyunlar':'All games');
  const filled=S.stars%5;$('bar').innerHTML=[0,1,2,3,4].map(i=>starIcon(i<filled)).join('');
  $('bar').setAttribute('aria-label',l.starsLabel(filled));
  $('albumBtn').innerHTML=ICON.book+`${S.stickers}/${ANIMALS.length}`;$('albumBtn').setAttribute('aria-label',l.albumLabel);
}
function renderHome(){
  const l=L();$('hello').textContent=l.hello;
  $('tiles').innerHTML=MODES.map(m=>`<button class="tile" data-mode="${m.k}"><div class="art">${m.art()}</div><b>${l.modes[m.k]}</b><span>${m.k==='mix'?l.allInOne:l.level(level())}</span></button>`).join('');
  $('soundBtn').innerHTML=(S.sound?ICON.speaker:ICON.mute)+(S.sound?l.soundOn:l.soundOff);
  $('parentBtn').textContent=l.parent;
  renderVoiceNote();
}
function renderStatic(){
  const l=L();
  document.documentElement.lang=S.lang;document.title=l.name;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=l[e.dataset.t]);
  $('rewardGo').textContent=l.cont;$('resetBtn').textContent=l.reset;
  $('backBtn').innerHTML=ICON.back;$('backBtn').setAttribute('aria-label',l.back);
  $('speakBtn').innerHTML=ICON.speaker;$('speakBtn').setAttribute('aria-label',l.replay);
  ['tr','en'].forEach(k=>$('lang-'+k).setAttribute('aria-pressed',String(S.lang===k)));
}
function renderAll(){renderVoiceSel();renderStatic();renderHud();renderHome();if(screen==='play'&&Q){renderPrompt();renderBoard(false);$('streak').textContent=S.streak>=3?L().streak(S.streak):''}if(!$('albumOv').hidden)renderAlbum();if(!$('parentOv').hidden)renderStats()}
function show(s){screen=s;$('home').hidden=s!=='home';$('play').hidden=s!=='play';if(s==='home'){renderHome();hush()}}
function renderAlbum(){
  const l=L();$('albumTitle').textContent=l.albumTitle;
  $('albumText').textContent=S.stickers===ANIMALS.length?l.albumAll:l.albumNext(5-S.stars%5);
  $('album').innerHTML=ANIMALS.map((a,i)=>i<S.stickers?`<div class="slot got"><div>${animal(a)}<small>${l.animals[i]}</small></div></div>`:`<div class="slot" aria-label="${l.locked}">?</div>`).join('');
}
function renderStats(){
  const l=L();
  const rows=['count','color','shape'].map(k=>{const[c,t]=S.stats[k],p=t?Math.round(c/t*100):0;return`<div class="row"><span>${l.modes[k]}</span><div class="track"><i style="width:${p}%"></i></div><em>${t?p+'%':'—'} <small>(${c}/${t})</small></em></div>`}).join('');
  const v=VOICE[S.lang];
  $('stats').innerHTML=`<div class="kpis"><div class="kpi"><b>${S.total}</b><span>${l.totalStars}</span></div><div class="kpi"><b>${S.best}</b><span>${l.bestStreak}</span></div><div class="kpi"><b>${level()}/4</b><span>${l.diff}</span></div></div><p class="note" style="margin:0">${l.firstTry}</p>${rows}<p class="note" style="margin:0">${l.nowShowing(maxCount(),nOpts())}</p><div class="voice-line"><span>${ownVoice()?l.voiceUsed(`${l.voiceNames[curVoice()]} · ${l.voiceBuiltIn}`):v?l.voiceUsed(`${v.name} (${v.lang})`):l.voiceNone}</span>${(v||ownVoice())?`<button class="pill small" id="testVoice">${l.voiceTest}</button>`:''}</div>`;
  if(v||ownVoice())$('testVoice').onclick=()=>{const was=S.sound;S.sound=true;say(l.voiceTestSay);S.sound=was};
}
let resetArm=false;
$('resetBtn').onclick=()=>{const l=L();if(!resetArm){resetArm=true;$('resetBtn').textContent=l.resetSure;setTimeout(()=>{resetArm=false;$('resetBtn').textContent=L().reset},4000);return}const keep={sound:S.sound,lang:S.lang};S=Object.assign(fresh(),keep);save();resetArm=false;renderAll()};

$('tiles').onclick=e=>{const t=e.target.closest('.tile');if(!t)return;mode=t.dataset.mode;show('play');next()};
$('backBtn').onclick=()=>show('home');
$('speakBtn').onclick=()=>Q&&say(qText(Q).speech);
$('albumBtn').onclick=()=>{renderAlbum();$('albumOv').hidden=false};
$('parentBtn').onclick=()=>{renderStats();$('parentOv').hidden=false};
$('soundBtn').onclick=()=>{S.sound=!S.sound;save();renderHome();if(!S.sound)hush()};
$('rewardGo').onclick=()=>{$('rewardOv').hidden=true;next()};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{if(S.lang===b.dataset.lang)return;S.lang=b.dataset.lang;save();hush();renderAll();if(screen==='play'&&Q)say(qText(Q).speech)});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close).hidden=true});
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o&&o.id!=='rewardOv')o.hidden=true}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')['albumOv','parentOv'].forEach(id=>$(id).hidden=true)});
addEventListener('resize',()=>{fx.width=innerWidth;fx.height=innerHeight});

renderAll();show('home');watchVoices();
</script>
</body>
</html>
