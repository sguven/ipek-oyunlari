<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İpek'in Zekâ Oyunları</title>
<meta name="description" content="Hafıza kartları, yapboz, robot yolu (kodlamaya ilk adım), hangisi farklı ve sıralama: seviyeli zekâ oyunları.">
<meta name="theme-color" content="#eef3ff">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zekâ Oyunları">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* layout: ana sayfa = baykuş + 5 oyun kartı; oyun = üst çubuk (geri, ad, bölüm noktaları, dinle) + oyun alanı. */
:root{
  --bg:#eef3ff;--ink:#3b2a5c;--ink2:#6c5a92;--card:#fffdfb;--tint:#f4f7ff;--ok:#1f9e66;--okbg:#dcf6e9;--bad:#ffd6d6;--gold:#ffcb3d;--pink:#ff7eb6;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,sans-serif;color-scheme:light;
}
[hidden]{display:none!important}
html,body{min-height:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button,a{font-family:inherit}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
body.playing .wrap{padding-block:8px 18px;gap:10px}
body.playing header{display:none}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{font:700 28px/1 var(--display);display:flex;align-items:center;gap:8px;margin:0;text-wrap:balance}
.brand svg{width:46px;height:46px;flex:none}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:800 15px var(--body);background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--ink);min-height:44px;text-decoration:none;box-sizing:border-box}
.pill svg{width:22px;height:22px}
.pill.small{font-size:13px;padding:6px 11px;box-shadow:0 3px 0 var(--ink);min-height:40px}
.pill.big{font:700 22px var(--display);background:var(--gold);padding:10px 26px;min-height:58px}
.pill.go{background:#7ee0b0}
.pill:active,.round:active,.gcard:active,.mc:active,.ch:active,.arrow:active,.tcard:active,.lvd:active{transform:translateY(3px)}
.lang{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--ink)}
.lang button{font:800 14px var(--body);border:0;background:none;color:var(--ink);padding:7px 12px;cursor:pointer;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.hero{display:flex;align-items:center;gap:12px;background:var(--card);border:4px solid var(--ink);border-radius:30px;box-shadow:0 7px 0 var(--ink);padding:12px 16px}
.hero .owl{width:clamp(76px,19vw,112px);flex:none}.hero .owl svg{width:100%;height:auto}
.hero b{display:block;font:700 clamp(20px,5vw,26px)/1.2 var(--display);margin-bottom:4px}
.hero p{margin:0;font:700 clamp(15px,3.8vw,18px)/1.45 var(--body);color:var(--ink2)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.gcard{display:flex;align-items:center;gap:12px;background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:12px;cursor:pointer;color:var(--ink);text-align:left}
.gcard .ic{width:76px;height:76px;flex:none;border-radius:20px;border:3px solid var(--ink);display:grid;place-items:center;font-size:44px;line-height:1}
.gcard .ic svg{width:60px;height:60px}
.gcard b{display:block;font:700 21px/1.1 var(--display)}
.gcard small{display:block;font:700 14px/1.3 var(--body);color:var(--ink2);margin-top:3px}
.gcard .sb{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap}.gcard .sb svg{width:16px;height:16px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
/* oyun ekranı */
.topbar{display:flex;align-items:center;gap:8px;background:var(--card);border:4px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:6px 8px}
.topbar h2{flex:1;min-width:0;margin:0;font:700 clamp(18px,4.5vw,25px)/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:50px;height:50px;border-radius:50%;border:4px solid var(--ink);cursor:pointer;flex:none;display:grid;place-items:center;padding:0;box-shadow:0 4px 0 var(--ink);background:var(--card)}
.round svg{width:24px;height:24px}.round.speak{background:var(--gold)}
.lvls{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.lvd{min-width:40px;height:40px;border-radius:14px;border:3px solid var(--ink);background:var(--card);font:700 17px var(--display);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0 4px;box-shadow:0 3px 0 var(--ink)}
.lvd.done{background:#fff1b8}.lvd.cur{outline:4px solid var(--pink);outline-offset:2px}.lvd:disabled{opacity:.35;cursor:default}
.area{background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center;position:relative;overflow:hidden}
.owlrow{display:flex;align-items:center;gap:10px;width:100%}
.owlrow .owl{width:58px;flex:none}.owlrow .owl svg{width:100%;height:auto}
.owlrow .bub{flex:1;background:var(--tint);border:3px solid var(--ink);border-radius:18px;padding:8px 12px;font:700 clamp(15px,3.8vw,18px)/1.35 var(--display)}
.dots{display:flex;gap:7px}.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:#fff}.dots i.on{background:var(--gold)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.14)}70%{transform:scale(.95)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,203,61,.0)}50%{box-shadow:0 0 0 12px rgba(255,203,61,.55)}}
.shake{animation:shake .45s}
/* hafıza */
.mem{display:grid;gap:clamp(8px,2vw,14px);width:100%;max-width:560px}
.mc{display:block;width:100%;aspect-ratio:.82;border:0;padding:0;background:none;cursor:pointer;perspective:700px}
.mc .in{display:block;position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mc.open .in,.mc.got .in{transform:rotateY(180deg)}
.mc .fc{position:absolute;inset:0;border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-sizing:border-box}
.mc .bk{background:repeating-linear-gradient(45deg,#8fb8ff 0 10px,#a9c8ff 10px 20px)}
.mc .bk svg{width:46%;height:auto}
.mc .fr{background:#fff;transform:rotateY(180deg);font-size:clamp(34px,10vw,60px);line-height:1}
.mc.got .fr{background:var(--okbg);border-color:var(--ok)}
.mc.got{animation:bounce .5s}
/* robot */
.robo{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.board{position:relative;width:min(100%,420px,calc(100dvh - 400px));min-width:220px;aspect-ratio:1;background:#bfe9a6;border:4px solid var(--ink);border-radius:20px;display:grid;overflow:hidden;box-sizing:border-box}
@supports not (height:100dvh){.board{width:min(100%,420px,calc(100vh - 400px))}}
.cell{border:2px dashed rgba(59,42,92,.18);display:grid;place-items:center;position:relative}
.cell svg{width:72%;height:72%}
.cell .ap{font-size:clamp(22px,7vw,40px);line-height:1}
.cell .hd{width:24%;height:24%;border-radius:50%;background:#ff7eb6;opacity:.75;border:2px solid #fff}
.rob{position:absolute;display:grid;place-items:center;transition:left .38s ease,top .38s ease;pointer-events:none;z-index:2}
.rob span{font-size:clamp(28px,9vw,54px);line-height:1;display:block}
.rob.bump span{animation:shake .45s}
.prog{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:52px;width:100%;max-width:520px;background:var(--tint);border:3px dashed #9fb6d4;border-radius:18px;padding:6px;box-sizing:border-box}
.prog .slot{width:42px;height:42px;border-radius:12px;border:3px solid #c9d6e6;background:#fff;display:grid;place-items:center}
.prog .slot.f{border-color:var(--ink);background:#fff3c4}
.prog .slot.run{background:#7ee0b0;transform:scale(1.12)}
.prog .slot svg{width:30px;height:30px}
.pad{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.arrow{width:64px;height:64px;border-radius:18px;border:4px solid var(--ink);background:#ffd98a;box-shadow:0 5px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.arrow svg{width:42px;height:42px}
.arrow.del{background:#ffd6d6;width:56px}
.arrow:disabled{opacity:.45}
/* hangisi farklı */
.choices{display:grid;gap:12px;width:100%;max-width:620px}
.ch{background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);aspect-ratio:1;cursor:pointer;display:grid;place-items:center;font-size:clamp(48px,14vw,84px);line-height:1;padding:0;animation:pop .4s backwards}
.ch.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 6px 0 var(--ok);animation:bounce .5s}
.ch.no{background:var(--bad);opacity:.6;pointer-events:none}
.ch.dim{opacity:.55}
/* sırala */
.slots{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.sl{width:clamp(62px,18vw,104px);aspect-ratio:1;border:4px dashed #9fb6d4;border-radius:20px;display:grid;place-items:center;background:var(--tint);position:relative}
.sl b{position:absolute;top:-12px;left:-10px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font:700 15px/28px var(--display);text-align:center}
.sl.f{border-style:solid;border-color:var(--ok);background:#fff;animation:pop .3s}
.sep{font:700 22px var(--display);color:var(--ink2)}
.tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:90px}
.tcard{width:clamp(66px,19vw,110px);aspect-ratio:1;border:4px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;overflow:hidden}
.tcard.gone{visibility:hidden}
.em{line-height:1;display:block}
.dice svg{width:80%;height:80%}
/* yapboz */
.jig{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.jb{position:relative;width:min(100%,440px,calc(100dvh - 360px));min-width:220px;aspect-ratio:1;border:4px solid var(--ink);border-radius:18px;background:#fff;overflow:hidden;box-sizing:border-box}
@supports not (height:100dvh){.jb{width:min(100%,440px,calc(100vh - 360px))}}
.jb .ghost{position:absolute;inset:0;opacity:.22;filter:grayscale(.3)}
.jb .ghost svg,.jb .cellj svg,.pc svg{width:100%;height:100%;display:block}
.cellj{position:absolute;box-sizing:border-box;border:1.5px dashed rgba(59,42,92,.35)}
.cellj.sel{background:rgba(255,126,182,.18)}
.cellj.f{border:0;animation:pop .25s}
.jb.won{animation:glow 1.2s 2}
.ptray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px}
.pc{border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;cursor:grab;padding:0;touch-action:none;box-shadow:0 4px 0 var(--ink)}
.pc.sel{outline:4px solid var(--pink);outline-offset:2px}
.pc.gone{display:none}
.drag{position:fixed;z-index:40;pointer-events:none;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 10px 20px rgba(0,0,0,.25);transform:translate(-50%,-50%) scale(1.05)}
.drag svg{width:100%;height:100%;display:block}
/* pencereler */
.ov{position:fixed;inset:0;background:rgba(59,42,92,.55);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--card);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);padding:22px 18px;max-width:520px;width:100%;box-sizing:border-box;max-height:90vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.card h3{margin:0;font:700 26px/1.15 var(--display);text-wrap:balance}
.card p{margin:0;color:var(--ink2);font-weight:700;line-height:1.5}
.card .big{font-size:84px;line-height:1;animation:pop .6s}
.stars{display:flex;gap:6px}.stars svg{width:52px;height:52px;animation:pop .5s backwards}.stars svg:nth-child(2){animation-delay:.15s}.stars svg:nth-child(3){animation-delay:.3s}
.note{font-size:14px!important;font-weight:600!important;text-align:left}
.note li{margin-bottom:6px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:900px) and (orientation:landscape){.jig,.robo{flex-direction:row;align-items:flex-start;justify-content:center}.ptray{max-width:420px}.robo>div:last-child{max-width:420px}}
@media (max-width:420px){.brand{font-size:22px}.round{width:46px;height:46px}.arrow{width:56px;height:56px}.arrow svg{width:36px;height:36px}.lvd{min-width:36px;height:36px}}
@media (max-height:500px) and (orientation:landscape){.robo{flex-direction:row;align-items:flex-start;justify-content:center;flex-wrap:wrap}.board{width:min(calc(100vh - 150px),46vw)}.jig{flex-direction:row;align-items:flex-start;justify-content:center}.jb{width:min(calc(100vh - 150px),46vw)}.ptray{max-width:46vw}.owlrow .bub{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand" id="brand"></h1>
    <div class="hbtns">
      <div class="lang" role="group" aria-label="Dil / Language"><button data-lang="tr">TR</button><button data-lang="en">EN</button></div>
      <a class="pill small" id="gamesLink" href="../"></a>
    </div>
  </header>
  <section id="home" style="display:flex;flex-direction:column;gap:16px">
    <div class="hero"><div class="owl" id="heroOwl"></div><div><b id="heroT"></b><p id="heroP"></p></div></div>
    <div class="games" id="games"></div>
    <div class="btns"><button class="pill small" id="soundBtn"></button><button class="pill small" id="parentBtn"></button></div>
  </section>
  <section id="game" hidden style="display:flex;flex-direction:column;gap:10px">
    <div class="topbar"><button class="round" id="backBtn"></button><h2 id="gtitle"></h2><button class="round speak" id="speakBtn"></button></div>
    <div class="lvls" id="lvls"></div>
    <div class="area" id="area"></div>
  </section>
</div>
<div class="ov" id="doneOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
    <div class="big" id="doneBig"></div>
    <div class="stars" id="doneStars"></div>
    <h3 id="doneTitle"></h3>
    <p id="doneText"></p>
    <div class="btns"><button class="pill big" id="nextBtn"></button></div>
    <div class="btns"><button class="pill small" id="againBtn"></button><button class="pill small" id="homeBtn"></button></div>
  </div>
</div>
<div class="ov" id="parentOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="parentTitle">
    <h3 id="parentTitle"></h3>
    <div class="note" id="parentNote" style="color:var(--ink2);line-height:1.5"></div>
    <div class="btns"><button class="pill small" id="resetBtn"></button><button class="pill" id="parentClose"></button></div>
  </div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
(function(){
"use strict";
const INK='#3b2a5c',$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const svg=(inner,vb='0 0 100 100')=>`<svg viewBox="${vb}" xmlns="${NS}" aria-hidden="true">${inner}</svg>`;
const st=(w=4)=>`stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
function starPts(cx,cy,R,r,n=5){const p=[];for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
const STAR=on=>svg(`<polygon points="${starPts(50,54,44,19)}" fill="${on?'#ffcb3d':'#d8dde6'}" ${st(6)}/>`);
const OWL=svg(`<ellipse cx="50" cy="60" rx="34" ry="36" fill="#a87b52" ${st(4)}/><ellipse cx="50" cy="70" rx="20" ry="22" fill="#f2dcbc"/><path d="M20 30 L28 12 L38 28 Z M80 30 L72 12 L62 28 Z" fill="#a87b52" ${st(4)}/><circle cx="36" cy="44" r="13" fill="#fff" ${st(3)}/><circle cx="64" cy="44" r="13" fill="#fff" ${st(3)}/><circle cx="37" cy="45" r="6" fill="${INK}"/><circle cx="63" cy="45" r="6" fill="${INK}"/><circle cx="39" cy="43" r="2" fill="#fff"/><circle cx="65" cy="43" r="2" fill="#fff"/><path d="M45 56 L55 56 L50 64 Z" fill="#ff9f43" ${st(3)}/><path d="M22 34 L40 30 L50 36 L60 30 L78 34" stroke="${INK}" stroke-width="4" fill="none"/><rect x="28" y="22" width="44" height="8" rx="2" fill="#3b2a5c"/><path d="M50 22 L74 14 L50 6 L26 14 Z" fill="#3b2a5c"/><path d="M72 15 L76 30" stroke="#ffcb3d" stroke-width="3"/><circle cx="76" cy="31" r="3" fill="#ffcb3d"/>`);
const ARROW=d=>svg(`<path d="M50 14 L82 50 H62 V86 H38 V50 H18 Z" fill="#4aa8ff" ${st(5)} transform="rotate(${{u:0,r:90,d:180,l:270}[d]} 50 50)"/>`);
const ICON={
  back:svg(`<path d="M60 20 L30 50 L60 80" stroke="${INK}" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`),
  speaker:svg(`<path d="M18 38 H36 L58 20 V80 L36 62 H18 Z" fill="${INK}"/><path d="M70 34 Q80 50 70 66" stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round"/>`),
  mute:svg(`<path d="M18 38 H36 L58 20 V80 L36 62 H18 Z" fill="${INK}"/><path d="M70 38 L88 62 M88 38 L70 62" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`),
  games:svg(`<rect x="10" y="10" width="34" height="34" rx="9" fill="#ff7eb6" ${st(5)}/><rect x="56" y="10" width="34" height="34" rx="9" fill="#ffd93d" ${st(5)}/><rect x="10" y="56" width="34" height="34" rx="9" fill="#4aa8ff" ${st(5)}/><rect x="56" y="56" width="34" height="34" rx="9" fill="#5fd3b5" ${st(5)}/>`),
  logo:svg(`<path d="M30 78 C14 74 10 54 20 44 C16 28 32 16 46 22 C54 10 76 14 78 30 C92 34 92 56 80 62 C82 78 64 86 54 78 C46 88 34 86 30 78 Z" fill="#ff9fc8" ${st(5)}/><path d="M38 40 Q46 34 52 42 Q58 50 66 44 M34 60 Q44 52 52 60 Q60 68 70 60" fill="none" ${st(4)}/>`),
  del:svg(`<path d="M34 24 H84 V76 H34 L12 50 Z" fill="#fff" ${st(5)}/><path d="M48 38 L70 62 M70 38 L48 62" ${st(7)}/>`),
  play:svg(`<polygon points="28,16 84,50 28,84" fill="#1f9e66" ${st(5)}/>`),
  rock:svg(`<path d="M14 72 Q10 50 28 40 Q34 22 54 24 Q74 22 82 42 Q94 56 86 74 Q50 86 14 72 Z" fill="#a9a2b4" ${st(5)}/><path d="M36 44 Q44 40 50 46 M60 58 Q68 54 72 60" fill="none" ${st(3)}/>`),
  goal:svg(`<polygon points="${starPts(50,54,44,19)}" fill="#ffcb3d" ${st(5)}/>`),
  brain:svg(`<path d="M30 78 C14 74 10 54 20 44 C16 28 32 16 46 22 C54 10 76 14 78 30 C92 34 92 56 80 62 C82 78 64 86 54 78 C46 88 34 86 30 78 Z" fill="#ff9fc8" ${st(5)}/><path d="M38 40 Q46 34 52 42 Q58 50 66 44 M34 60 Q44 52 52 60 Q60 68 70 60" fill="none" ${st(4)}/>`)
};

/* ===================== YAPBOZ RESİMLERİ (Boyama Kitabı'ndan, önerilen renklerle) ===================== */

const petals=(cx,cy,n,dist,r,c)=>Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return C(+(cx+dist*Math.cos(a)).toFixed(1),+(cy+dist*Math.sin(a)).toFixed(1),r,c)});

const VOICE={tr:null,en:null};const hasTTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
function scoreVoice(v,l){
  /* en doğal kadın sesi öne: iPad/Mac'te indirilen "Gelişmiş/Premium" sesler, Edge'in "Natural" sesleri, Android'de Google sesi */
  const n=(v.name||'').toLowerCase(),u=(v.voiceURI||'').toLowerCase(),lg=String(v.lang||'').toLowerCase().replace('_','-');let s=0;
  if(/premium|enhanced|gelişmiş|geliştirilmiş|yüksek kalite|natural|neural|online/.test(n)||/premium|enhanced|neural/.test(u))s+=8;
  if(/google/.test(n))s+=4;
  if(l==='tr'&&/yelda|emel|filiz|seda|türkçe/.test(n))s+=3;
  if(l==='tr'&&/ahmet|tolga|cem|kerem|erkek|male/.test(n))s-=4;
  if(l==='tr'&&lg==='tr-tr')s+=2;
  if(l==='en'&&lg==='en-us')s+=3;
  if(l==='en'&&/samantha|ava|allison|aria|jenny|zoe|karen|serena/.test(n))s+=2;
  if(/compact|eloquence|grandpa|grandma|bad news|bells|bubbles|cellos|jester|organ|trinoids|whisper|wobble|zarvox|albert|boing|fred|junior|ralph|kathy|bahh|hysterical|superstar|good news/.test(n))s-=8;
  if(v.localService===false)s+=1;
  if(v.default)s+=1;
  return s;
}
function loadVoices(){if(!hasTTS)return;let vs=[];try{vs=speechSynthesis.getVoices()||[]}catch(e){}
  ['tr','en'].forEach(l=>{const c=vs.filter(v=>{const lg=String(v.lang||'').toLowerCase().replace('_','-');return lg===l||lg.startsWith(l+'-')});c.sort((a,b)=>scoreVoice(b,l)-scoreVoice(a,l));VOICE[l]=c[0]||null})}
if(hasTTS){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
let AC=null;function audioCtx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC}catch(e){return null}}
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
let unlocked=false;
function unlockAudio(){const a=audioCtx();if(!a)return;if(a.state!=='running')a.resume().catch(()=>{});if(!unlocked){try{const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0);unlocked=true}catch(e){}}}
let ttsPrimed=false;
function primeTTS(){if(ttsPrimed||!hasTTS)return;ttsPrimed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang=S.lang==='tr'?'tr-TR':'en-US';speechSynthesis.speak(u)}catch(e){}}
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{unlockAudio();primeTTS()},{capture:true,passive:true}));

const CLIPS={base:'audio/',map:null};
try{fetch(CLIPS.base+'manifest.json').then(r=>r.ok?r.json():null).then(m=>{if(m&&m.clips){CLIPS.map=m;Object.values(m.clips).forEach(id=>clipBuf(id).catch(()=>{}))}}).catch(()=>{})}catch(e){}
const curVoice=()=>{const vs=CLIPS.map?CLIPS.map.voices:[];return vs.includes(S.voice)?S.voice:vs[0]};
const bufs={};
function clipBuf(id){const a=audioCtx(),k=curVoice()+'/'+id;if(!a)return Promise.reject();if(!bufs[k]){bufs[k]=fetch(CLIPS.base+k+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>new Promise((res,rej)=>a.decodeAudioData(b,res,rej)));bufs[k].catch(()=>{delete bufs[k]})}return bufs[k]}
let clipGen=0,clipSrc=null,SQ=[],sqBusy=false,cut=false,ttsOn=0,liveUtt=0;
function stopClips(){clipGen++;try{clipSrc&&clipSrc.stop()}catch(e){}clipSrc=null}
const ttsBusy=()=>ttsOn>0;
function hush(){SQ=[];sqBusy=false;cut=false;stopClips()}
setInterval(()=>{if(ttsOn&&hasTTS){try{if(speechSynthesis.paused)speechSynthesis.resume()}catch(e){}}},500);
function playBuf(buf,gen){return new Promise(async res=>{const a=audioCtx();if(gen!==clipGen||!a)return res();if(a.state!=='running'){try{await Promise.race([a.resume(),new Promise(r=>setTimeout(r,600))])}catch(e){}}if(gen!==clipGen)return res();const s=a.createBufferSource();s.buffer=buf;s.connect(a.destination);let done=false;const fin=()=>{if(done)return;done=true;if(clipSrc===s)clipSrc=null;res()};s.onended=fin;setTimeout(fin,buf.duration*1000+400);clipSrc=s;try{s.start()}catch(e){fin()}})}
function speakTTS(text,retry){return new Promise(res=>{
  if(!hasTTS)return res();const v=VOICE[S.lang]||(loadVoices(),VOICE[S.lang]);
  const r=S.lang==='tr'?.9:.92;let done=false,started=false,live=false;ttsOn++;
  const fin=()=>{if(done)return;done=true;ttsOn=Math.max(0,ttsOn-1);if(live){live=false;liveUtt=Math.max(0,liveUtt-1)}res()};
  const onStart=()=>{if(!started){started=true;live=true;liveUtt++}};
  try{const u=new SpeechSynthesisUtterance(text);if(v)u.voice=v;u.lang=v?v.lang:(S.lang==='tr'?'tr-TR':'en-US');u.rate=r;u.pitch=1.1;u.onstart=onStart;u.onboundary=onStart;u.onend=fin;u.onerror=fin;if(speechSynthesis.paused)speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){return fin()}
  setTimeout(()=>{if(started||done)return;if(liveUtt===0){try{speechSynthesis.cancel()}catch(e){}done=true;ttsOn=Math.max(0,ttsOn-1);if(!retry)speakTTS(text,true).then(res);else res()}},1500);
  setTimeout(fin,500+text.length*85/r+900);
})}
async function speakPart(p,gen){
  if(S.lang==='tr'&&CLIPS.map){const id=CLIPS.map.clips[p]||CLIPS.map.clips[p+'!'];if(id){let b=null;try{b=await clipBuf(id)}catch(e){}if(b&&gen===clipGen){await playBuf(b,gen);return}}}
  if(gen===clipGen)await speakTTS(p);
}
async function pump(){if(sqBusy)return;sqBusy=true;const gen=clipGen;
  while(SQ.length&&gen===clipGen){const parts=SQ.shift();cut=false;for(let i=0;i<parts.length;i++){if(gen!==clipGen||cut)break;await speakPart(parts[i],gen);if(i<parts.length-1)await new Promise(r=>setTimeout(r,150))}}
  if(gen===clipGen)sqBusy=false}
function say(t,queue){if(!S.sound)return;const parts=(Array.isArray(t)?t:[t]).filter(Boolean);if(!parts.length)return;
  if(!queue){SQ=[];if(!ttsBusy()){sqBusy=false;stopClips()}else cut=true}SQ.push(parts);pump()}
function tone(f,d,t0,type,vol){if(!S.sound)return;const a=audioCtx();if(!a)return;try{const t=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.12,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function bloop(){if(!S.sound)return;const a=audioCtx();if(!a)return;try{const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(760,t+.12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.25)}catch(e){}}
const pling=()=>{tone(880,.15);tone(1320,.18,.06)};
const harp=()=>[523,587,659,698,784,880,988,1047].forEach((f,i)=>tone(f,.3,i*.07));
const boop=()=>{tone(330,.14,0,'sine',.1);tone(262,.18,.1,'sine',.1)};
function speechDone(maxMs){return new Promise(res=>{const t0=Date.now();(function p(){if((!sqBusy&&!SQ.length&&!ttsBusy())||Date.now()-t0>maxMs)return res();setTimeout(p,120)})()})}

const fx=$('fx');let fctx=null;try{fctx=fx.getContext('2d')}catch(e){}
let parts=[],fxOn=false;const FXC=['#ff5a8a','#ff9f43','#ffd93d','#4cd17a','#4aa8ff','#a66bff'];
function confetti(n){if(reduce||!fctx)return;fx.width=innerWidth;fx.height=innerHeight;for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.5,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:6+Math.random()*7,c:FXC[i%6],a:Math.random()*6,va:(Math.random()-.5)*.3,life:1});if(!fxOn){fxOn=true;requestAnimationFrame(fxTick)}}
function fxTick(){fctx.clearRect(0,0,fx.width,fx.height);parts.forEach(p=>{p.vy+=.42;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life-=.012;fctx.save();fctx.globalAlpha=Math.max(0,p.life);fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.fillStyle=p.c;fctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);fctx.restore()});parts=parts.filter(p=>p.life>0&&p.y<fx.height+40);if(parts.length)requestAnimationFrame(fxTick);else{fxOn=false;fctx.clearRect(0,0,fx.width,fx.height)}}

const POOLS={animal:['🐶','🐱','🐰','🐻','🐮','🐸','🦁','🐘','🐴','🐑','🐵','🦒'],fruit:['🍎','🍌','🍐','🍇','🍓','🍒','🍉','🍊','🍍'],vehicle:['🚗','🚌','🚲','✈️','🚂','🚢','🚁','🚜'],sea:['🐟','🐙','🦀','🐬','🐳','🐢'],fly:['🐦','🦋','🐝','🦉','🦆']};

function runMemory(lv){
  const cfg=MEM[lv],pool=cfg.pool.split('+').flatMap(k=>POOLS[k]),items=shuffle(pool).slice(0,cfg.n),cards=shuffle(items.concat(items));
  const cols=cards.length<=6?3:cards.length<=8?4:cards.length<=12?4:5;
  let open=[],got=0,moves=0,lock=!!cfg.peek;
  $('area').innerHTML=owlSay(cfg.peek?L().memPeek:L().memI)+`<div class="mem" style="grid-template-columns:repeat(${cols},minmax(0,1fr));max-width:${cols*130}px">${cards.map((e,i)=>`<button class="mc${cfg.peek?' open':''}" data-i="${i}" data-e="${e}" aria-label="kart ${i+1}"><span class="in"><span class="fc bk">${svg(`<polygon points="${starPts(50,54,40,17)}" fill="#fff" ${st(5)}/>`)}</span><span class="fc fr">${e}</span></span></button>`).join('')}</div>`;
  const btns=[...$('area').querySelectorAll('.mc')];
  if(cfg.peek){instr(L().memPeek);later(()=>{btns.forEach(b=>b.classList.remove('open'));lock=false;$('area').querySelector('.bub').textContent=L().memI;instr(L().memI)},cfg.peek)}else instr(L().memI);
  btns.forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('open')||b.classList.contains('got'))return;
    b.classList.add('open');tone(700,.06);open.push(b);
    if(open.length<2)return;
    moves++;const[a,c]=open;open=[];
    if(a.dataset.e===c.dataset.e){got++;setTimeout(()=>{a.classList.add('got');c.classList.add('got');pling()},300);say(cap(nm(a.dataset.e))+'!');
      if(got===cfg.n){const extra=moves-cfg.n;later(()=>levelDone(starsFor(extra,Math.ceil(cfg.n*.5),cfg.n*1.5)),1100)}}
    else{lock=true;later(()=>{boop();a.classList.remove('open');c.classList.remove('open');lock=false},950)}

  function place(i){const cell=jb.querySelector(`.cellj[data-c="${i}"]`),pc=tray.querySelector(`.pc[data-p="${i}"]`);cell.innerHTML=pieceSVG(i);cell.classList.add('f');pc.classList.add('gone');placed++;bloop();if(sel===pc)sel=null;
    if(placed===N){jb.classList.add('won');const g=jb.querySelector('.ghost');if(g)g.remove();say([cap(p[S.lang])+'!',praise()]);later(()=>levelDone(starsFor(miss,1,3)),1600)}}
  function wrong(cell){miss++;boop();if(cell){cell.classList.remove('shake');void cell.offsetWidth;cell.classList.add('shake')}say(L().jigNo)}

  jb.querySelectorAll('.cellj').forEach(c=>c.onclick=()=>{if(!sel||c.classList.contains('f'))return;tryCell(+c.dataset.c,sel);if(sel){sel.classList.remove('sel');sel=null}jb.querySelectorAll('.cellj').forEach(x=>x.classList.remove('sel'))});

}

/* ===================== 3) ROBOT YOLU ===================== */
/* konumlar [satır, sütun]; taşlar geçilmez; elmalar varsa önce hepsi toplanır */
const ROB=[
 {n:3,r:[2,0],s:[2,2],rocks:[]},
 {n:3,r:[2,0],s:[0,0],rocks:[]},
 {n:3,r:[2,0],s:[0,2],rocks:[[1,1]]},
 {n:3,r:[1,0],s:[1,2],rocks:[[1,1]]},
 {n:4,r:[3,0],s:[0,3],rocks:[[2,0],[1,2],[3,2]]},
 {n:4,r:[0,0],s:[3,3],rocks:[[0,1],[1,1],[2,3]]},
 {n:4,r:[3,3],s:[0,0],rocks:[[2,2],[2,1],[1,3],[0,1]]},
 {n:4,r:[3,0],s:[0,3],rocks:[[2,1],[1,1]],apples:[[3,3]]},
 {n:5,r:[4,0],s:[0,4],rocks:[[3,1],[2,2],[1,3],[4,2],[0,1]]},
 {n:5,r:[2,0],s:[2,4],rocks:[[2,2],[1,2],[3,2]],apples:[[0,2],[4,2]]}
];
const DIRS={u:[-1,0],d:[1,0],l:[0,-1],r:[0,1]};
function robSolve(c){/* en kısa yol (elmalar dahil) */
  const ap=c.apples||[],key=(r,k,m)=>r+','+k+','+m,full=(1<<ap.length)-1,isRock=(r,k)=>c.rocks.some(x=>x[0]===r&&x[1]===k);
  const apIdx=(r,k)=>ap.findIndex(x=>x[0]===r&&x[1]===k);
  const start=[c.r[0],c.r[1],0,[]],seen=new Set([key(...start.slice(0,3))]),q=[start];
  while(q.length){const[r,k,m,path]=q.shift();if(r===c.s[0]&&k===c.s[1]&&m===full)return path;
    for(const d of ['u','r','d','l']){const nr=r+DIRS[d][0],nk=k+DIRS[d][1];if(nr<0||nk<0||nr>=c.n||nk>=c.n||isRock(nr,nk))continue;let nm2=m;const ai=apIdx(nr,nk);if(ai>=0)nm2|=1<<ai;const kk=key(nr,nk,nm2);if(seen.has(kk))continue;seen.add(kk);q.push([nr,nk,nm2,path.concat(d)])}}
  return null}
function runRobot(lv){
  const c=ROB[lv],sol=robSolve(c),MAX=Math.min(16,sol.length+4),ap=(c.apples||[]).map(a=>a.slice());
  let prog=[],running=false,fails=0,pos=c.r.slice(),got=new Set();
  const l=L(),cellHTML=(r,k)=>{let in_='';if(c.rocks.some(x=>x[0]===r&&x[1]===k))in_=ICON.rock;else if(c.s[0]===r&&c.s[1]===k)in_=ICON.goal;else{const ai=ap.findIndex(x=>x[0]===r&&x[1]===k);if(ai>=0)in_=`<span class="ap" data-ap="${ai}">🍎</span>`}return`<div class="cell" data-rc="${r}-${k}">${in_}</div>`};
  $('area').innerHTML=owlSay(ap.length?l.robApple:l.robI)+`<div class="robo"><div class="board" id="board" style="grid-template-columns:repeat(${c.n},1fr);grid-template-rows:repeat(${c.n},1fr)">${Array.from({length:c.n*c.n},(_,i)=>cellHTML(Math.floor(i/c.n),i%c.n)).join('')}<div class="rob" id="rob" style="width:${100/c.n}%;height:${100/c.n}%"><span>🤖</span></div></div>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:center;width:100%"><div class="prog" id="prog"></div>
    <div class="pad">${['l','u','d','r'].map(d=>`<button class="arrow" data-d="${d}" aria-label="${d}">${ARROW(d)}</button>`).join('')}<button class="arrow del" id="del" aria-label="sil">${ICON.del}</button></div>
    <button class="pill big go" id="run">${ICON.play}</button></div></div>`;
  const rob=$('rob');
  const putRob=()=>{rob.style.left=pos[1]*100/c.n+'%';rob.style.top=pos[0]*100/c.n+'%'};putRob();
  const renderProg=(run=-1)=>{$('prog').innerHTML=Array.from({length:Math.max(prog.length,Math.min(MAX,sol.length))},(_,i)=>`<span class="slot${prog[i]?' f':''}${i===run?' run':''}">${prog[i]?ARROW(prog[i]):''}</span>`).join('')};renderProg();
  const setLock=v=>{running=v;$('area').querySelectorAll('.arrow,#run').forEach(b=>b.disabled=v)};
  function reset(){pos=c.r.slice();got=new Set();$('board').querySelectorAll('.ap').forEach(a=>a.style.visibility='');putRob();renderProg();setLock(false)}
  function showHint(){let p=c.r.slice();sol.forEach(d=>{p=[p[0]+DIRS[d][0],p[1]+DIRS[d][1]];const cell=$('board').querySelector(`[data-rc="${p[0]}-${p[1]}"]`);if(cell&&!cell.querySelector('svg')&&!cell.querySelector('.ap'))cell.insertAdjacentHTML('beforeend','<i class="hd"></i>')});say(L().robHint,true)}
  $('area').querySelectorAll('.arrow[data-d]').forEach(b=>b.onclick=()=>{if(running)return;if(prog.length>=MAX){boop();say(L().robFull);return}prog.push(b.dataset.d);tone(600+prog.length*30,.07);renderProg()});
  $('del').onclick=()=>{if(running||!prog.length)return;prog.pop();tone(300,.07);renderProg()};
  $('run').onclick=async()=>{
    if(running)return;if(!prog.length){boop();say(L().robEmpty);return}
    setLock(true);reset();setLock(true);const g=G.gen;
    for(let i=0;i<prog.length;i++){
      renderProg(i);await new Promise(r=>setTimeout(r,430));if(g!==G.gen)return;
      const d=prog[i],nr=pos[0]+DIRS[d][0],nk=pos[1]+DIRS[d][1];
      const wall=nr<0||nk<0||nr>=c.n||nk>=c.n,rock=!wall&&c.rocks.some(x=>x[0]===nr&&x[1]===nk);
      if(wall||rock){rob.classList.remove('bump');void rob.offsetWidth;rob.classList.add('bump');boop();say(rock?L().robRock:L().robWall);return fail()}
      pos=[nr,nk];putRob();step();
      const ai=ap.findIndex(x=>x[0]===nr&&x[1]===nk);if(ai>=0&&!got.has(ai)){got.add(ai);const a=$('board').querySelector(`[data-ap="${ai}"]`);if(a)a.style.visibility='hidden';pling()}
    }
    await new Promise(r=>setTimeout(r,420));if(g!==G.gen)return;
    if(pos[0]===c.s[0]&&pos[1]===c.s[1]&&got.size===ap.length){renderProg();harp();say(praise());later(()=>levelDone(fails===0?3:fails<=2?2:1),1300);return}
    boop();say(got.size<ap.length&&pos[0]===c.s[0]&&pos[1]===c.s[1]?L().robApples:L().robShort);fail();
  };
  function fail(){fails++;G.miss=fails;later(()=>{reset();if(fails===2)showHint()},1100)}
  instr(ap.length?l.robApple:l.robI);
  G.test={sol,cfg:c};
}

/* ===================== 4) HANGİSİ FARKLI? ===================== */
const CATS={fruit:['🍎','🍌','🍐','🍇','🍓','🍒','🍉','🍊','🍍'],veg:['🥕','🥦','🌽','🥒','🍆','🥔','🧅'],animal:['🐶','🐱','🐰','🐻','🐮','🐸','🦁','🐘','🐴','🐑','🐵','🦒'],vehicle:['🚗','🚌','🚲','✈️','🚂','🚢','🚁','🚜'],
  clothes:['👕','👖','👗','🧦','🧢','👟','🧤','🧣'],sea:['🐟','🐙','🦀','🐬','🐳'],fly:['🐦','🦋','🐝','🦉'],red:['🍎','🍓','🍒','🚒','🌹','❤️'],yellow:['🍌','🌻','⭐','🐥','🧀'],green:['🥦','🐸','🍀','🥒','🌲','🍏']};
const ODD=[{k:3,pairs:'kinds'},{k:3,pairs:'kinds2'},{k:3,pairs:'colors'},{k:3,pairs:'near'},{k:4,pairs:'all'},{k:5,pairs:'all'}];
const PAIRS={kinds:[['fruit','vehicle'],['animal','clothes'],['vehicle','fruit'],['clothes','animal'],['fruit','clothes'],['animal','vehicle']],
  kinds2:[['sea','vehicle'],['veg','animal'],['clothes','veg'],['vehicle','sea'],['animal','clothes'],['veg','vehicle']],
  colors:[['red','yellow'],['yellow','green'],['green','red'],['red','green'],['yellow','red'],['green','yellow']],
  near:[['fruit','veg'],['veg','fruit'],['sea','animal'],['fly','animal'],['animal','sea'],['fruit','veg']]};
PAIRS.all=[...PAIRS.kinds,...PAIRS.kinds2,...PAIRS.colors,...PAIRS.near];
function runOdd(lv){
  const cfg=ODD[lv],ROUNDS=5;let round=0;G.miss=0;
  function one(){
    G.gen++;round++;const[A,B]=pick(PAIRS[cfg.pairs]);
    const same=shuffle(CATS[A]).slice(0,cfg.k),odd=pick(CATS[B].filter(e=>!CATS[A].includes(e))),opts=shuffle(same.concat(odd));let first=true;
    const cols=opts.length===4?2:opts.length===5?3:2;
    $('area').innerHTML=owlSay(L().oddI)+dotsHTML(ROUNDS,round-1)+`<div class="choices" style="grid-template-columns:repeat(${opts.length===4?4:opts.length},minmax(0,1fr))">${opts.map((e,i)=>`<button class="ch" data-e="${e}" style="animation-delay:${i*80}ms" aria-label="${nm(e)}">${e}</button>`).join('')}</div>`;
    if(innerWidth<520&&opts.length>=4)$('area').querySelector('.choices').style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
    $('area').querySelectorAll('.ch').forEach(b=>b.onclick=()=>{
      if(b.dataset.e===odd){b.classList.add('ok');$('area').querySelectorAll('.ch').forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('dim')});pling();
        const c=L().cats[A],why=S.lang==='tr'?`${cap(listTxt(same))} ${c[0]}. ${cap(nm(odd))} ${c[1]}!`:`${cap(listTxt(same))} ${c[0]}. The ${nm(odd)} ${c[1]}!`;
        say([praise(),why]);later(async()=>{await speechDone(7000);if(round>=ROUNDS)levelDone(starsFor(G.miss,0,2));else one()},600)}
      else{if(first){G.miss++;first=false}b.classList.add('no');boop();say(L().oddWrong)}
    });
    G.instr=L().oddI;if(round===1)say(L().oddI);
    G.test={odd};
  }
  one();
}

/* ===================== 5) SIRALA ===================== */
const STORY3=[['🥚','🐣','🐔'],['🌱','🌿','🌷'],['🌅','☀️','🌙'],['☁️','🌧️','🌈'],['🌳','🍎','🥧'],['🌾','🍞','🥪'],['👶','🧒','👵']];
const STORY4=[['🥚','🐣','🐥','🐔'],['🌰','🌱','🌿','🌷'],['🌅','☀️','🌇','🌙'],['👶','🧒','🧑','👵'],['☀️','☁️','🌧️','🌈']];
const SIZEEM=['🐻','🐟','🌸','🚗','🍎','⭐','🐘','🎈','🐢','🦋'];
const SEQ=[{t:'size',k:3},{t:'story',k:3},{t:'num',k:4},{t:'size',k:4},{t:'story',k:4},{t:'num',k:5},{t:'sizeR',k:5}];
const NUMW={tr:['bir','iki','üç','dört','beş','altı'],en:['one','two','three','four','five','six']};
const dice=n=>{const P={1:[[50,50]],2:[[30,30],[70,70]],3:[[28,28],[50,50],[72,72]],4:[[30,30],[70,30],[30,70],[70,70]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[30,24],[70,24],[30,50],[70,50],[30,76],[70,76]]}[n];return svg(`<rect x="6" y="6" width="88" height="88" rx="18" fill="#fff6c8" ${st(4)}/>`+P.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="#ff5a8a" ${st(3)}/>`).join(''))};
function runSeq(lv){
  const cfg=SEQ[lv],ROUNDS=4;let round=0;G.miss=0;
  function one(){
    G.gen++;round++;let items,instrT,spoken;
    if(cfg.t==='size'||cfg.t==='sizeR'){const e=pick(SIZEEM),sc=[.42,.6,.78,.96,1.14].slice(5-cfg.k);items=sc.map(s=>({h:`<span class="em" style="font-size:calc(${s} * clamp(48px,14vw,84px))">${e}</span>`}));if(cfg.t==='sizeR')items.reverse();instrT=cfg.t==='sizeR'?L().sizeR:L().sizeI;spoken=null}
    else if(cfg.t==='num'){const start=rnd(7-cfg.k);items=Array.from({length:cfg.k},(_,i)=>({h:`<span class="dice" style="display:grid;place-items:center;width:100%;height:100%">${dice(start+i+1)}</span>`,w:NUMW[S.lang][start+i]}));instrT=L().numI;spoken=items.map(x=>x.w)}
    else{const s=pick(cfg.k===3?STORY3:STORY4);items=s.map(e=>({h:`<span class="em" style="font-size:clamp(44px,13vw,76px)">${e}</span>`,w:nm(e)}));instrT=L().storyI;spoken=items.map(x=>cap(x.w))}
    items.forEach((x,i)=>x.i=i);let pos=0,first=true;const order=shuffle(items);
    $('area').innerHTML=owlSay(instrT)+dotsHTML(ROUNDS,round-1)+`<div class="slots">${items.map((_,i)=>`${i?'<span class="sep">›</span>':''}<div class="sl" data-s="${i}"><b>${i+1}</b></div>`).join('')}</div><div class="tray">${order.map(x=>`<button class="tcard" data-i="${x.i}">${x.h}</button>`).join('')}</div>`;
    $('area').querySelectorAll('.tcard').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(i===pos){const sl=$('area').querySelector(`.sl[data-s="${pos}"]`);sl.insertAdjacentHTML('beforeend',items[i].h);sl.classList.add('f');b.classList.add('gone');pling();if(items[i].w)say(cap(items[i].w),false);pos++;
        if(pos>=items.length){$('area').querySelectorAll('.tcard').forEach(x=>x.disabled=true);harp();say(spoken?[...spoken,praise()]:praise(),true);later(async()=>{await speechDone(6000);if(round>=ROUNDS)levelDone(starsFor(G.miss,0,2));else one()},700)}}
      else{if(first){G.miss++;first=false}b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');boop();say(L().seqWrong)}
    });
    G.instr=instrT;if(round===1||cfg.t!=='story')say(instrT);else say(instrT);
    G.test={n:items.length};
  }
  one();
}

/* ===================== OYUNLAR ===================== */
const GAMES={
  hafiza:{levels:MEM.length,run:runMemory,bg:'#d9e6ff',ic:'🃏'},
  yapboz:{levels:JIG.length,run:runJigsaw,bg:'#ffe1ee',ic:'🧩'},
  robot:{levels:ROB.length,run:runRobot,bg:'#dcf6e9',ic:'🤖'},

};

/* ===================== ANA SAYFA ===================== */
function renderHome(){
  const l=L();$('heroOwl').innerHTML=OWL;$('heroT').textContent=l.heroT;$('heroP').textContent=l.heroP;
  $('games').innerHTML=Object.entries(GAMES).map(([id,g])=>{const p=progOf(id),n=g.levels;
    return`<button class="gcard" data-g="${id}"><span class="ic" style="background:${g.bg}">${g.ic}</span><span><b>${l.g[id][0]}</b><small>${l.g[id][1]}</small><span class="sb">${Array.from({length:n},(_,i)=>STAR(!!p[i])).join('')}</span></span></button>`}).join('');
  $('games').querySelectorAll('.gcard').forEach(b=>b.onclick=()=>{tone(660,.08);startGame(b.dataset.g)});
}

  const l=L();document.documentElement.lang=S.lang;document.title=l.name;
  $('brand').innerHTML=ICON.logo+l.name;$('gamesLink').innerHTML=ICON.games+l.games;
  $('soundBtn').innerHTML=(S.sound?ICON.speaker:ICON.mute)+(S.sound?l.sound:l.mute);$('parentBtn').textContent=l.parent;
  $('backBtn').innerHTML=ICON.back;$('backBtn').setAttribute('aria-label',l.home);$('speakBtn').innerHTML=ICON.speaker;$('speakBtn').setAttribute('aria-label','Tekrar dinle');

  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===S.lang)));
}
$('backBtn').onclick=()=>show('home');
$('speakBtn').onclick=()=>{if(G.instr)say(G.instr)};
$('soundBtn').onclick=()=>{S.sound=!S.sound;save();renderStatic();if(!S.sound)hush()};
$('parentBtn').onclick=()=>{$('parentOv').hidden=false};$('parentClose').onclick=()=>{$('parentOv').hidden=true};
$('parentOv').addEventListener('click',e=>{if(e.target===$('parentOv'))$('parentOv').hidden=true});
let resetArm=false;$('resetBtn').onclick=()=>{const l=L();if(!resetArm){resetArm=true;$('resetBtn').textContent=l.resetSure;setTimeout(()=>{resetArm=false;$('resetBtn').textContent=L().reset},4000);return}S.prog={};save();resetArm=false;$('resetBtn').textContent=l.reset;$('parentOv').hidden=true;renderHome()};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{if(S.lang===b.dataset.lang)return;S.lang=b.dataset.lang;save();hush();renderStatic();if(screen==='home')renderHome();else startGame(G.id,G.lv)});
addEventListener('resize',()=>{if(fctx){fx.width=innerWidth;fx.height=innerHeight}if(screen==='game'&&G.resize)G.resize()});
renderStatic();show('home');
window.__zeka={get S(){return S},get G(){return G},GAMES,ROB,robSolve,CATS,PAIRS,NM,startGame,show,JPICS};
})();
