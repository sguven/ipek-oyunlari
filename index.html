<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İpek'in Oyunları</title>
<meta name="description" content="İpek için eğitici oyunlar: Minik Kâşif, Pırıl'ın Gökkuşağı ve Kelebek Bahçesi. Learning games for Ipek.">
<meta name="theme-color" content="#fff3e6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='8' width='38' height='38' rx='10' fill='%23ff7eb6'/%3E%3Crect x='54' y='8' width='38' height='38' rx='10' fill='%23ffd93d'/%3E%3Crect x='8' y='54' width='38' height='38' rx='10' fill='%234aa8ff'/%3E%3Crect x='54' y='54' width='38' height='38' rx='10' fill='%235fd3b5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* layout: üstte İpek'e selam, altında üç büyük oyun kartı (her biri kendi oyununun rengiyle). Tek tema, pastel. */
:root{
  --bg:#fff3e6;--ink:#3b2a5c;--ink2:#6c5a92;--card:#fffdfb;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font:700 clamp(28px,7vw,44px)/1.05 var(--display);display:flex;align-items:center;gap:10px;text-wrap:balance}
h1 svg{width:clamp(40px,9vw,56px);height:auto;flex:none}
.lang{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--ink)}
.lang button{font:800 14px var(--body);border:0;background:none;color:var(--ink);padding:7px 12px;cursor:pointer;letter-spacing:.04em;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.hello{margin:0;font:700 clamp(17px,4.2vw,21px)/1.45 var(--body);color:var(--ink2);text-wrap:balance}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.game{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--card);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);overflow:hidden;transition:transform .12s}
.game:active{transform:translateY(4px);box-shadow:0 4px 0 var(--ink)}
.game:focus-visible{outline:4px solid #ff7eb6;outline-offset:4px}
.art{height:clamp(150px,34vw,190px);display:grid;place-items:center;border-bottom:4px solid var(--ink);position:relative;overflow:hidden}
.art>svg{height:82%;width:auto;max-width:92%;display:block;overflow:visible}
.g1 .art{background:linear-gradient(#fff6c9,#ffe39a)}
.g2 .art{background:linear-gradient(#fbe9ff,#e8f3ff)}
.g3 .art{background:linear-gradient(#a9dcff 0%,#e3f4ff 62%,#a8e27f 62%,#86d066 100%)}
.body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.body b{font:700 26px/1.1 var(--display);text-wrap:balance}
.body p{margin:0;font-weight:700;color:var(--ink2);line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tags span{font:800 12px var(--body);background:#f3eefc;border-radius:999px;padding:4px 10px}
.play{align-self:flex-start;margin-top:6px;font:800 16px var(--body);background:#ffcb3d;border:3px solid var(--ink);border-radius:999px;padding:8px 18px;box-shadow:0 4px 0 var(--ink);display:inline-flex;align-items:center;gap:8px}
.play svg{width:16px;height:16px}
.new{position:absolute;top:12px;right:12px;font:800 13px var(--body);background:#ff7eb6;color:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 10px;transform:rotate(6deg)}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.wl,.wr{transform-box:view-box;transform-origin:50px 50px;animation:flap 1.1s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.6)}}
footer{text-align:center;font:700 13px var(--body);color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="lang" role="group" aria-label="Dil / Language">
      <button data-lang="tr">TR</button>
      <button data-lang="en">EN</button>
    </div>
  </header>
  <p class="hello" id="hello"></p>
  <nav class="games" id="games" aria-label="Oyunlar"></nav>
  <footer id="foot"></footer>
</div>
<script>
const INK='#3b2a5c';
const svg=(inner,vb='0 0 100 100')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
const st=(w=4)=>`stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
function starPts(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}

/* Minik Kâşif: büyüteç + sayı, renk, şekil */
const ART1=svg(`<circle cx="44" cy="30" r="10" fill="#ff5a5a" ${st(3)}/><rect x="122" y="18" width="22" height="22" rx="4" fill="#4aa8ff" ${st(3)}/><polygon points="${starPts(150,96,15,6.5)}" fill="#ffd93d" ${st(3)}/><polygon points="22,110 34,88 46,110" fill="#5fd3b5" ${st(3)}/>
<g class="bob" style="transform-origin:95px 62px"><circle cx="88" cy="56" r="36" fill="#ffc531" ${st(6)}/><circle cx="88" cy="56" r="22" fill="#fff" ${st(5)}/><text x="88" y="66" text-anchor="middle" font-family="Fredoka,system-ui" font-weight="700" font-size="28" fill="${INK}">3</text><path d="M114 82 L138 106" stroke="${INK}" stroke-width="10" stroke-linecap="round"/></g>`,'0 0 170 125');

/* Pırıl'ın Gökkuşağı: gökkuşağı + boynuz */
const RB=['#ff5a5a','#ff9f43','#ffd93d','#4cd17a','#4aa8ff','#5a63e0','#a66bff'];
const ART2=svg(RB.map((c,i)=>{const r=74-i*8;return`<path d="M${90-r} 112 A${r} ${r} 0 0 1 ${90+r} 112" stroke="${c}" stroke-width="8" fill="none"/>`}).join('')+
  `<g fill="#fff" stroke="${INK}" stroke-width="3"><ellipse cx="90" cy="114" rx="64" ry="11"/></g><g class="bob" style="transform-origin:90px 70px"><polygon points="78,92 102,92 92,22" fill="#ffcb3d" ${st(4)}/><path d="M82 78 L98 76 M85 62 L96 60 M88 46 L94 45" stroke="${INK}" stroke-width="3"/></g>`+
  [[24,26,7],[154,30,6],[140,70,5]].map(([x,y,r])=>`<polygon points="${starPts(x,y,r,r*.42)}" fill="#ffd93d" stroke="${INK}" stroke-width="1.5"/>`).join(''),'0 0 180 125');

/* Kelebek Bahçesi: kelebek + kavanoz */
const UPW='M50 46 C40 16 14 4 7 18 C1 32 14 50 50 52 Z',LOW='M50 52 C30 52 14 62 18 78 C22 92 42 88 50 60 Z';
function bf(c,lt){const h=`<path d="${UPW}" fill="${c}" ${st(3)}/><path d="${LOW}" fill="${lt}" ${st(3)}/><circle cx="22" cy="24" r="6.5" fill="#fff" opacity=".85"/><circle cx="31" cy="73" r="4.5" fill="#fff" opacity=".85"/>`;
  return `<g class="wl"><g>${h}</g></g><g class="wr"><g transform="matrix(-1 0 0 1 100 0)">${h}</g></g><path d="M47 27 Q40 12 33 9 M53 27 Q60 12 67 9" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="33" cy="9" r="4" fill="${c}" ${st(2)}/><circle cx="67" cy="9" r="4" fill="${c}" ${st(2)}/><ellipse cx="50" cy="60" rx="6.5" ry="24" fill="${INK}"/><circle cx="50" cy="34" r="10" fill="${INK}"/><circle cx="46" cy="33" r="2.7" fill="#fff"/><circle cx="54" cy="33" r="2.7" fill="#fff"/><path d="M46.5 38.2 Q50 41.5 53.5 38.2" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round"/>`}
const ART3=svg(`<g class="bob" style="transform-origin:60px 50px"><svg x="20" y="8" width="80" height="80" viewBox="0 0 100 100">${bf('#a66bff','#e1cfff')}</svg></g>
<svg x="104" y="2" width="40" height="40" viewBox="0 0 100 100">${bf('#ffd93d','#fff1a6')}</svg>
<g transform="translate(118 48) scale(.62)"><rect x="10" y="22" width="80" height="90" rx="20" fill="#e9f6ff" fill-opacity=".8" ${st(5)}/><rect x="18" y="8" width="64" height="16" rx="6" fill="#c79bff" ${st(5)}/><svg x="22" y="56" width="36" height="36" viewBox="0 0 100 100">${bf('#ff5a5a','#ffc2c2')}</svg><svg x="46" y="72" width="34" height="34" viewBox="0 0 100 100">${bf('#4aa8ff','#c4e3ff')}</svg></g>`,'0 0 180 125');

const PLAY=svg(`<polygon points="22,12 88,50 22,88" fill="${INK}"/>`);
const T={
  tr:{title:"İpek'in Oyunları",hello:'Merhaba İpek! Hangi oyunu oynamak istersin? Bir karta dokun, oyun açılsın.',play:'Oyna',nw:'Yeni!',
    foot:'Her oyunun içindeki “Oyunlar” düğmesi bu sayfaya geri getirir. İlerleme her cihazda ayrı saklanır.',
    games:[
      {href:'minik-kasif/',name:'Minik Kâşif İpek',desc:'Elmaları say, balonların rengini bul, şekilleri tanı.',tags:['Sayılar','Renkler','Şekiller']},
      {href:'unicorn/',name:"İpek ve Pırıl'ın Gökkuşağı",desc:'Tek boynuzlu at Pırıl ile her doğru cevapta gökkuşağına bir renk ekle.',tags:['Örüntüler','Çok mu, az mı?','Gölgeler']},
      {href:'kelebek/',name:"İpek'in Kelebek Bahçesi",desc:'Uçan kelebeklere dokunup yakala, kavanozu doldur, sonra serbest bırak.',tags:['Kelebek yakala','Renk avı','Say ve yakala'],isNew:true}
    ]},
  en:{title:"Ipek's Games",hello:'Hi Ipek! Which game do you want to play? Tap a card to start.',play:'Play',nw:'New!',
    foot:'The “Games” button inside each game brings you back here. Progress is saved separately on each device.',
    games:[
      {href:'minik-kasif/',name:'Little Explorer Ipek',desc:'Count apples, find balloon colors and learn shapes.',tags:['Numbers','Colors','Shapes']},
      {href:'unicorn/',name:"Ipek & Sparkle's Rainbow",desc:'Help Sparkle the unicorn add a color to the rainbow with every right answer.',tags:['Patterns','More or less?','Shadows']},
      {href:'kelebek/',name:"Ipek's Butterfly Garden",desc:'Tap flying butterflies to catch them, fill the jar, then let them fly free.',tags:['Catch them','Color hunt','Count & catch'],isNew:true}
    ]}
};
const ART=[ART1,ART2,ART3];
let lang='tr';
try{const s=JSON.parse(localStorage.getItem('kelebek-bahcesi-v1')||'{}');if(s.lang)lang=s.lang;else if((navigator.language||'').toLowerCase().startsWith('en'))lang='en'}catch(e){}
try{const l=localStorage.getItem('ipek-oyunlar-lang');if(l==='tr'||l==='en')lang=l}catch(e){}
function render(){
  const l=T[lang];
  document.documentElement.lang=lang;document.title=l.title;
  document.getElementById('title').innerHTML=svg(`<rect x="8" y="8" width="38" height="38" rx="10" fill="#ff7eb6" ${st(5)}/><rect x="54" y="8" width="38" height="38" rx="10" fill="#ffd93d" ${st(5)}/><rect x="8" y="54" width="38" height="38" rx="10" fill="#4aa8ff" ${st(5)}/><rect x="54" y="54" width="38" height="38" rx="10" fill="#5fd3b5" ${st(5)}/>`)+l.title;
  document.getElementById('hello').textContent=l.hello;
  document.getElementById('foot').textContent=l.foot;
  document.getElementById('games').innerHTML=l.games.map((g,i)=>`<a class="game g${i+1}" href="${g.href}"><div class="art">${ART[i]}${g.isNew?`<span class="new">${l.nw}</span>`:''}</div><div class="body"><b>${g.name}</b><p>${g.desc}</p><div class="tags">${g.tags.map(t=>`<span>${t}</span>`).join('')}</div><span class="play">${PLAY}${l.play}</span></div></a>`).join('');
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('ipek-oyunlar-lang',lang)}catch(e){}render()});
render();
</script>
</body>
</html>
