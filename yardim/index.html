<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İpek'in Yardım Köyü</title>
<meta name="description" content="yardımlaşma oyunu: arkadaşlara yardım et, eşit paylaş, parkı temizle. A helping game.">
<meta name="theme-color" content="#fff1dc">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yardım Köyü">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* layout: ana sayfada yardım ağacı sahnesi + 3 mod kutusu; oyunda üstte görev çubuğu, ortada sahne (arkadaş / tabaklar / park), altta seçenekler. Tek tema, sıcak pastel. */
:root{
  --bg:#fff1dc;--ink:#3b2a5c;--ink2:#6c5a92;--card:#fffdfb;--tint:#fff7ec;
  --pink:#ff7eb6;--gold:#ffcb3d;--ok:#1f9e66;--okbg:#dcf6e9;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
body.playing .wrap{padding-block:10px 14px;gap:10px}
body.playing header{display:none}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{font:700 28px/1 var(--display);display:flex;align-items:center;gap:8px;margin:0;text-wrap:balance}
.brand svg{width:44px;height:44px;flex:none}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button,a{font-family:inherit}
.pill{font:800 15px var(--body);background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--ink);min-height:44px;text-decoration:none;box-sizing:border-box}
.pill svg{width:22px;height:22px}
.pill.small{font-size:13px;padding:6px 11px;box-shadow:0 3px 0 var(--ink);min-height:40px}
.pill:active,.tile:active,.round:active,.opt:active,.plate:active{transform:translateY(3px)}
.lang{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--ink)}
.lang button{font:800 14px var(--body);border:0;background:none;color:var(--ink);padding:7px 12px;cursor:pointer;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg{display:inline-flex;align-items:stretch;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}.seg span{font:800 13px var(--body);padding:6px 4px 6px 12px;align-self:center}.seg button{font:800 13px var(--body);border:0;background:none;color:var(--ink);padding:6px 11px;cursor:pointer;min-height:40px}.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ana sayfa sahnesi: yardım ağacı */
.treebox{position:relative;border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);overflow:hidden;background:linear-gradient(#cfeaff,#eef8ff 62%,#bfe6a0 62%,#a6d987);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:end;gap:8px;padding:12px 14px 0}
.treebox .tree svg{width:100%;height:auto;display:block;max-height:260px;min-height:150px}
.treebox .friends{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-self:end;padding-bottom:10px}
.treebox .friends svg{width:clamp(44px,10vw,70px);height:auto}
.treebox .count{position:absolute;left:12px;top:10px;font:700 20px var(--display);background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:4px 12px 4px 6px;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 var(--ink)}
.treebox .count svg{width:26px;height:26px}
.hello{margin:0;font:700 18px/1.5 var(--body);color:var(--ink2);text-align:center;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.tile{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:16px 12px 14px;box-shadow:0 6px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.tile .art{height:70px;width:100%;display:flex;align-items:center;justify-content:center;gap:4px}
.tile .art svg{height:100%;width:auto;max-width:48%}
.tile b{font:700 24px/1.1 var(--display);text-align:center}
.tile span{font:700 12px var(--body);color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* oyun çubuğu */
.bar{display:flex;align-items:center;gap:10px;background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:7px 9px;min-height:64px;box-sizing:border-box}
.bar h2{flex:1;min-width:0;margin:0;font:700 clamp(18px,4.4vw,28px)/1.15 var(--display);text-wrap:balance}
.round{width:52px;height:52px;border-radius:50%;border:4px solid var(--ink);cursor:pointer;flex:none;display:grid;place-items:center;padding:0;box-shadow:0 4px 0 var(--ink);background:var(--card)}
.round svg{width:24px;height:24px}
.round.speak{background:var(--gold)}

/* sahne */
.stage{position:relative;border:4px solid var(--ink);border-radius:30px;box-shadow:0 6px 0 var(--ink);background:linear-gradient(#d7efff,#f3faff 60%,#c6e9a8 60%,#ade08e);min-height:240px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
.stage.night{background:linear-gradient(#2c2a5a,#4a3f7a 60%,#3f6a4a 60%,#2f5a3a)}
.stage.rainy{background:linear-gradient(#a9b8c8,#d4dde6 60%,#a9cf98 60%,#94c283)}
.friend{width:min(62%,280px);position:relative}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;background:var(--card);border:4px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:8px 16px;font:700 clamp(17px,4.4vw,24px)/1.2 var(--display);text-align:center;max-width:90%;animation:pop .45s backwards;pointer-events:none}
.banner small{display:block;font:700 14px/1.3 var(--body);color:var(--ink2);margin-top:2px}
.friend svg{width:100%;height:auto;display:block;overflow:visible}
.friend.happy svg{animation:bounce .7s}
.friend.no svg{animation:shake .45s}
.gift{position:absolute;width:80px;height:80px;z-index:5;pointer-events:none;transition:transform .55s cubic-bezier(.3,.1,.3,1),opacity .55s}
.gift svg{width:100%;height:100%}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:14px}
.opt{background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font:700 16px var(--display);min-height:120px;animation:pop .4s backwards}
.opt svg{width:min(100%,78px);height:auto}
.opt.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 6px 0 var(--ok)}
.opt.nope{animation:shake .45s;opacity:.35;pointer-events:none}
.hearts{display:flex;gap:4px;justify-content:center;min-height:26px}
.hearts svg{width:26px;height:26px}

/* paylaş */
.share{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.basket{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;background:#fff7e6;border:4px solid var(--ink);border-radius:20px 20px 40px 40px;padding:8px 12px;min-height:58px;min-width:160px;box-shadow:0 4px 0 var(--ink)}
.basket svg,.plate .cookies svg{width:clamp(30px,7vw,44px);height:auto}
.plates{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;width:100%}
.plate{background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font:700 16px var(--display)}
.plate .face{width:min(100%,110px)}
.plate .face svg{width:100%;height:auto}
.plate .cookies{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:46px;background:#f6f1ff;border-radius:999px;padding:4px 8px;width:100%;box-sizing:border-box}
.plate .n{font:700 22px var(--display)}
.plate.hint{animation:pulse 1s ease-in-out infinite;border-color:var(--pink)}

/* topla */
.park{position:relative;width:100%;height:clamp(260px,52vh,520px);border-radius:22px;overflow:hidden;touch-action:manipulation;background:linear-gradient(#d7efff,#f3faff 34%,#c6e9a8 34%,#ade08e)}
.park .thing{position:absolute;width:clamp(48px,11vw,78px);transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:pointer}
.park .thing svg{width:100%;height:auto;display:block;overflow:visible}
.park .thing.gone{transition:all .6s cubic-bezier(.3,.1,.3,1);opacity:0;pointer-events:none}
.park .bin{position:absolute;right:3%;bottom:3%;width:clamp(70px,15vw,110px);pointer-events:none}
.park .bin svg{width:100%;height:auto}
.park .bin.bump svg{animation:bounce .45s}
.park .kids{position:absolute;inset:auto 0 4% 0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.park .kids svg{width:clamp(56px,13vw,96px);height:auto;animation:pop .5s backwards}

:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.ov{position:fixed;inset:0;background:rgba(59,42,92,.55);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--card);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);padding:22px 18px;max-width:540px;width:100%;box-sizing:border-box;max-height:88vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:14px}
.card h3{margin:0;font:700 28px/1.15 var(--display);text-wrap:balance}
.card p{margin:0;color:var(--ink2);font-weight:700;line-height:1.5}
.reward svg{width:min(56vw,200px);height:auto;animation:spin-in .7s}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.alb{border-radius:20px;background:var(--tint);border:3px dashed #d8c3a3;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 13px var(--body);color:var(--ink);min-height:100px;justify-content:center}
.alb svg{width:64px;height:64px}
.alb.got{border:3px solid var(--ink);background:#fff}
.alb.locked{color:#a8957a}
.stats{display:flex;flex-direction:column;gap:10px;text-align:left}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--tint);border-radius:16px;padding:10px;text-align:center}
.kpi b{display:block;font:700 26px/1.1 var(--display)}
.kpi span{font:700 12px var(--body);color:var(--ink2)}
.note{font-size:13px!important;font-weight:600!important}
.card>.btns:last-child{position:sticky;bottom:-22px;background:var(--card);padding-block:10px 4px;margin-bottom:-4px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}70%{transform:scale(.96)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
@keyframes spin-in{from{transform:scale(.2) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shiver{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
@keyframes fall{from{transform:translateY(-10px)}to{transform:translateY(110px)}}
.shiver{animation:shiver .12s linear infinite}
.drop{animation:fall 1s linear infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:420px){.brand{font-size:23px}.round{width:46px;height:46px}.opt{min-height:104px}.treebox{grid-template-columns:1.4fr 1fr;padding:34px 8px 0}}
@media (max-height:520px) and (orientation:landscape){.stage{min-height:170px}.friend{width:min(36%,200px)}.opt{min-height:90px}.opt svg{width:56px}.park{height:clamp(200px,60vh,320px)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand" id="brand"></h1>
    <div class="hud">
      <a class="pill small" id="gamesLink" href="../"></a>
      <div class="lang" role="group" aria-label="Dil / Language"><button data-lang="tr">TR</button><button data-lang="en">EN</button></div>
    </div>
  </header>

  <section id="home" style="display:flex;flex-direction:column;gap:16px">
    <div class="treebox" id="treebox"></div>
    <p class="hello" id="hello"></p>
    <div class="tiles" id="tiles"></div>
    <div class="btns">
      <button class="pill" id="albumBtn"></button>
      <button class="pill small" id="soundBtn"></button>
      <div class="seg" id="voiceSel" role="group" hidden><span id="voiceSelLabel"></span><button data-voice="kadin"></button></div>
      <button class="pill small" id="parentBtn"></button>
    </div>
  </section>

  <section id="play" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="bar">
      <button class="round" id="backBtn"></button>
      <h2 id="prompt"></h2>
      <button class="round speak" id="speakBtn"></button>
    </div>
    <div class="stage" id="stage"></div>
    <div id="below"></div>
  </section>
</div>

<div class="ov" id="rewardOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
    <div class="reward" id="rewardArt"></div>
    <h3 id="rewardTitle"></h3>
    <p id="rewardText"></p>
    <div class="btns"><button class="pill" id="rewardGo"></button><button class="pill small" id="rewardHome"></button></div>
  </div>
</div>
<div class="ov" id="albumOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="albumTitle">
    <h3 id="albumTitle"></h3>
    <p id="albumText"></p>
    <div class="album" id="album"></div>
    <div class="btns"><button class="pill" data-close="albumOv" id="albumClose"></button></div>
  </div>
</div>
<div class="ov" id="parentOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="parentTitle">
    <h3 id="parentTitle"></h3>
    <div class="stats" id="stats"></div>
    <p class="note" id="parentNote"></p>
    <div class="btns"><button class="pill small" id="resetBtn"></button><button class="pill" data-close="parentOv" id="parentClose"></button></div>
  </div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
"use strict";
const INK='#3b2a5c';
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const cap=(s,l)=>s?s[0].toLocaleUpperCase(l==='tr'?'tr-TR':'en-US')+s.slice(1):s;

/* ---------- çizimler ---------- */
const svg=(inner,vb='0 0 100 100')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
const st=(w=4)=>`stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
function starPts(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
const heartPath=(cx,cy,s)=>`M${cx} ${cy+s} C${cx-s*1.7} ${cy} ${cx-s} ${cy-s*1.3} ${cx} ${cy-s*.4} C${cx+s} ${cy-s*1.3} ${cx+s*1.7} ${cy} ${cx} ${cy+s}Z`;
const HEART=svg(`<path d="${heartPath(50,50,34)}" fill="#ff5a8a" ${st(5)}/><ellipse cx="34" cy="38" rx="6" ry="9" fill="#fff" opacity=".5"/>`);

/* hayvan arkadaşlar: tek çizim fonksiyonu, tür + ruh hali */
const KIND={
  cat:{c:'#f6b26b',d:'#d98a3d',ears:'tri'},rabbit:{c:'#f1ecf7',d:'#c9bedc',ears:'long'},bear:{c:'#c8915a',d:'#9a6a3a',ears:'round'},
  frog:{c:'#7ccf6a',d:'#4f9d42',ears:'frog'},dog:{c:'#e3c39d',d:'#a7774c',ears:'flop'},chick:{c:'#ffd93d',d:'#e0a800',ears:'none',beak:true},
  bird:{c:'#8fc7ff',d:'#4a8fd6',ears:'none',beak:true},elephant:{c:'#b3bfdc',d:'#8592b8',ears:'big',trunk:true},squirrel:{c:'#d7894a',d:'#a65a26',ears:'tri',tail:true},
  panda:{c:'#ffffff',d:'#2e2a35',ears:'round',panda:true}
};
function animal(kind,mood,extra){
  const k=KIND[kind],c=k.c,d=k.d,s=st(4);let g='';
  const happy=mood==='happy';
  if(k.tail)g+=`<path d="M86 104 C118 96 118 50 96 52 C108 66 100 84 86 88 Z" fill="${d}" ${s}/>`;
  /* gövde */
  g+=`<ellipse cx="60" cy="104" rx="30" ry="18" fill="${c}" ${s}/>`;
  if(k.beak)g+=`<path d="M30 104 Q24 92 34 90 M90 104 Q96 92 86 90" stroke="${INK}" stroke-width="4" fill="${d}"/>`;
  /* kulaklar */
  if(k.ears==='tri')g+=`<path d="M34 40 L30 12 L52 30 Z M86 40 L90 12 L68 30 Z" fill="${c}" ${s}/><path d="M36 34 L34 20 L46 30 Z M84 34 L86 20 L74 30 Z" fill="#ffb3c7"/>`;
  if(k.ears==='long')g+=`<ellipse cx="44" cy="18" rx="9" ry="24" fill="${c}" ${s}/><ellipse cx="76" cy="18" rx="9" ry="24" fill="${c}" ${s}/><ellipse cx="44" cy="20" rx="4" ry="16" fill="#ffc6d8"/><ellipse cx="76" cy="20" rx="4" ry="16" fill="#ffc6d8"/>`;
  if(k.ears==='round')g+=`<circle cx="36" cy="32" r="12" fill="${k.panda?d:c}" ${s}/><circle cx="84" cy="32" r="12" fill="${k.panda?d:c}" ${s}/>`;
  if(k.ears==='flop')g+=`<path d="M34 34 C18 36 16 62 28 70 C34 58 38 48 40 40 Z M86 34 C102 36 104 62 92 70 C86 58 82 48 80 40 Z" fill="${d}" ${s}/>`;
  if(k.ears==='big')g+=`<ellipse cx="26" cy="58" rx="20" ry="24" fill="${c}" ${s}/><ellipse cx="94" cy="58" rx="20" ry="24" fill="${c}" ${s}/><ellipse cx="28" cy="58" rx="11" ry="15" fill="#f3c6d8"/><ellipse cx="92" cy="58" rx="11" ry="15" fill="#f3c6d8"/>`;
  /* kafa */
  g+=`<circle cx="60" cy="58" r="30" fill="${c}" ${s}/>`;
  if(k.ears==='frog')g+=`<circle cx="44" cy="32" r="11" fill="${c}" ${s}/><circle cx="76" cy="32" r="11" fill="${c}" ${s}/>`;
  if(k.panda)g+=`<ellipse cx="47" cy="56" rx="9" ry="11" fill="${d}" transform="rotate(-20 47 56)"/><ellipse cx="73" cy="56" rx="9" ry="11" fill="${d}" transform="rotate(20 73 56)"/>`;
  /* gözler */
  const ey=k.ears==='frog'?32:54,ex=k.ears==='frog'?16:12;
  if(happy)g+=`<path d="M${60-ex-6} ${ey+2} Q${60-ex} ${ey-6} ${60-ex+6} ${ey+2} M${60+ex-6} ${ey+2} Q${60+ex} ${ey-6} ${60+ex+6} ${ey+2}" stroke="${k.panda?'#fff':INK}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  else g+=`<circle cx="${60-ex}" cy="${ey}" r="5" fill="${k.panda?'#fff':INK}"/><circle cx="${60+ex}" cy="${ey}" r="5" fill="${k.panda?'#fff':INK}"/><circle cx="${60-ex+1.5}" cy="${ey-1.5}" r="1.6" fill="${k.panda?INK:'#fff'}"/><circle cx="${60+ex+1.5}" cy="${ey-1.5}" r="1.6" fill="${k.panda?INK:'#fff'}"/>`+
    (mood==='sad'?`<path d="M${60-ex-8} ${ey-7} L${60-ex+5} ${ey-12} M${60+ex+8} ${ey-7} L${60+ex-5} ${ey-12}" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`:'');
  /* burun / gaga / hortum */
  if(k.beak)g+=`<path d="M52 64 L68 64 L60 74 Z" fill="#ff9f43" ${st(3)}/>`;
  else if(k.trunk)g+=`<path d="M54 64 C52 84 60 94 70 92 C64 88 62 80 66 64 Z" fill="${c}" ${st(3.5)}/>`;

  ['tr','en'].forEach(l=>{const c=vs.filter(v=>{const lg=String(v.lang||'').toLowerCase().replace('_','-');return lg===l||lg.startsWith(l+'-')});c.sort((a,b)=>(/natural|neural|enhanced|premium|google|yelda|siri|samantha|ava|aria|jenny/i.test(b.name)?1:0)-(/natural|neural|enhanced|premium|google|yelda|siri|samantha|ava|aria|jenny/i.test(a.name)?1:0));VOICE[l]=c[0]||null})}

let AC=null;

try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
let unlocked=false;

['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));

const CLIPS={base:'audio/',map:null};

const bufs={};
function clipBuf(id){const a=audioCtx(),k=curVoice()+'/'+id;if(!a)return Promise.reject();if(!bufs[k]){bufs[k]=fetch(CLIPS.base+k+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>new Promise((res,rej)=>a.decodeAudioData(b,res,rej)));bufs[k].catch(()=>{delete bufs[k]})}return bufs[k]}

function playBuf(buf,gen){return new Promise(async res=>{const a=audioCtx();if(gen!==clipGen||!a)return res();if(a.state!=='running'){try{await Promise.race([a.resume(),new Promise(r=>setTimeout(r,600))])}catch(e){}}if(gen!==clipGen)return res();const s=a.createBufferSource();s.buffer=buf;s.connect(a.destination);let done=false;const fin=()=>{if(done)return;done=true;if(clipSrc===s)clipSrc=null;res()};s.onended=fin;setTimeout(fin,buf.duration*1000+400);clipSrc=s;try{s.start()}catch(e){fin()}})}

async function pump(){if(sqBusy)return;sqBusy=true;const gen=clipGen;
  while(SQ.length&&gen===clipGen){const parts=SQ.shift();for(let i=0;i<parts.length;i++){if(gen!==clipGen)break;await speakPart(parts[i],gen);if(i<parts.length-1)await new Promise(r=>setTimeout(r,140))}if(SQ.length)await new Promise(r=>setTimeout(r,200))}
  if(gen===clipGen)sqBusy=false}
/* queue=false: sırayı temizler; cihaz sesi konuşuyorsa kesmez (iPad'de donmasın), bitince söyler */
function say(t,queue){
  if(!S.sound)return;const parts=(Array.isArray(t)?t:[t]).filter(Boolean);if(!parts.length)return;
  if(!queue){let tts=false;try{tts=speechSynthesis.speaking||speechSynthesis.pending}catch(e){}SQ=[];if(!tts){sqBusy=false;stopClips()}}

function tone(f,d,t0,type,vol){if(!S.sound)return;const a=audioCtx();if(!a)return;try{const t=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.15,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}

const fx=$('fx');let fctx=null;try{fctx=fx.getContext('2d')}catch(e){}

function confetti(n){if(reduce||!fctx)return;fx.width=innerWidth;fx.height=innerHeight;for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.5,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:6+Math.random()*7,c:FXC[i%6],a:Math.random()*6,va:(Math.random()-.5)*.3,life:1,h:Math.random()<.5});if(!fxOn){fxOn=true;requestAnimationFrame(fxTick)}}

const PAIRS=[['bear','rabbit'],['cat','dog'],['frog','chick'],['panda','elephant'],['squirrel','bird']];

function renderShare(hintIdx){

function sharePick(i){

  if(G.basket>0){G.basket--;G.plates[i]++;pling(G.plates[i]);if(G.plates[i]<=8)say(l.nums[G.plates[i]]);}
  else{
    const min=Math.min(...G.plates),max=Math.max(...G.plates);
    if(G.plates[i]===max&&max>min){const j=G.plates.indexOf(min);G.plates[i]--;G.plates[j]++;pling(5)}
    else{boop()}
  }
  const min=Math.min(...G.plates),max=Math.max(...G.plates);
  if(G.basket===0&&min===max){
