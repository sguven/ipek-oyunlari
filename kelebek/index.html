<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İpek'in Kelebek Bahçesi</title>
<meta name="description" content="kelebek yakalama oyunu: kelebek yakala, renk avı, say ve yakala. Butterfly catching game.">
<meta name="theme-color" content="#e6f6ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse cx='28' cy='34' rx='24' ry='22' fill='%23ff7eb6'/%3E%3Cellipse cx='72' cy='34' rx='24' ry='22' fill='%23ff7eb6'/%3E%3Cellipse cx='32' cy='70' rx='17' ry='16' fill='%234aa8ff'/%3E%3Cellipse cx='68' cy='70' rx='17' ry='16' fill='%234aa8ff'/%3E%3Crect x='44' y='22' width='12' height='64' rx='6' fill='%233b2a5c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* layout: gökyüzü + çayır; oyun ekranında üstte görev çubuğu, altında tüm ekranı kaplayan çayır ve sağ altta kavanoz. Tek tema, bilinçli olarak pastel. */
:root{
  --sky:#e6f6ff;--ink:#3b2a5c;--ink2:#6c5a92;--card:#fffdfb;--tint:#f2f8ff;
  --pink:#ff7eb6;--gold:#ffcb3d;--ok:#1f9e66;--okbg:#dcf6e9;--warnbg:#fff3cc;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
body.playing .wrap{padding-block:10px 14px;gap:10px}
body.playing header,body.playing .voice-note{display:none}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{font:700 28px/1 var(--display);display:flex;align-items:center;gap:8px;margin:0;text-wrap:balance}
.brand svg{width:42px;height:42px;flex:none}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
a.games-link{text-decoration:none;min-height:40px;box-sizing:border-box}
button{font-family:inherit}
.pill{font:800 15px var(--body);background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--ink);min-height:44px}
.pill svg{width:22px;height:22px}
.pill.small{font-size:13px;padding:6px 11px;box-shadow:0 3px 0 var(--ink);min-height:40px}
.pill:active,.tile:active,.round:active{transform:translateY(3px)}
.lang{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--ink)}
.lang button{font:800 14px var(--body);border:0;background:none;color:var(--ink);padding:7px 12px;cursor:pointer;letter-spacing:.04em;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg{display:inline-flex;align-items:stretch;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}.seg span{font:800 13px var(--body);padding:6px 4px 6px 12px;align-self:center}.seg button{font:800 13px var(--body);border:0;background:none;color:var(--ink);padding:6px 11px;cursor:pointer;min-height:40px}.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* çayır (hem ana sayfa sahnesi hem oyun alanı) */
.meadow{position:relative;border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);overflow:hidden;background:linear-gradient(#a9dcff,#e3f4ff 70%);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.meadow.home{height:clamp(200px,42vw,280px)}
.meadow.field{height:clamp(240px,calc(100vh - 136px),940px);height:clamp(240px,calc(100dvh - 136px),940px);touch-action:none;cursor:pointer}
.meadow .sun{position:absolute;left:5%;top:7%;width:clamp(44px,11%,84px)}
.meadow .cloudd{position:absolute;opacity:.95;pointer-events:none}
.meadow .grass{position:absolute;left:0;right:0;bottom:0;height:30%;display:block;width:100%}
.fl{position:absolute;bottom:2%;transform:translateX(-50%);width:clamp(38px,8.5%,74px);pointer-events:none}
.fl>svg{width:100%;height:auto;display:block}
.bf{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;z-index:3}
.bf>svg{width:100%;height:auto;display:block;overflow:visible}
.bf .wl,.bf .wr,.jarbf .wl,.jarbf .wr,.flap .wl,.flap .wr{transform-box:view-box;transform-origin:50px 50px;animation:flap .28s ease-in-out infinite alternate}
.bf.rest .wl,.bf.rest .wr{animation-duration:1.15s}
.jarbf .wl,.jarbf .wr{animation-duration:1.4s}
.bf.caught{z-index:4;transition:transform .62s cubic-bezier(.45,-.25,.6,1),opacity .62s ease-in}
.bf.nope svg{animation:shake .45s}
.bf.fly{z-index:5;transition:transform 1.7s cubic-bezier(.3,.1,.5,1),opacity 1.7s ease-in}
@keyframes flap{to{transform:scaleX(.32)}}
.alb .wl,.alb .wr,.gi .wl,.gi .wr,.reward .wl,.reward .wr,.brand .wl,.brand .wr,.pill .wl,.pill .wr,.tile .wl,.tile .wr{transform-box:view-box;transform-origin:50px 50px;animation:flapSoft 1.3s ease-in-out infinite alternate}
@keyframes flapSoft{to{transform:scaleX(.72)}}
.jar{position:absolute;right:2.5%;bottom:2.5%;width:clamp(76px,17%,128px);pointer-events:none;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px}
.jar>svg{width:100%;height:auto;display:block;overflow:visible}
.jar .lbl{font:800 13px var(--body);background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.jar.bump>svg{animation:bounce .5s}
.jarbf.pop{animation:pop .45s backwards}
.hbf{position:absolute;width:clamp(58px,15%,96px);background:none;border:0;padding:0;cursor:pointer;z-index:3}
.hbf>svg{width:100%;height:auto;display:block;overflow:visible}
.hbf.a{left:12%;top:12%;animation:float1 5s ease-in-out infinite}
.hbf.b{left:44%;top:30%;animation:float2 6s ease-in-out infinite}
.hbf.c{left:68%;top:8%;animation:float1 5.6s ease-in-out infinite reverse}
.hbf:active svg{transform:scale(.9)}
@keyframes float1{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(18px,-14px) rotate(6deg)}}
@keyframes float2{0%,100%{transform:translate(0,0) rotate(5deg)}50%{transform:translate(-16px,12px) rotate(-5deg)}}
.spark{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;pointer-events:none;z-index:6;animation:sparkle .6s ease-out forwards}
.spark svg{width:100%;height:100%;display:block}
@keyframes sparkle{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}

.hello{margin:0;font:700 18px/1.5 var(--body);color:var(--ink2);text-align:center;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:16px 12px 14px;box-shadow:0 6px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.tile .art{height:66px;width:100%;min-width:0;display:flex;align-items:center;justify-content:center;gap:2px}
.tile .art>svg{height:100%;width:auto;min-width:0;max-width:calc((100% - 4px) / 3);flex:0 1 auto}
.tile .art .num{font:700 50px/1 var(--display);color:var(--ink)}
.tile b{font:700 24px/1.1 var(--display);text-align:center}
.tile span{font:700 12px var(--body);color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* oyun çubuğu */
.bar{display:flex;align-items:center;gap:10px;background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:7px 9px;min-height:64px;box-sizing:border-box}
.goal{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.goal .gi{width:50px;height:50px;flex:none;display:grid;place-items:center}
.goal .gi>svg{width:100%;height:auto;display:block;overflow:visible}
.goal .gi .num{font:700 44px/1 var(--display);color:var(--ink)}
.goal .txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.goal h2{margin:0;font:700 clamp(18px,4.4vw,28px)/1.1 var(--display);text-wrap:balance}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-sizing:border-box}
.dot.on{background:var(--gold);animation:bounce .45s}
.goal.done h2{color:var(--ok)}
.round{width:52px;height:52px;border-radius:50%;border:4px solid var(--ink);cursor:pointer;flex:none;display:grid;place-items:center;padding:0;box-shadow:0 4px 0 var(--ink);background:var(--card)}
.round svg{width:24px;height:24px}
.round.speak{background:var(--gold)}

.voice-note{background:var(--warnbg);border:3px solid var(--ink);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.voice-note b{font:700 18px/1.2 var(--display)}
.voice-note p,.voice-note li{margin:0;font-weight:700;font-size:14px;line-height:1.5}
.voice-note ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.ov{position:fixed;inset:0;background:rgba(59,42,92,.55);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--card);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);padding:22px 18px;max-width:540px;width:100%;box-sizing:border-box;max-height:88vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:14px}
.card h3{margin:0;font:700 28px/1.15 var(--display);text-wrap:balance}
.card p{margin:0;color:var(--ink2);font-weight:700;line-height:1.5}
.reward>svg{width:min(60vw,220px);height:auto;animation:spin-in .7s;overflow:visible}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.alb{border-radius:20px;background:var(--tint);border:3px dashed #a9c4e6;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 13px var(--body);color:var(--ink);cursor:pointer;min-height:110px;justify-content:center}
.alb>svg{width:72px;height:72px;overflow:visible}
.alb.got{border:3px solid var(--ink);background:#fff}
.alb.locked{cursor:default;color:#8c9bb8}
.alb small{font:700 11px var(--body);color:var(--ink2)}
.stats{display:flex;flex-direction:column;gap:12px;text-align:left}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--tint);border-radius:16px;padding:10px;text-align:center}
.kpi b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font:700 12px var(--body);color:var(--ink2)}
.row{display:grid;grid-template-columns:110px minmax(0,1fr) 84px;align-items:center;gap:10px;font-weight:800;font-size:14px}
.track{height:14px;border-radius:999px;background:var(--tint);overflow:hidden}
.track i{display:block;height:100%;background:var(--ok);border-radius:999px}
.row em{font-style:normal;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px!important;font-weight:600!important}
.voice-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--tint);border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px}
.card>.btns:last-child{position:sticky;bottom:-22px;background:var(--card);padding-block:10px 4px;margin-bottom:-4px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.14)}70%{transform:scale(.95)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
@keyframes spin-in{from{transform:scale(.2) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:420px){.brand{font-size:23px}.bar{gap:7px}.goal .gi{width:42px;height:42px}.round{width:46px;height:46px}}
@media (max-height:520px) and (orientation:landscape){.meadow.home{height:170px}.bar{min-height:54px;padding:4px 8px}.round{width:44px;height:44px}.goal .gi{width:40px;height:40px}.goal h2{font-size:19px}.dot{width:14px;height:14px}.meadow.field{height:clamp(200px,calc(100vh - 112px),940px);height:clamp(200px,calc(100dvh - 112px),940px)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand" id="brand"></h1>
    <div class="hud">
      <a class="pill small games-link" id="gamesLink" href="../"></a>
      <div class="lang" role="group" aria-label="Dil / Language">
        <button id="lang-tr" data-lang="tr">TR</button>
        <button id="lang-en" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div class="voice-note" id="voiceNote" hidden></div>

  <section id="home" style="display:flex;flex-direction:column;gap:16px">
    <div class="meadow home" id="homeMeadow"></div>
    <p class="hello" id="hello"></p>
    <div class="tiles" id="tiles"></div>
    <div class="btns">
      <button class="pill" id="albumBtn"></button>
      <button class="pill small" id="soundBtn"></button>
      <div class="seg" id="voiceSel" role="group" hidden><span id="voiceSelLabel"></span><button data-voice="kadin"></button></div>
      <button class="pill small" id="parentBtn"></button>
    </div>
  </section>

  <section id="play" hidden style="display:flex;flex-direction:column;gap:10px">
    <div class="bar">
      <button class="round" id="backBtn"></button>
      <div class="goal" id="goal"></div>
      <button class="round speak" id="speakBtn"></button>
    </div>
    <div class="meadow field" id="field"></div>
  </section>
</div>

<div class="ov" id="rewardOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
    <div class="reward" id="rewardArt"></div>
    <h3 id="rewardTitle"></h3>
    <p id="rewardText"></p>
    <div class="btns"><button class="pill" id="rewardGo"></button></div>
  </div>
</div>

<div class="ov" id="albumOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="albumTitle">
    <h3 id="albumTitle"></h3>
    <p id="albumText"></p>
    <div class="album" id="album"></div>
    <div class="btns"><button class="pill" data-close="albumOv" id="albumClose"></button></div>
  </div>
</div>

<div class="ov" id="parentOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="parentTitle">
    <h3 id="parentTitle"></h3>
    <div class="stats" id="stats"></div>
    <p class="note" id="parentNote"></p>
    <div class="btns">
      <button class="pill small" id="resetBtn"></button>
      <button class="pill" data-close="parentOv" id="parentClose"></button>
    </div>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
const INK='#3b2a5c';
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const cap=(s,l)=>s?s[0].toLocaleUpperCase(l==='tr'?'tr-TR':'en-US')+s.slice(1):s;
const JAR_SIZE=8;

/* renkler: gökkuşağı sırası (oyunun Türkçe ses kayıtlarındaki renklerle aynı) */
const RB=['#ff5a5a','#ff9f43','#ffd93d','#4cd17a','#4aa8ff','#5a63e0','#a66bff'];
const RBL=['#ffc2c2','#ffd4a8','#fff1a6','#bdeecd','#c4e3ff','#c3c5f7','#e1cfff'];
const HUNT=[0,1,2,3,4,6]; /* renk avında lacivert yok: mavi/mor ile karışmasın */

const T={
  tr:{
    name:"İpek'in Kelebek Bahçesi",greet:'Merhaba İpek! Haydi oynayalım!',parentTitle:'İpek’in ilerlemesi',
    hello:'Merhaba İpek! Bahçede rengârenk kelebekler uçuyor. Onlara dokunup yakala ve kavanozu doldur! Kavanoz dolunca kelebekleri serbest bırakırız, albümüne de yeni bir kelebek gelir.',

    colorSay:['Kırmızı!','Turuncu!','Sarı!','Yeşil!','Mavi!','Lacivert!','Mor!'],

    lvlNote:l=>`Şu anki seviye: ${l}/3. Her iki kavanozda bir kelebekler biraz hızlanır, çiçeklere daha kısa konar ve sayılar büyür.`,
    parentNote:'Kelebek yakala el-göz koordinasyonunu ve saymayı, Renk avı renk tanımayı ve seçici dikkati, Say ve yakala sayı-miktar eşleştirmesini çalıştırır. Yanlış kelebeğe dokunmak puan götürmez; kelebek kaçar ve çocuk tekrar dener. Kelebekler arada çiçeklere konar; o an yakalamak en kolayıdır. İlerleme bu cihazda saklanır.',
    reset:'İlerlemeyi sıfırla',resetSure:'Emin misin? Tekrar dokun',

    modes:{free:'Catch them',color:'Color hunt',count:'Count & catch'},
    sub:{free:'Fill the jar',color:'Find the color',count:'Count as you catch'},
    soundOn:'Sound on',soundOff:'Sound off',parent:'Parent panel',close:'Close',album:'Butterfly album',
    back:'Back to home',replay:'Hear the task again',
    nums:['zero','one','two','three','four','five','six','seven','eight'],
    colors:['red','orange','yellow','green','blue','indigo','purple'],
    colorSay:['Red!','Orange!','Yellow!','Green!','Blue!','Indigo!','Purple!'],
    praise:['Great job, Ipek!','Awesome!','You did it, Ipek!','Bravo!','Well done, Ipek!','Amazing!'],
    tryAgain:'Try again, Ipek!',
    isBf:"It's a butterfly!",

  if(l==='en'&&/samantha|ava|allison|aria|jenny|zoe|karen|daniel/.test(n))s+=2;

function confetti(n){if(reduce||!ctx)return;fx.width=innerWidth;fx.height=innerHeight;for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.5,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:5+Math.random()*7,c:RB[i%7],a:Math.random()*6,va:(Math.random()-.5)*.3,life:1,star:Math.random()<.5});if(!fxOn){fxOn=true;requestAnimationFrame(tick)}}

  const m=$('homeMeadow');
  m.innerHTML=meadowBase()+[[0,'a'],[4,'b'],[6,'c']].map(([ci,k])=>`<button class="hbf flap ${k}" data-ci="${ci}" aria-label="${L().bfName(L().colors[ci])}">${bfSvg(ci,false)}</button>`).join('')+
    `<div class="jar" id="homeJar">${jarSvg(S.jar)}<span class="lbl">${L().jar(S.jar.length)}</span></div>`;
  m.querySelectorAll('.hbf').forEach(b=>b.onclick=()=>{const ci=+b.dataset.ci;say([L().isBf,L().colorSay[ci]]);pling(ci)});
}

/* ---------- oyun ---------- */
let screen='home',mode='free',paused=false,locked=false,playGen=0;
let BF=[],FLW=[],W=0,H=0,SZ=80,raf=0,lastT=0,spawnCD=0,lastTry=0,catchSeq=0;
let CR={target:2,hits:0,done:false};  /* renk avı turu */
let CN={n:2,hits:0,done:false};       /* say ve yakala turu */

function later(fn,ms){const g=playGen;setTimeout(function w(){if(g!==playGen||screen!=='play')return;if(paused){setTimeout(w,300);return}fn()},ms)}

function setupField(){
  const f=$('field');
  f.innerHTML=meadowBase()+`<div class="jar" id="jar"><span class="lbl" id="jarLbl"></span></div>`;
  renderJar();measure();
}
function measure(){
  const f=$('field');W=f.clientWidth;H=f.clientHeight;
  SZ=Math.round(Math.max(64,Math.min(112,Math.min(W,H*1.3)*.15)));
  const fr=f.getBoundingClientRect();
  FLW=[...f.querySelectorAll('.fl')].map(e=>{const r=e.getBoundingClientRect();return{x:r.left-fr.left+r.width/2,y:r.top-fr.top+r.height*.26,busy:false}});
  BF.forEach(b=>{b.el.style.width=SZ+'px';if(b.state!=='leave'){b.x=Math.max(SZ*.5,Math.min(W-SZ*.5,b.x));b.y=Math.max(SZ*.5,Math.min(H-SZ*.5,b.y))}});
}
function renderJar(newIdx){
  const j=$('jar');if(!j)return;
  const lbl=`<span class="lbl" id="jarLbl">${L().jar(S.jar.length)}</span>`;
  j.innerHTML=jarSvg(S.jar,newIdx)+lbl;
  if(newIdx!=null){j.classList.remove('bump');void j.offsetWidth;j.classList.add('bump')}
}
function jarPoint(){const f=$('field'),j=$('jar');if(!j)return{x:W-40,y:H-40};const fr=f.getBoundingClientRect(),r=j.getBoundingClientRect();return{x:r.left-fr.left+r.width/2,y:r.top-fr.top+r.height*.45}}
function speed(){return Math.max(38,W*.1)*(1+.22*(level()-1))}
function wanted(){return(mode==='color'?6:5)+(level()===3?1:0)}

function kindFor(){
  if(mode==='color'){
    const tg=BF.filter(b=>b.state!=='leave'&&b.ci===CR.target).length;
    if(tg<2||Math.random()<.3)return{ci:CR.target,sp:false};
    return{ci:pick(HUNT.filter(c=>c!==CR.target)),sp:false};
  }
  if(mode==='free'&&unlocked()&&Math.random()<.25)return{ci:rnd(unlocked()),sp:true};
  return{ci:rnd(7),sp:false};
}
function spawn(k){
  k=k||kindFor();
  const left=Math.random()<.5,el=document.createElement('div');
  el.className='bf';el.style.width=SZ+'px';el.innerHTML=bfSvg(k.ci,k.sp);
  el.querySelectorAll('.wl,.wr').forEach(g=>g.style.animationDelay=(-Math.random()).toFixed(2)+'s');
  const b={el,ci:k.ci,sp:k.sp,x:left?-SZ*.6:W+SZ*.6,y:SZ*.6+Math.random()*Math.max(10,H*.55-SZ*.6),wa:left?(Math.random()-.5)*.8:Math.PI+(Math.random()-.5)*.8,vx:0,vy:0,state:'fly',t:0,ph:Math.random()*6,fl:null,dodge:0,landCD:2+Math.random()*3};
  const s=speed();b.vx=Math.cos(b.wa)*s;b.vy=Math.sin(b.wa)*s;
  $('field').appendChild(el);BF.push(b);place(b);return b;
}
function place(b){
  const bob=b.state==='rest'?0:Math.sin(b.t*5+b.ph)*5;
  const s=speed(),tilt=b.state==='rest'?0:Math.max(-16,Math.min(16,b.vx/s*14));
  b.el.style.transform=`translate3d(${(b.x-SZ/2).toFixed(1)}px,${(b.y-SZ/2+bob).toFixed(1)}px,0) rotate(${tilt.toFixed(1)}deg)`;
}
function freeFlower(b){if(b.fl){b.fl.busy=false;b.fl=null}}
function update(dt){
  const s=speed(),m=SZ*.55,floor=H-SZ*.45;
  for(const b of BF.slice()){
    b.t+=dt;
    if(b.state==='leave'){
      b.vx+=(b.x<W/2?-1:1)*s*2*dt;b.vy-=s*.6*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;place(b);
      if(b.x<-SZ*1.5||b.x>W+SZ*1.5||b.y<-SZ*1.5){b.el.remove();BF.splice(BF.indexOf(b),1)}
      continue;
    }
    if(b.state==='rest'){
      b.rt-=dt;if(b.rt<=0){b.state='fly';b.el.classList.remove('rest');freeFlower(b);b.wa=-Math.PI/2+(Math.random()-.5)*1.6;b.vx=Math.cos(b.wa)*s;b.vy=Math.sin(b.wa)*s;b.landCD=4+Math.random()*4}
      place(b);continue;
    }
    if(b.state==='land'){
      const tx=b.fl.x,ty=b.fl.y-SZ*.22,dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy);
      if(d<5){b.x=tx;b.y=ty;b.state='rest';b.rt=[3.2,2.4,1.6][level()-1]+Math.random();b.el.classList.add('rest');b.vx=0;b.vy=0;place(b);continue}
      const v=Math.min(s*.9,d*2.2+20);b.vx=dx/d*v;b.vy=dy/d*v;b.x+=b.vx*dt;b.y+=b.vy*dt;place(b);continue;
    }
    /* uçuş: yumuşak gezinme + kenarlardan içeri itme */
    b.landCD-=dt;
    b.wa+=(Math.random()-.5)*4*dt;
    let fxx=0,fyy=0;
    if(b.x<m)fxx+=(m-b.x)*4;if(b.x>W-m)fxx-=(b.x-(W-m))*4;
    if(b.y<m)fyy+=(m-b.y)*4;if(b.y>floor-SZ*.3)fyy-=(b.y-(floor-SZ*.3))*4;
    const ds=b.dodge>0?s*2.6:s;b.dodge=Math.max(0,b.dodge-dt);
    b.vx+=(Math.cos(b.wa)*ds-b.vx)*Math.min(1,dt*1.6)+fxx*dt;
    b.vy+=(Math.sin(b.wa)*ds-b.vy)*Math.min(1,dt*1.6)+fyy*dt;
    const sp=Math.hypot(b.vx,b.vy),cap_=ds*1.35;if(sp>cap_){b.vx*=cap_/sp;b.vy*=cap_/sp}
    if(fxx||fyy)b.wa=Math.atan2(b.vy,b.vx);
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.landCD<=0&&b.dodge<=0&&b.x>m&&b.x<W-m){
      const free=FLW.filter(f=>!f.busy);
      if(free.length&&Math.random()<dt*.35){const f=pick(free);f.busy=true;b.fl=f;b.state='land'}
      else b.landCD=1+Math.random()*2;
    }
    place(b);
  }
  /* eksik kelebekleri tek tek getir */
  spawnCD-=dt;
  if(!locked&&spawnCD<=0){
    const active=BF.filter(b=>b.state!=='leave');
    if(active.length<wanted()){spawn();spawnCD=.7}
    else if(mode==='color'&&active.filter(b=>b.ci===CR.target).length<2){
      const other=active.find(b=>b.ci!==CR.target&&b.state==='fly');
      if(other){shoo(other);spawnCD=.4}
    }
  }
}
function shoo(b){freeFlower(b);b.el.classList.remove('rest');b.state='leave';b.vx=(b.x<W/2?-1:1)*speed();b.vy=-speed()*.4}
function loop(t){
  raf=requestAnimationFrame(loop);
  if(screen!=='play'){lastT=t;return}
  const dt=Math.min(.05,Math.max(0,(t-lastT)/1000));lastT=t;
  if(paused||document.hidden)return;
  update(dt);
}

function sparkleAt(x,y){
  if(reduce)return;const f=$('field');
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2,d=34+Math.random()*24,s=document.createElement('div');s.className='spark';s.innerHTML=ICON.sparkle;s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',(Math.cos(a)*d).toFixed(0)+'px');s.style.setProperty('--dy',(Math.sin(a)*d).toFixed(0)+'px');f.appendChild(s);setTimeout(()=>s.remove(),650)}
}
function onFieldDown(e){
  if(screen!=='play'||paused)return;
  e.preventDefault();
  const r=$('field').getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  let best=null,bd=1e9;
  for(const b of BF){if(b.state==='leave')continue;const d=Math.hypot(b.x-px,b.y-py);if(d<bd){bd=d;best=b}}
  if(!best||bd>Math.max(46,SZ*.72))return;
  hit(best,px,py);
}
function hit(b,px,py){
  if(locked)return;
  if(mode==='color'){
    if(CR.done)return;
    S.colorStats[1]++;
    if(b.ci!==CR.target){
      save();boop();b.el.classList.remove('nope');void b.el.offsetWidth;b.el.classList.add('nope');
      freeFlower(b);if(b.state!=='fly'){b.state='fly';b.el.classList.remove('rest')}
      b.wa=Math.atan2(b.y-py,b.x-px);b.dodge=.7;b.landCD=3;
      const now=Date.now();if(now-lastTry>2600){lastTry=now;say(L().tryAgain)}
      return;
    }
    S.colorStats[0]++;
  }
  if(mode==='count'&&CN.done)return;
  catchBf(b,px,py);
}
function catchBf(b,px,py){
  freeFlower(b);BF.splice(BF.indexOf(b),1);
  const n=++catchSeq;
  S.caught++;S.jar.push([b.ci,b.sp?1:0]);save();
  const inJar=S.jar.length,full=inJar>=JAR_SIZE;if(full)locked=true;
  sparkleAt(b.x,b.y);pling(inJar-1);
  const j=jarPoint();b.el.classList.remove('rest');b.el.classList.add('caught');
  b.el.style.transform=`translate3d(${(j.x-SZ/2).toFixed(1)}px,${(j.y-SZ/2).toFixed(1)}px,0) scale(.3)`;b.el.style.opacity='.2';
  setTimeout(()=>{b.el.remove();if(screen==='play')renderJar(inJar-1)},reduce?0:620);
  spawnCD=Math.max(spawnCD,.9);
  const l=L();
  if(mode==='free'){say(l.nums[inJar])}
  else if(mode==='color'){
    CR.hits++;renderGoal();say(l.nums[CR.hits]);
    if(CR.hits>=3){CR.done=true;S.colorRounds++;save();say(pick(l.praise),true);if(!full)confetti(50);later(newColorRound,2200)}
  }else{
    CN.hits++;renderGoal();say(l.nums[CN.hits]);
    if(CN.hits>=CN.n){CN.done=true;S.countRounds++;save();say(pick(l.praise),true);if(!full)confetti(50);later(newCountRound,2300)}
  }
  if(full)setTimeout(()=>{if(screen==='play')jarFull()},reduce?200:950);
}
function jarFull(){
  paused=true;S.jars++;save();
  const l=L(),idx=S.jars-1;
  harp();confetti(140);
  $('rewardTitle').textContent=l.jarFull;
  if(idx<7){$('rewardArt').innerHTML=bfSvg(idx,true);$('rewardText').textContent=l.newBf(l.colors[idx]);say([pick(l.praise),l.colorSay[idx]],true);if(idx===6)say(l.allColors,true)}
  else{$('rewardArt').innerHTML=jarSvg(S.jar);$('rewardText').textContent=l.allBf;say(pick(l.praise),true)}
  $('rewardGo').textContent=l.release;
  const g=playGen;setTimeout(()=>{if(g===playGen&&screen==='play')$('rewardOv').hidden=false},reduce?0:1000);
}
function releaseJar(){
  const f=$('field'),j=jarPoint(),list=S.jar.slice();
  S.jar=[];save();renderJar();
  if(!reduce)list.forEach(([ci,sp],i)=>{
    const el=document.createElement('div');el.className='bf flap fly';el.style.width=Math.round(SZ*.6)+'px';el.innerHTML=bfSvg(ci,!!sp);
    el.style.transform=`translate3d(${j.x-SZ*.3}px,${j.y-SZ*.3}px,0) scale(.5)`;f.appendChild(el);
    setTimeout(()=>{el.style.transform=`translate3d(${(Math.random()*W-SZ*.3).toFixed(0)}px,${(-SZ*2-Math.random()*H*.3).toFixed(0)}px,0) scale(1)`;el.style.opacity='0'},40+i*110);
    setTimeout(()=>el.remove(),2100+i*110);
  });
  locked=false;paused=false;
}
$('rewardGo').onclick=()=>{$('rewardOv').hidden=true;tone(988,.2);if(screen==='play')releaseJar();else{S.jar=[];save()}};

function newColorRound(){
  const prev=CR.target;let c;do{c=pick(HUNT)}while(c===prev&&HUNT.length>1);
  CR={target:c,hits:0,done:false};renderGoal();say(L().colorSay[c]);
}
function newCountRound(){
  const lv=level(),lo=[2,2,3][lv-1],hi=[3,4,5][lv-1];let n;
  do{n=lo+rnd(hi-lo+1)}while(n===CN.n&&hi>lo);
  CN={n,hits:0,done:false};renderGoal();say(L().nums[n]);
}
function goalSpeech(){const l=L();if(mode==='color')return l.colorSay[CR.target];if(mode==='count')return l.nums[CN.n];return l.greet}
function renderGoal(){
  const l=L(),g=$('goal');let icon,txt,dots='',done=false;
  if(mode==='color'){icon=bfSvg(CR.target,false);txt=l.colorQ(l.colors[CR.target]);dots=[0,1,2].map(i=>`<i class="dot${i<CR.hits?' on':''}"></i>`).join('');done=CR.done}
  else if(mode==='count'){icon=`<span class="num">${CN.n}</span>`;txt=l.countQ(CN.n);dots=Array.from({length:CN.n},(_,i)=>`<i class="dot${i<CN.hits?' on':''}"></i>`).join('');done=CN.done}
  else{icon=jarSvg([]);txt=l.freeQ}
  g.className='goal'+(done?' done':'');
  g.innerHTML=`<div class="gi${mode==='color'?' flap':''}">${icon}</div><div class="txt"><h2 id="prompt">${txt}</h2>${dots?`<div class="dots" aria-hidden="true">${dots}</div>`:''}</div>`;
}
function startPlay(m){
  mode=m;playGen++;paused=false;locked=false;catchSeq=0;
  BF.forEach(b=>b.el.remove());BF=[];
  show('play');setupField();
  if(mode==='color'){CR={target:-1,hits:0,done:false};newColorRound()}
  else if(mode==='count'){CN={n:0,hits:0,done:false};newCountRound()}
  else{renderGoal();say(L().greet)}
  spawnCD=0;
  for(let i=0;i<3;i++){const b=spawn();b.x=SZ*.7+Math.random()*(W-SZ*1.4);b.y=SZ*.7+Math.random()*Math.max(10,H*.5-SZ*.7);place(b)}
  if(mode==='color'&&BF.filter(b=>b.ci===CR.target).length<1){BF[0].ci=CR.target;BF[0].el.innerHTML=bfSvg(CR.target,false)}
  if(S.jar.length>=JAR_SIZE){locked=true;setTimeout(()=>{if(screen==='play')jarFull()},400)}
}

/* ---------- ekranlar ---------- */
function renderHome(){
  const l=L();
  $('hello').textContent=l.hello;
  renderHomeMeadow();
  const art={
    free:bfSvg(0,false)+jarSvg([[2,0],[4,0],[6,0]]),
    color:bfSvg(2,false)+bfSvg(4,false)+bfSvg(1,false),
    count:`<span class="num">3</span>`+bfSvg(3,false)
  };
  $('tiles').innerHTML=['free','color','count'].map(k=>`<button class="tile" data-mode="${k}"><div class="art">${art[k]}</div><b>${l.modes[k]}</b><span>${l.sub[k]}</span></button>`).join('');
}
function renderStatic(){
  const l=L();
  document.documentElement.lang=S.lang;document.title=l.name;
  $('brand').innerHTML=bfSvg(6,true)+l.name;
  $('gamesLink').innerHTML=svg(`<rect x="10" y="10" width="34" height="34" rx="9" fill="#ff7eb6" ${st(5)}/><rect x="56" y="10" width="34" height="34" rx="9" fill="#ffd93d" ${st(5)}/><rect x="10" y="56" width="34" height="34" rx="9" fill="#4aa8ff" ${st(5)}/><rect x="56" y="56" width="34" height="34" rx="9" fill="#5fd3b5" ${st(5)}/>`)+(S.lang==='tr'?'Oyunlar':'Games');$('gamesLink').setAttribute('aria-label',S.lang==='tr'?'Tüm oyunlar':'All games');
  ['tr','en'].forEach(k=>$('lang-'+k).setAttribute('aria-pressed',String(S.lang===k)));
  $('soundBtn').innerHTML=(S.sound?ICON.speaker:ICON.mute)+(S.sound?l.soundOn:l.soundOff);
  $('parentBtn').textContent=l.parent;$('albumBtn').innerHTML=bfSvg(4,true)+l.album;
  $('backBtn').innerHTML=ICON.back;$('backBtn').setAttribute('aria-label',l.back);
  $('speakBtn').innerHTML=ICON.speaker;$('speakBtn').setAttribute('aria-label',l.replay);
  $('parentTitle').textContent=l.parentTitle;$('parentNote').textContent=l.parentNote;$('parentClose').textContent=l.close;
  $('resetBtn').textContent=l.reset;$('albumTitle').textContent=l.album;$('albumClose').textContent=l.close;
}
function renderAll(){renderVoiceSel();renderStatic();renderVoiceNote();if(screen==='home')renderHome();else{renderGoal();renderJar()}}
function show(s){
  screen=s;$('home').hidden=s!=='home';$('play').hidden=s!=='play';
  document.body.classList.toggle('playing',s==='play');
  if(s==='play')window.scrollTo(0,0);
  if(s==='home'){playGen++;BF.forEach(b=>b.el.remove());BF=[];$('field').innerHTML='';renderHome();hush();window.scrollTo(0,0)}
}
function renderAlbum(){
  const l=L(),n=unlocked();
  $('albumText').textContent=n?l.albumText:l.albumEmpty;
  $('album').innerHTML=RB.map((_,i)=>i<n
    ?`<button class="alb got flap" data-ci="${i}">${bfSvg(i,true)}${l.bfName(l.colors[i])}</button>`
    :`<div class="alb locked"><span style="font:700 34px var(--display)">?</span>${l.locked}<small>${l.lockedHint(i+1)}</small></div>`).join('');
  $('album').querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>{const ci=+b.dataset.ci;say(l.colorSay[ci]);pling(ci)});
}
function renderStats(){
  const l=L();const[c,t]=S.colorStats,p=t?Math.round(c/t*100):0;
  const v=VOICE[S.lang];
  $('stats').innerHTML=`<div class="kpis"><div class="kpi"><b>${S.caught}</b><span>${l.caught}</span></div><div class="kpi"><b>${S.jars}</b><span>${l.jars}</span></div><div class="kpi"><b>${unlocked()}/7</b><span>${l.albumK}</span></div></div>`+
    `<p class="note" style="margin:0">${l.colorNote}</p><div class="row"><span>${l.colorRow}</span><div class="track"><i style="width:${p}%"></i></div><em>${t?p+'%':'—'} <small>(${c}/${t})</small></em></div>`+
    `<div class="row"><span>${l.rounds}</span><div></div><em>${l.roundsTxt(S.countRounds)}</em></div>`+
    `<p class="note" style="margin:0">${l.lvlNote(level())}</p><div class="voice-line"><span>${ownVoice()?l.voiceUsed(`${l.voiceNames[curVoice()]} · ${l.voiceBuiltIn}`):v?l.voiceUsed(`${v.name} (${v.lang})`):l.voiceNone}</span>${(v||ownVoice())?`<button class="pill small" id="testVoice">${l.voiceTest}</button>`:''}</div>`;
  if(v||ownVoice())$('testVoice').onclick=()=>{const was=S.sound;S.sound=true;say(l.voiceTestSay);S.sound=was};
}
let resetArm=false;
$('resetBtn').onclick=()=>{const l=L();if(!resetArm){resetArm=true;$('resetBtn').textContent=l.resetSure;setTimeout(()=>{resetArm=false;$('resetBtn').textContent=L().reset},4000);return}const keep={sound:S.sound,lang:S.lang,voice:S.voice};S=Object.assign(fresh(),keep);save();resetArm=false;renderAll();renderStats()};

$('tiles').onclick=e=>{const t=e.target.closest('.tile');if(!t)return;startPlay(t.dataset.mode)};
$('backBtn').onclick=()=>show('home');
$('speakBtn').onclick=()=>say(goalSpeech());
$('field').addEventListener('pointerdown',onFieldDown);
$('field').addEventListener('contextmenu',e=>e.preventDefault());
$('albumBtn').onclick=()=>{renderAlbum();$('albumOv').hidden=false};
$('parentBtn').onclick=()=>{renderStats();$('parentOv').hidden=false};
$('soundBtn').onclick=()=>{S.sound=!S.sound;save();renderStatic();renderVoiceNote();if(!S.sound)hush()};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{if(S.lang===b.dataset.lang)return;S.lang=b.dataset.lang;save();hush();renderAll();if(screen==='play')say(goalSpeech())});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close).hidden=true});
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o&&o.id!=='rewardOv')o.hidden=true}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')['albumOv','parentOv'].forEach(id=>$(id).hidden=true)});
let rsT=0;addEventListener('resize',()=>{if(ctx){fx.width=innerWidth;fx.height=innerHeight}clearTimeout(rsT);rsT=setTimeout(()=>{if(screen==='play')measure()},120)});

renderAll();show('home');watchVoices();raf=requestAnimationFrame(loop);
</script>
