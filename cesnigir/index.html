<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>İpek'in Çeşnigir Turu</title>
<meta name="description" content="Çocuklar için Çeşnigir Köprüsü ve Köprüköy'de araba turu: yıldız topla, köylülere korna çal. A kids' driving game at the historic Çeşnigir Bridge.">
<meta name="theme-color" content="#cfe9ff">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Çeşnigir">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap">
<script src="three.min.js"></script>
<style>
/* layout: full-screen 3D scene; thin bar on top (Games · stars · sound · language), big steering/go/horn buttons at the bottom. Start and reward cards in the middle. */
:root{
  --ink:#3b2a5c;--ink2:#6c5a92;--card:#fffdfb;--tint:#f2f8ff;--gold:#ffcb3d;--ok:#1f9e66;--pink:#ff7eb6;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe9ff;touch-action:none;overscroll-behavior:none}
body{font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:var(--ink)}
.pill{font:800 15px var(--body);background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--ink);min-height:44px;text-decoration:none;color:var(--ink)}
.pill svg{width:22px;height:22px;flex:none}
.pill:active,.big:active,.big.on{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.top{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none}
.top>*{pointer-events:auto}
.right{display:flex;gap:8px;align-items:center}
.stars{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:5px 12px 5px 8px;box-shadow:0 4px 0 var(--ink)}
.stars svg.si{width:30px;height:30px;flex:none}
.dots{display:flex;gap:5px}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dot.on{background:var(--gold);animation:bounce .45s}
.round{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.round svg{width:24px;height:24px}
.lang{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--ink)}
.lang button{font:800 14px var(--body);border:0;background:none;padding:7px 11px;cursor:pointer;min-height:42px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* driving buttons */
.ctl{position:fixed;z-index:10;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:flex-end}
.ctl.l{left:calc(16px + env(safe-area-inset-left))}
.ctl.r{right:calc(16px + env(safe-area-inset-right))}
.ctl.m{left:50%;transform:translateX(-50%)}
.big{--s:clamp(74px,12vmin,108px);width:var(--s);height:var(--s);border-radius:50%;border:4px solid var(--ink);background:var(--card);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;touch-action:none}
.big svg{width:56%;height:56%}
.big.go{background:#5fd38a}
.big.go.stop{background:#ff7a7a}
.big.horn{--s:clamp(60px,9.5vmin,84px);background:var(--gold)}
.big .lbl{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font:800 12px var(--body);background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:1px 8px;white-space:nowrap}
.big{position:relative}
body.idle .ctl{display:none}

#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%) scale(.9);z-index:11;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);
  padding:8px 18px;font:700 clamp(18px,4.6vw,26px)/1.2 var(--display);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}

.ov{position:fixed;inset:0;background:rgba(59,42,92,.42);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.card{background:var(--card);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);padding:20px 18px;max-width:520px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;max-height:calc(100dvh - 32px);overflow:auto}
.card h1,.card h3{margin:0;font:700 clamp(26px,6vw,34px)/1.1 var(--display);text-wrap:balance}
.card .eyebrow{font:800 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.card p{margin:0;color:var(--ink2);font-weight:700;line-height:1.45}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.how div{background:var(--tint);border-radius:18px;padding:10px 6px;font:800 13px/1.3 var(--body);display:flex;flex-direction:column;align-items:center;gap:6px}
.how svg{width:40px;height:40px}
.garage{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.garage button{width:76px;border-radius:16px;border:3px solid var(--ink);background:#fff;padding:4px 4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:800 11px var(--body)}
.garage button svg{width:62px;height:38px}
.garage button[aria-pressed="true"]{background:#ffe6f2;border-color:var(--pink);box-shadow:0 0 0 3px var(--pink)}
.garage button:disabled{border-style:dashed;color:#9a8db8;cursor:default;background:#f6f3fb}
.garage small{font:700 10px var(--body)}
.sublbl{font:800 13px var(--body);color:var(--ink2);margin-bottom:-4px}
.seg{display:inline-flex;align-self:center;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}.seg span{font:800 13px var(--body);padding:6px 4px 6px 12px;align-self:center}.seg button{font:800 13px var(--body);border:0;background:none;padding:6px 11px;cursor:pointer;min-height:40px}.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.startBtn{align-self:center;font:700 24px var(--display);background:var(--gold);border:4px solid var(--ink);border-radius:999px;padding:12px 30px;box-shadow:0 6px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.startBtn svg{width:24px;height:24px}
.startBtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.reward svg{width:min(56vw,200px);height:auto;animation:spin-in .7s}
.err{background:#fff3cc;border:3px solid var(--ink);border-radius:18px;padding:12px;font-weight:800}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}70%{transform:scale(.95)}}
@keyframes spin-in{from{transform:scale(.2) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
@media (max-width:520px){.dot{width:13px;height:13px;border-width:2.5px}.dots{gap:4px}.stars svg.si{width:24px;height:24px}.pill .gl{display:none}.round{width:44px;height:44px}.how div{font-size:12px}}
@media (max-height:500px){.card{gap:8px;padding:14px}.how svg{width:30px;height:30px}.card h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="idle">
<canvas id="scene"></canvas>

<div class="top">
  <a class="pill" id="gamesLink" href="../"></a>
  <div class="stars" id="starBar" aria-live="polite"></div>
  <div class="right">
    <button class="round" id="soundBtn"></button>
    <div class="lang" role="group" aria-label="Dil / Language">
      <button data-lang="tr">TR</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</div>

<div class="ctl l"><button class="big" id="btnL"></button></div>
<div class="ctl m"><button class="big go" id="btnGo"></button><button class="big horn" id="btnHorn"></button></div>
<div class="ctl r"><button class="big" id="btnR"></button></div>

<div id="toast"></div>

<div class="ov" id="startOv">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="startTitle"></h1>
    <p id="hello"></p>
    <div class="how" id="how"></div>
    <div class="sublbl" id="garageLbl"></div>
    <div class="garage" id="garage"></div>
    <div class="seg" id="voiceSel" role="group" hidden><span id="voiceSelLabel"></span><button data-voice="kadin"></button><button data-voice="fettah"></button></div>
    <button class="startBtn" id="startBtn"></button>
  </div>
</div>

<div class="ov" id="rewardOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
    <div class="reward" id="rewardArt"></div>
    <h3 id="rewardTitle"></h3>
    <p id="rewardText"></p>
    <button class="startBtn" id="rewardGo"></button>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const INK='#3b2a5c';
const pick=a=>a[Math.floor(Math.random()*a.length)];
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- metinler ---------- */
const CARS=[0xe0453a,0xff7eb6,0x4aa8ff,0xffcb3d,0xa66bff,0x4cd17a];
const T={
  tr:{name:"İpek'in Çeşnigir Turu",eyebrow:'Kırıkkale · Köprüköy',games:'Oyunlar',
    hello:"Arabana bin İpek! Tarihi Çeşnigir Köprüsü'nden geç, köyde saklanan 8 yıldızı topla. Köylüler sana el sallayacak!",
    how:['◀ ▶ ile yön ver','Sarı ok yıldızı gösterir','Korna çal, el sallasınlar'],
    start:'Haydi başlayalım!',garage:'Arabanın rengi',locked:n=>`${n}. turda`,
    colors:['Kırmızı','Pembe','Mavi','Sarı','Mor','Yeşil'],
    go:'Git',stop:'Dur',horn:'Korna',left:'Sola dön',right:'Sağa dön',soundOn:'Ses açık',soundOff:'Ses kapalı',
    water:'Dikkat, su! 💦',edge:'Geri dönelim!',star:n=>`${n}. yıldız! ⭐`,
    nums:['sıfır','bir','iki','üç','dört','beş','altı','yedi','sekiz'],
    praise:['Aferin İpek!','Harika!','Süpersin İpek!','Bravo İpek!','Çok güzel!','Muhteşemsin İpek!'],
    allTitle:'Bütün yıldızları topladın!',allText:'Yıldızlar yeniden yerlerine kondu.',newColor:c=>`Yeni araba rengi kazandın: ${c}!`,again:'Yeni tur',
    greet:['Merhaba İpek! Haydi oynayalım!','Bravo İpek!','Süpersin İpek!','Aferin İpek!','Çok güzel!','Harika!','Muhteşemsin İpek!'],
    labels:['Çeşnigir Köprüsü','Köprüköy','Kızılırmak','Çeşnigir Kanyonu'],
    starsLbl:n=>`Yıldızlar: ${n}/8`,
    noGL:'Bu cihaz 3B oyunu açamadı. Başka bir tarayıcıda (Safari veya Chrome) deneyin.',
    voiceLabel:'Ses:',voiceNames:{kadin:'Kadın',fettah:'Fettah'}},
  en:{name:"Ipek's Çeşnigir Drive",eyebrow:'Kırıkkale · Köprüköy',games:'Games',
    hello:'Hop in, Ipek! Drive across the old Çeşnigir Bridge and find the 8 stars hidden in the village. The villagers will wave at you!',
    how:['Steer with ◀ ▶','The yellow arrow shows the star','Honk and they wave'],
    start:"Let's go!",garage:'Car color',locked:n=>`Round ${n}`,
    colors:['Red','Pink','Blue','Yellow','Purple','Green'],
    go:'Go',stop:'Stop',horn:'Honk',left:'Turn left',right:'Turn right',soundOn:'Sound on',soundOff:'Sound off',
    water:'Careful, water! 💦',edge:"Let's turn back!",star:n=>`Star ${n}! ⭐`,
    nums:['zero','one','two','three','four','five','six','seven','eight'],
    praise:['Great job, Ipek!','Awesome!','You did it, Ipek!','Bravo!','Well done, Ipek!','Amazing!'],
    allTitle:'You found every star!',allText:'The stars are back in their places.',newColor:c=>`New car color: ${c}!`,again:'New round',
    greet:["Hi Ipek! Let's play!",'Bravo, Ipek!','You are super, Ipek!','Great job, Ipek!','Very nice!','Awesome!','Amazing, Ipek!'],
    labels:['Çeşnigir Bridge','Köprüköy','Kızılırmak River','Çeşnigir Canyon'],
    starsLbl:n=>`Stars: ${n}/8`,
    noGL:'This device could not open the 3D game. Please try another browser (Safari or Chrome).',
    voiceLabel:'Voice:',voiceNames:{kadin:'Female',fettah:'Fettah'}}
};

/* ---------- durum ---------- */
const KEY='cesnigir-surus-v1';
const fresh=()=>({rounds:0,stars:0,car:0,sound:true,lang:null,voice:'kadin'});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r))}catch(e){}
if(!S.lang){let l=null;try{l=localStorage.getItem('ipek-oyunlar-lang')}catch(e){}S.lang=l==='en'||l==='tr'?l:((navigator.language||'').toLowerCase().startsWith('en')?'en':'tr')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const L=()=>T[S.lang];
const unlocked=()=>Math.min(CARS.length,1+S.rounds);

/* ---------- sound (recorded Turkish clips, otherwise the device voice; never with the wrong accent) ---------- */
const VOICE={tr:null,en:null};
const hasTTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
function loadVoices(){if(!hasTTS)return;let vs=[];try{vs=speechSynthesis.getVoices()||[]}catch(e){}
  ['tr','en'].forEach(l=>{const c=vs.filter(v=>{const g=String(v.lang||'').toLowerCase().replace('_','-');return g===l||g.startsWith(l+'-')});
    c.sort((a,b)=>(/natural|neural|premium|enhanced|siri|google/i.test(b.name)?1:0)-(/natural|neural|premium|enhanced|siri|google/i.test(a.name)?1:0));VOICE[l]=c[0]||null})}
if(hasTTS){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
let AC=null;
function audioCtx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC}catch(e){return null}}
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
let unlockedAudio=false;
function unlockAudio(){const a=audioCtx();if(!a)return;if(a.state!=='running')a.resume().catch(()=>{});if(!unlockedAudio){try{const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0);unlockedAudio=true}catch(e){}}}
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state!=='running')AC.resume().catch(()=>{})});
const CLIPS={base:'audio/',map:null};
try{fetch(CLIPS.base+'manifest.json').then(r=>r.ok?r.json():null).then(m=>{if(m&&m.clips){CLIPS.map=m;renderVoiceSel()}}).catch(()=>{})}catch(e){}
function curVoice(){const vs=CLIPS.map?CLIPS.map.voices:[];return vs.includes(S.voice)?S.voice:vs[0]}
const ownVoice=()=>S.lang==='tr'&&!!CLIPS.map;
const clipBufs={};
function clipBuf(id){const a=audioCtx(),k=curVoice()+'/'+id;if(!a)return Promise.reject(new Error('no audio'));
  if(!clipBufs[k]){clipBufs[k]=fetch(CLIPS.base+k+'.mp3').then(r=>{if(!r.ok)throw new Error('missing');return r.arrayBuffer()}).then(b=>new Promise((res,rej)=>a.decodeAudioData(b,res,rej)));clipBufs[k].catch(()=>{delete clipBufs[k]})}
  return clipBufs[k]}
let clipGen=0,clipSrc=null,clipChain=Promise.resolve();
function stopClips(){clipGen++;try{clipSrc&&clipSrc.stop()}catch(e){}clipSrc=null}
function playBuf(buf,gen){return new Promise(async res=>{const a=audioCtx();if(gen!==clipGen||!a)return res();if(a.state!=='running'){try{await Promise.race([a.resume(),new Promise(r=>setTimeout(r,600))])}catch(e){}}if(gen!==clipGen)return res();const s=a.createBufferSource();s.buffer=buf;s.connect(a.destination);s.onended=()=>{if(clipSrc===s)clipSrc=null;res()};clipSrc=s;try{s.start()}catch(e){res()}})}
function playClips(parts,queue){if(!queue){stopClips();clipChain=Promise.resolve()}const gen=clipGen,loads=parts.map(p=>clipBuf(CLIPS.map.clips[p]));loads.forEach(p=>p.catch(()=>{}));
  clipChain=clipChain.then(async()=>{for(let i=0;i<loads.length;i++){if(gen!==clipGen)return;let b;try{b=await loads[i]}catch(e){continue}await playBuf(b,gen);if(i<loads.length-1)await new Promise(r=>setTimeout(r,140))}}).catch(()=>{})}
function say(t,queue){
  if(!S.sound)return;const parts=(Array.isArray(t)?t:[t]).filter(Boolean);if(!parts.length)return;
  if(ownVoice()&&parts.every(p=>CLIPS.map.clips[p])){try{speechSynthesis.cancel()}catch(e){}playClips(parts,queue);return}
  if(!hasTTS)return;const v=VOICE[S.lang];if(!v)return;if(!queue)stopClips();
  try{if(!queue)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(parts.join(' '));u.voice=v;u.lang=v.lang;u.rate=S.lang==='tr'?.9:.92;u.pitch=1.12;speechSynthesis.speak(u)}catch(e){}
}
function renderVoiceSel(){const box=$('voiceSel');const l=L(),vs=CLIPS.map?CLIPS.map.voices:[];box.hidden=!(S.lang==='tr'&&vs.length>1);$('voiceSelLabel').textContent=l.voiceLabel;
  box.querySelectorAll('button').forEach(b=>{b.hidden=!vs.includes(b.dataset.voice);b.textContent=l.voiceNames[b.dataset.voice];b.setAttribute('aria-pressed',String(curVoice()===b.dataset.voice))})}
document.querySelectorAll('#voiceSel button').forEach(b=>b.onclick=()=>{S.voice=b.dataset.voice;save();renderVoiceSel();say(L().greet[0])});
function tone(f,d,t0,type,vol){if(!S.sound)return;const a=audioCtx();if(!a)return;try{const t=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.15,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const pling=n=>{const f=[523,587,659,698,784,880,988,1047][n%8];tone(f,.25);tone(f*1.5,.28,.07)};
const harp=()=>[523,587,659,698,784,880,988,1047].forEach((f,i)=>tone(f,.32,i*.07));
function honk(){tone(392,.32,0,'square',.07);tone(494,.32,0,'square',.06);tone(392,.36,.4,'square',.07);tone(494,.36,.4,'square',.06)}
function splash(){if(!S.sound)return;const a=audioCtx();if(!a)return;try{const n=a.sampleRate*.45,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=900;g.gain.value=.25;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start()}catch(e){}}

/* ---------- interface drawings ---------- */
const svg=(inner,vb='0 0 100 100')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
function starPts(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
const hex=n=>'#'+n.toString(16).padStart(6,'0');

function channelCenter(z){return -22*ss(z,40,230)+7*ss(-z,30,170)}
function channelHalf(z){return 48+26*ss(z,20,150)-17*ss(-z,10,90)}
function rockNoise(x,z){return Math.sin(x*0.05+1)*Math.cos(z*0.06)*1.6+Math.sin(x*0.017+3)*Math.sin(z*0.021+1)*3.4}
function terrainH(x,z){const xc=channelCenter(z),hw=channelHalf(z);const d=x-xc,rel=Math.abs(d)/hw;const bank=ss(rel,0.92,1.32);let h=-3+bank*9.5;
  const canyon=ss(-z,12,75)*bank;h+=canyon*9*ss(rel,0.98,1.2);
  if(d>0){h+=bank*(7*ss(d,hw*1.25,hw*1.25+95)+rockNoise(x,z)*0.9);h+=bank*4*ss(d,hw*1.25+95,hw*1.25+170)}else{h+=bank*(1.2+rockNoise(x*0.7,z*0.7)*0.45)}
  return Math.max(h,lerp(-2,4.6,ss(rel,0.95,1.18)))}
(function(){

  const fieldColor=(x,z)=>{const u=Math.floor((x*cosA-z*sinA)/34),v=Math.floor((x*sinA+z*cosA)/46);return pal[((u*73856093^v*19349663)>>>0)%pal.length]};

  for(let i=0;i<tp.count;i++){const x=tp.getX(i),z=tp.getZ(i);tp.setY(i,terrainH(x,z));const xc=channelCenter(z),hw=channelHalf(z),d=x-xc,rel=Math.abs(d)/hw;let col;
    if(rel<0.95)col=cBed.clone();else if(d<0){col=fieldColor(x,z).clone();col.lerp(cSteppe,0.2)}

    const rip=ss(rel,0.9,1.0)*(1-ss(rel,1.05,1.35));col.lerp(cGreen,rip*0.75);cols.push(col.r,col.g,col.b)}

  const terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));if(!LOW)terrain.receiveShadow=true;scene.add(terrain);
})();

function step(dt,t){
  /* water ripples (less often on tablets) */
  if(!LOW||(frames&1)===0){for(let i=0;i<wPos.count;i++){const x=wBase[i*3],y=wBase[i*3+1];wPos.setZ(i,Math.sin(x*0.3+t*1.3)*0.13+Math.sin(y*0.1-t*0.85)*0.18)}wPos.needsUpdate=true}
  stars.forEach(s=>{if(s.got)return;s.m.rotation.y=t*1.8+s.i;s.m.position.y=s.y+Math.sin(t*2.2+s.i)*0.35});
  if(!started||paused){
    /* intro: the camera slowly circles the car */
    const a=t*0.15;camPos.set(pos.x+Math.sin(a)*26,pos.y+11,pos.z+Math.cos(a)*26);camera.position.lerp(camPos,camInit?Math.min(1,dt*2):1);camInit=true;
    camera.lookAt(pos.x-20,pos.y+2,pos.z);place(dt,t);return}
  let inS=(steerL||keys.ArrowLeft||keys.KeyA?1:0)-(steerR||keys.ArrowRight||keys.KeyD?1:0);
  const target=driving?CRUISE:0;
  speed+=(target-speed)*Math.min(1,dt*(driving?1.1:2.2));
  if(Math.abs(speed)<0.05&&!driving)speed=0;
  heading+=inS*1.85*dt*clamp(Math.abs(speed)/6,0.55,1);
  fwd.set(Math.sin(heading),0,Math.cos(heading));
  const gA=groundInfo(pos.x+fwd.x*1.6,pos.z+fwd.z*1.6).h,gB=groundInfo(pos.x-fwd.x*1.6,pos.z-fwd.z*1.6).h;
  speed-=clamp((gA-gB)/3.2,-0.6,0.6)*2.5*dt;
  let nx=pos.x+fwd.x*speed*dt,nz=pos.z+fwd.z*speed*dt;
  const ahead=groundInfo(nx+fwd.x*1.8*Math.sign(speed||1),nz+fwd.z*1.8*Math.sign(speed||1));
  const out=Math.abs(nx)>380||Math.abs(nz)>380;
  if(isWet(ahead)||out){
    /* doesn't go into the water: turns from the shore towards dry land */
    nx=pos.x;nz=pos.z;speed=Math.min(speed,2);
    const lx=pos.x+Math.cos(heading)*5,lz=pos.z-Math.sin(heading)*5,rx=pos.x-Math.cos(heading)*5,rz=pos.z+Math.sin(heading)*5;
    const hl=out?-Math.hypot(lx,lz):groundInfo(lx,lz).h,hr=out?-Math.hypot(rx,rz):groundInfo(rx,rz).h;
    heading+=(hl>=hr?1:-1)*2.2*dt;
    if(wetCd<=0){wetCd=3;toast(out?L().edge:L().water,1500);if(!out)splash()}
  }
  if(wetCd>0)wetCd-=dt;
  pos.x=nx;pos.z=nz;
  if(Math.abs(pos.x)<=68&&groundInfo(pos.x,pos.z).surf==='tas'&&Math.abs(pos.z)>2.15)pos.z=Math.sign(pos.z)*2.15;
  const gi=groundInfo(pos.x,pos.z);
  if(gi.surf==='asfalt'&&Math.abs(gi.hc.perp)>2.9){const over=Math.abs(gi.hc.perp)-2.9,px=-HW_DIR.y/HW_LEN,pz=HW_DIR.x/HW_LEN;pos.x-=Math.sign(gi.hc.perp)*px*over;pos.z-=Math.sign(gi.hc.perp)*pz*over}
  const g2=groundInfo(pos.x,pos.z);pos.y+=(g2.h-pos.y)*Math.min(1,dt*12);
  /* stars */
  stars.forEach(s=>{if(s.got)return;const dx=pos.x-s.x,dz=pos.z-s.z;if(dx*dx+dz*dz<3.4*3.4&&Math.abs(pos.y-s.base)<4.5)collect(s)});
  place(dt,t,gA,gB);
  /* camera: from behind, a little above */
  const dist=camera.aspect<1?17:14.5;
  const ca=heading+Math.PI;camPos.set(pos.x+Math.sin(ca)*dist,pos.y+6.4+dist*0.1,pos.z+Math.cos(ca)*dist);
  const cg=groundInfo(camPos.x,camPos.z).h+2;if(camPos.y<cg)camPos.y=cg;
  camera.position.lerp(camPos,1-Math.pow(0.002,dt));look.set(pos.x+fwd.x*4,pos.y+1.8,pos.z+fwd.z*4);camera.lookAt(look);
}
function place(dt,t,gA,gB){
  car.position.copy(pos);
  if(gA==null){fwd.set(Math.sin(heading),0,Math.cos(heading));gA=groundInfo(pos.x+fwd.x*1.6,pos.z+fwd.z*1.6).h;gB=groundInfo(pos.x-fwd.x*1.6,pos.z-fwd.z*1.6).h}
  const hL=groundInfo(pos.x+Math.cos(heading),pos.z-Math.sin(heading)).h,hR=groundInfo(pos.x-Math.cos(heading),pos.z+Math.sin(heading)).h;
  eul.set(Math.atan2(gB-gA,3.2),heading,Math.atan2(hR-hL,2)+(started&&!paused?Math.sin(t*9)*0.008*Math.min(1,speed/5):0));car.quaternion.setFromEuler(eul);
  wheels.forEach(w=>w.rotation.x+=speed*dt*2.2);
  /* arrow: nearest star */
  let best=null,bd=1e9;stars.forEach(s=>{if(s.got)return;const d=(s.x-pos.x)**2+(s.z-pos.z)**2;if(d<bd){bd=d;best=s}});
  arrow.visible=!!best&&started&&!paused&&bd>14*14;
  if(best){arrow.position.set(pos.x,pos.y+4.4+Math.sin(t*3)*0.25,pos.z);arrow.rotation.y=Math.atan2(best.x-pos.x,best.z-pos.z)}
  /* villagers */
  villagers.forEach(v=>{const dx=pos.x-v.g.position.x,dz=pos.z-v.g.position.z,d2=dx*dx+dz*dz;const near=d2<26*26&&started;
    if(v.honk>0)v.honk-=dt;const act=near||v.honk>0;
    if(near&&!v.near&&!paused&&t-lastSay>2.5){lastSay=t;say(L().greet[v.gi])}
    v.near=near;
    v.wave+=((act?1:0)-v.wave)*Math.min(1,dt*4);
    const tr=act?Math.atan2(dx,dz):v.baseRot;let diff=Math.atan2(Math.sin(tr-v.g.rotation.y),Math.cos(tr-v.g.rotation.y));v.g.rotation.y+=diff*Math.min(1,dt*(act?5:1.5));
    v.shoulder.rotation.z=-(2.45*v.wave)+Math.sin(t*7)*0.5*v.wave;
    v.bubble.visible=v.wave>0.5;v.bubble.material.opacity=Math.min(1,v.wave*1.4)});
  sun.position.set(pos.x+60,180,pos.z+36);sun.target.position.copy(pos);
}
function animate(){
  requestAnimationFrame(animate);
  if(document.hidden)return;
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;frames++;
  step(dt,t);
  renderer.render(scene,camera);
}
/* test hook */
window.__cg={groundInfo,stars,isWet,WATER_Y,get pos(){return pos},get state(){return{got,started,paused,driving,speed,heading,rounds:S.rounds,car:S.car}},
  tp(x,z,h){pos.set(x,groundInfo(x,z).h,z);if(h!=null)heading=h},collect:i=>collect(stars[i])};

renderStatic();refreshTexts();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refreshTexts).catch(()=>{});
animate();
})();
</script>
