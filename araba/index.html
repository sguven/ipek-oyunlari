<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>İpek'in Araba Gezisi</title>
<meta name="description" content="Çeşnigir Köprüsü'nden geç, Köprüköy'ü gez, yıldızları topla. Çocuklar için kolay 3D araba oyunu.">
<meta name="theme-color" content="#cde8ff">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Araba Gezisi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* layout: tam ekran 3D sahne; üstte durum çubukları (oyunlar / yıldız+çıkartma / menü), altta sol direksiyon, sağ gaz-geri-korna. Tek tema, pastel. */
:root{
  --ink:#3b2a5c;--ink2:#6c5a92;--card:#fffdfb;--tint:#f2f8ff;--gold:#ffcb3d;--pink:#ff7eb6;--ok:#1f9e66;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#cde8ff;touch-action:none;overscroll-behavior:none}
body{font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
button,a{font-family:inherit}
.pill{font:800 15px var(--body);background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--ink);min-height:44px;text-decoration:none}
.pill svg{width:22px;height:22px;flex:none}
.pill:active,.ctl:active,.ctl.on{transform:translateY(3px)}
.round{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.round svg{width:26px;height:26px}

/* üst çubuk */
.top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));display:flex;align-items:flex-start;justify-content:space-between;gap:8px;z-index:10;pointer-events:none}
.top>*{pointer-events:auto}
.score{display:flex;flex-direction:column;align-items:center;gap:6px}
.stars{font:700 22px/1 var(--display);background:var(--card);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);padding:6px 14px 6px 8px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.stars svg{width:30px;height:30px}
.stars.bump{animation:bounce .4s}
.stickers{display:flex;gap:4px;background:rgba(255,253,251,.85);border:2px solid var(--ink);border-radius:999px;padding:4px 6px}
.stk{width:28px;height:28px;border-radius:50%;border:2px dashed #a99bc7;display:grid;place-items:center;background:#fff}
.stk svg{width:20px;height:20px;opacity:.25}
.stk.got{border:2px solid var(--ink);background:var(--gold)}
.stk.got svg{opacity:1}
.stk.next{border-color:var(--pink);border-style:solid;animation:pulse 1.2s ease-in-out infinite}

/* kontroller */
.pad{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));z-index:10;display:flex;gap:12px;align-items:flex-end}
.pad.l{left:calc(14px + env(safe-area-inset-left))}
.pad.r{right:calc(14px + env(safe-area-inset-right))}
.ctl{border:4px solid var(--ink);background:var(--card);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;touch-action:none;color:var(--ink)}
.ctl svg{width:58%;height:58%;pointer-events:none}
.steer{width:clamp(78px,11vw,108px);height:clamp(78px,11vw,108px);border-radius:28px;background:#e7f3ff}
.gas{width:clamp(84px,12vw,116px);height:clamp(112px,17vw,158px);border-radius:28px;background:#c9f2d6}
.gas b{font:700 15px var(--display);pointer-events:none;margin-top:-8px}
.gas{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gas svg{width:56%;height:auto}
.small-col{display:flex;flex-direction:column;gap:12px}
.rev{width:clamp(58px,8vw,74px);height:clamp(58px,8vw,74px);border-radius:22px;background:#ffe3cf}
.horn{width:clamp(58px,8vw,74px);height:clamp(58px,8vw,74px);border-radius:50%;background:#fff3c4}
.ctl.on{background:var(--gold);box-shadow:0 3px 0 var(--ink)}

/* mesaj */
#toast{position:fixed;left:50%;top:calc(112px + env(safe-area-inset-top));transform:translateX(-50%) scale(.9);background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:10px 18px;z-index:12;text-align:center;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:min(88vw,520px)}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#toast b{display:block;font:700 clamp(20px,4.6vw,28px)/1.15 var(--display)}
#toast span{display:block;font:700 15px/1.4 var(--body);color:var(--ink2);margin-top:2px}

/* örtüler */
.ov{position:fixed;inset:0;background:rgba(59,42,92,.45);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--card);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);padding:20px 18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:14px}
.card h2,.card h3{margin:0;font:700 clamp(24px,5vw,32px)/1.1 var(--display);text-wrap:balance}
.card p{margin:0;color:var(--ink2);font-weight:700;line-height:1.45}
.card .sub{font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.big{font:700 22px var(--display);background:var(--gold);padding:10px 30px;min-height:56px}
.colors{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.col{width:58px;height:58px;border-radius:50%;border:4px solid var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0}
.col[aria-pressed="true"]{outline:4px solid var(--pink);outline-offset:3px}
.col svg{width:70%;height:auto}
.lang{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--ink)}
.lang button{font:800 14px var(--body);border:0;background:none;color:var(--ink);padding:7px 12px;cursor:pointer;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.rows{display:flex;flex-direction:column;gap:10px;text-align:left}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tint);border-radius:16px;padding:8px 10px;font-weight:800}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{font:800 13px var(--body);border:0;background:none;color:var(--ink);padding:6px 11px;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.note{font-size:13px!important;font-weight:600!important}
.trophy{display:grid;place-items:center}
.trophy svg{width:min(40vw,160px);height:min(40vw,160px);animation:spin-in .7s}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:#cde8ff;font:700 22px var(--display)}
:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.15)}70%{transform:scale(.95)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes spin-in{from{transform:scale(.2) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:560px){.stickers{gap:2px;padding:3px 4px}.stk{width:22px;height:22px}.stk svg{width:15px;height:15px}.stars{font-size:18px}.stars svg{width:24px;height:24px}.top .pill span{display:none}}
@media (max-height:520px){#menuOv .card{max-width:760px;padding:14px;gap:10px}#menuOv .rows{display:grid;grid-template-columns:1fr 1fr;gap:8px}#menuOv .note{display:none}#menuOv h3{font-size:22px}.opt{padding:6px 8px;font-size:14px}#startOv .card{max-width:640px;padding:14px;gap:10px}#startOv p{font-size:14px}.col{width:50px;height:50px}}
@media (max-height:460px){.steer{width:72px;height:72px}.gas{width:80px;height:104px}.rev,.horn{width:54px;height:54px}.small-col{gap:8px}#toast{top:calc(70px + env(safe-area-inset-top))}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="loading">…</div>

<div class="top" id="hud">
  <a class="pill" id="gamesLink" href="../"></a>
  <div class="score">
    <div class="stars" id="stars"></div>
    <div class="stickers" id="stickers"></div>
  </div>
  <button class="round" id="menuBtn"></button>
</div>

<div class="pad l" id="padL">
  <button class="ctl steer" id="cLeft"></button>
  <button class="ctl steer" id="cRight"></button>
</div>
<div class="pad r" id="padR">
  <div class="small-col">
    <button class="ctl horn" id="cHorn"></button>
    <button class="ctl rev" id="cBack"></button>
  </div>
  <button class="ctl gas" id="cGas"></button>
</div>

<div id="toast"><b></b><span></span></div>

<div class="ov" id="startOv">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <div class="sub" id="startSub"></div>
    <h2 id="startTitle"></h2>
    <p id="startText"></p>
    <div class="colors" id="colors" role="group"></div>
    <div class="btns"><button class="pill big" id="startGo"></button></div>
    <div class="btns">
      <div class="lang" role="group" aria-label="Dil / Language"><button data-lang="tr">TR</button><button data-lang="en">EN</button></div>
      <a class="pill" id="startGames" href="../"></a>
    </div>
  </div>
</div>

<div class="ov" id="menuOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <h3 id="menuTitle"></h3>
    <div class="rows">
      <div class="opt"><span id="oAuto"></span><div class="seg" data-opt="auto"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="opt"><span id="oSound"></span><div class="seg" data-opt="sound"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="opt" id="voiceRow"><span id="oVoice"></span><div class="seg" data-opt="voice"><button data-v="kadin"></button></div></div>
      <div class="opt"><span id="oSky"></span><div class="seg" data-opt="sky"><button data-v="day"></button><button data-v="sunset"></button></div></div>
      <div class="opt"><span id="oLang"></span><div class="seg" data-opt="lang"><button data-v="tr">TR</button><button data-v="en">EN</button></div></div>
    </div>
    <p class="note" id="menuNote"></p>
    <div class="btns">
      <button class="pill" id="rescueBtn"></button>
      <button class="pill" id="restartBtn"></button>
      <button class="pill" id="carBtn"></button>
    </div>
    <div class="btns"><button class="pill big" id="menuClose"></button></div>
  </div>
</div>

<div class="ov" id="winOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="trophy" id="winArt"></div>
    <h3 id="winTitle"></h3>
    <p id="winText"></p>
    <div class="btns"><button class="pill big" id="winAgain"></button><a class="pill" id="winGames" href="../"></a></div>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const INK='#3b2a5c';
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch=window.matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- metinler ---------- */
const T={
  tr:{
    name:"İpek'in Araba Gezisi",sub:'Kırıkkale · Köprüköy',
    start:"Merhaba İpek! Arabanın rengini seç, sonra yıldızları takip ederek Çeşnigir Köprüsü'nden geç ve Köprüköy'ü gez. Sarı ok sana yolu gösterir.",
    go:'Haydi, sür!',games:'Oyunlar',menu:'Ayarlar',close:'Devam et',
    auto:'Kendi kendine gitsin',sound:'Ses',voice:'Ses tonu',sky:'Gökyüzü',lang:'Dil',
    yes:'Açık',no:'Kapalı',day:'Gündüz',sunset:'Gün batımı',voiceNames:{kadin:'Kadın'},
    note:'“Kendi kendine gitsin” açıkken araba yavaşça kendisi ilerler; çocuk sadece sağa sola çevirir. Yeşil pedal hızlandırır, turuncu düğme geri gider. Suya girmek ya da bir yere takılmak yok; araba yumuşakça durur. Bina ve köylülerin içinden geçebilir.',
    rescue:'Yola dön',restart:'Baştan başla',car:'Araba rengi',
    gas:'GAZ',left:'Sola dön',right:'Sağa dön',back:'Geri',horn:'Korna',
    water:'Dikkat, su!',waterSub:'Başka yöne dön',
    stops:['Çeşnigir Köprüsü','Batı tarlaları','Karayolu köprüsü','Okul','Fatih Camii','Çeşnigir Kültür Derneği','Yeni Cami'],
    stopSub:['Çok eski bir taş köprü!','Buğday tarlaları burada.','Büyük köprü, uzun yol!','Okul bahçesine geldin.','Kubbesine bak!','Başkan amca seni bekliyordu!','Neredeyse bitti!'],
    praise:['Aferin İpek!','Harika!','Süpersin İpek!','Bravo İpek!','Çok güzel!','Muhteşemsin İpek!'],
    greet:'Merhaba İpek! Haydi oynayalım!',
    winT:'Köprüköy turu bitti!',winX:n=>`Tebrikler İpek! Bütün durakları gezdin ve ${n} yıldız topladın.`,again:'Bir tur daha',
    labels:{bridge:'Çeşnigir Köprüsü',village:'Köprüköy',river:'Kızılırmak',canyon:'Çeşnigir Kanyonu'},
    villagers:['Merhaba İpek!','Hoş geldin İpek!','Selam İpek!','Ne güzel araba!','Manzara harika!','Kolay gelsin!','Hoş geldin İpek, gel çay iç!'],
    loading:'Köprüköy hazırlanıyor…',rescued:'Yola döndük!',noWebgl:'Bu cihaz 3D oyunu açamadı. Başka bir tarayıcı deneyin.'
  },
  en:{
    name:"Ipek's Car Trip",sub:'Kırıkkale · Köprüköy',
    start:"Hi Ipek! Pick a color for your car, then follow the stars across the Çeşnigir Bridge and around Köprüköy village. The yellow arrow shows the way.",
    go:"Let's drive!",games:'Games',menu:'Settings',close:'Keep driving',
    auto:'Drive by itself',sound:'Sound',voice:'Voice',sky:'Sky',lang:'Language',
    yes:'On',no:'Off',day:'Day',sunset:'Sunset',voiceNames:{kadin:'Female'},
    note:'With “Drive by itself” on, the car rolls forward slowly and your child only steers. The green pedal speeds up, the orange button reverses. You can never fall in the water or get stuck; the car gently stops. It can drive through houses and villagers.',
    rescue:'Back to the road',restart:'Start over',car:'Car color',
    gas:'GO',left:'Turn left',right:'Turn right',back:'Reverse',horn:'Horn',
    water:'Careful, water!',waterSub:'Turn the other way',
    stops:['Çeşnigir Bridge','West fields','Highway bridge','School','Fatih Mosque','Çeşnigir Culture Club','Yeni Mosque'],
    stopSub:['A very old stone bridge!','The wheat fields are here.','A big bridge and a long road!','You reached the schoolyard.','Look at the dome!','The club president was waiting for you!','Almost done!'],
    praise:['Great job, Ipek!','Awesome!','You did it, Ipek!','Bravo!','Well done, Ipek!','Amazing!'],
    greet:"Hi Ipek! Let's play!",
    winT:'Village tour complete!',winX:n=>`Well done, Ipek! You visited every stop and collected ${n} stars.`,again:'Another tour',
    labels:{bridge:'Çeşnigir Bridge',village:'Köprüköy',river:'Kızılırmak River',canyon:'Çeşnigir Canyon'},
    villagers:['Hi Ipek!','Welcome, Ipek!','Hello Ipek!','What a nice car!','Great view!','Have a nice day!','Welcome Ipek, come have tea!'],
    loading:'Getting Köprüköy ready…',rescued:'Back on the road!',noWebgl:'This device could not open the 3D game. Please try another browser.'
  }
};

/* ---------- durum ---------- */
const KEY='araba-gezisi-v1';
const fresh=()=>({lang:null,sound:true,voice:'kadin',auto:true,sky:'day',color:0,tours:0,starsAll:0});
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw))}catch(e){}
if(!S.lang){let l=null;try{const k=JSON.parse(localStorage.getItem('kelebek-bahcesi-v1')||'{}');l=k.lang}catch(e){}S.lang=l||((navigator.language||'').toLowerCase().startsWith('en')?'en':'tr')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const L=()=>T[S.lang];
$('loading').textContent=L().loading;

/* ---------- çizim yardımcıları ---------- */
const svg=(inner,vb='0 0 100 100')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
const st=(w=4)=>`stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
function starPts(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
const CAR_COLORS=['#ff6fa8','#e2453a','#3d8bff','#ffc531','#9b6bff','#2fbf8f'];
const ICON={
  star:svg(`<polygon points="${starPts(50,54,44,19)}" fill="#ffd93d" ${st(6)}/>`),
  games:svg(`<rect x="10" y="10" width="34" height="34" rx="9" fill="#ff7eb6" ${st(5)}/><rect x="56" y="10" width="34" height="34" rx="9" fill="#ffd93d" ${st(5)}/><rect x="10" y="56" width="34" height="34" rx="9" fill="#4aa8ff" ${st(5)}/><rect x="56" y="56" width="34" height="34" rx="9" fill="#5fd3b5" ${st(5)}/>`),
  gear:svg(`<g fill="${INK}">${[0,45,90,135,180,225,270,315].map(a=>`<rect x="44" y="6" width="12" height="20" rx="3" transform="rotate(${a} 50 50)"/>`).join('')}</g><circle cx="50" cy="50" r="30" fill="${INK}"/><circle cx="50" cy="50" r="12" fill="#fff"/>`),
  left:svg(`<path d="M62 18 L28 50 L62 82" stroke="${INK}" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`),
  right:svg(`<path d="M38 18 L72 50 L38 82" stroke="${INK}" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`),
  up:svg(`<path d="M18 62 L50 28 L82 62" stroke="${INK}" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`),
  back:svg(`<path d="M50 84 V30 M24 54 L50 82 L76 54" stroke="${INK}" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`),
  horn:svg(`<path d="M14 40 H30 L66 18 V82 L30 60 H14 Z" fill="${INK}"/><path d="M76 34 Q86 50 76 66 M84 24 Q100 50 84 76" stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round"/>`),
  car:c=>svg(`<path d="M10 62 Q10 48 24 46 L32 30 Q36 24 44 24 H60 Q68 24 72 30 L80 46 Q92 48 92 62 V70 H10 Z" fill="${c}" ${st(5)}/><path d="M36 44 L41 32 H59 L66 44 Z" fill="#cfe9ff" ${st(4)}/><circle cx="28" cy="72" r="10" fill="${INK}"/><circle cx="74" cy="72" r="10" fill="${INK}"/><circle cx="28" cy="72" r="4" fill="#fff"/><circle cx="74" cy="72" r="4" fill="#fff"/>`),
  trophy:svg(`<path d="M30 14 H70 V40 Q70 62 50 66 Q30 62 30 40 Z" fill="#ffcb3d" ${st(5)}/><path d="M30 22 H16 Q14 44 32 46 M70 22 H84 Q86 44 68 46" stroke="${INK}" stroke-width="5" fill="none"/><rect x="44" y="64" width="12" height="14" fill="#ffcb3d" ${st(4)}/><rect x="30" y="78" width="40" height="10" rx="3" fill="#ff7eb6" ${st(4)}/><polygon points="${starPts(50,38,12,5)}" fill="#fff"/>`)
};
const STOP_ICON=[
  svg(`<path d="M8 70 Q50 30 92 70" stroke="${INK}" stroke-width="10" fill="none"/><path d="M36 74 Q50 52 64 74" stroke="${INK}" stroke-width="8" fill="none"/>`),

function channelCenter(z){return -22*ss(z,40,230)+7*ss(-z,30,170)}

function dirtPath(points,w){
  const pts=[];
  for(let i=0;i<points.length-1;i++){const[x1,z1]=points[i],[x2,z2]=points[i+1];const n=Math.ceil(Math.hypot(x2-x1,z2-z1)/2);for(let s=0;s<n;s++)pts.push([lerp(x1,x2,s/n),lerp(z1,z2,s/n)])}
  pts.push(points[points.length-1]);
  const pos=[],idx=[];
  pts.forEach((p,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];let dx=b[0]-a[0],dz=b[1]-a[1];const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;const px=-dz*w/2,pz=dx*w/2;
    const xl=p[0]+px,zl=p[1]+pz,xr=p[0]-px,zr=p[1]-pz;pos.push(xl,terrainH(xl,zl)+.14,zl,xr,terrainH(xr,zr)+.14,zr);
    if(i>0){const k=i*2;idx.push(k-2,k-1,k,k-1,k+1,k)}});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,roadMat);if(SHADOWS)m.receiveShadow=true;scene.add(m);
}

function groundInfo(x,z){
  let h=terrainH(x,z),surf='zemin';
  if(Math.abs(z)<=3.4){const ax=Math.abs(x);
    if(ax<=55){const d=deckY(x)+.04;if(d>h){h=d;surf='tas'}}
    else if(ax<=68){const d=lerp(deckY(Math.sign(x)*55),rampEndH(Math.sign(x)),ss(ax,55,68))+.04;if(d>h){h=d;surf='tas'}}}
  const hc=highwayCoords(x,z);
  if(Math.abs(hc.perp)<=3.6&&hc.t>=0&&hc.t<=1){const ramp=ss(hc.t,0,.05)*(1-ss(hc.t,.95,1));const endH=hc.t<.5?terrainH(HW_P1.x,HW_P1.y):terrainH(HW_P2.x,HW_P2.y);const d=lerp(Math.max(endH,4.5),HW_DECK,ramp);if(d>h){h=d;surf='asfalt'}}
  return{h,surf,hc};
}

function win(){
  if(won)return;won=true;S.tours++;save();
  const l=L();$('winArt').innerHTML=ICON.trophy;$('winTitle').textContent=l.winT;$('winText').textContent=l.winX(starsGot);
  $('winAgain').textContent=l.again;$('winGames').innerHTML=ICON.games+l.games;
  confetti(160);fanfare();setTimeout(()=>say(S.lang==='tr'?'Muhteşemsin İpek!':l.winX(starsGot)),400);
  paused=true;$('winOv').hidden=false;
}
$('winAgain').onclick=()=>{$('winOv').hidden=true;resetTour();paused=false;say(L().greet)};
function rescue(){
  const nx=nextItem();
  let idx=nx?items.indexOf(nx):0;const prev=items[Math.max(0,idx-1)];
  const from=idx>0?prev:{x:74,z:0},to=nx||items[0];
  pos.set(from.x,groundInfo(from.x,from.z).h,from.z);heading=Math.atan2(to.x-from.x,to.z-from.z);speed=0;lastSafe=pos.clone();
  toast(L().rescued,'',1400);
}

/* girdiler: büyük düğmeler (çoklu dokunuş) + klavye */
function bindHold(id,prop){
  const el=$(id);const on=e=>{e.preventDefault();input[prop]=1;el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}};
  const off=e=>{e.preventDefault();input[prop]=0;el.classList.remove('on')};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bindHold('cLeft','l');bindHold('cRight','r');bindHold('cGas','gas');bindHold('cBack','back');
function honk(){beep();villagers.forEach(v=>{const dx=pos.x-v.g.position.x,dz=pos.z-v.g.position.z;if(dx*dx+dz*dz<900)v.honk=2.5})}
$('cHorn').addEventListener('pointerdown',e=>{e.preventDefault();honk()});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyH'||e.code==='Space')honk();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in input)input[k]=0;document.querySelectorAll('.ctl.on').forEach(b=>b.classList.remove('on'))});

/* masaüstünde fareyle kamera çevirme (dokunmatikte kapalı: çocuk yanlışlıkla çevirmesin) */
let camOrbit=0,dragging=false,px=0,camDist=isTouch?15:13;
if(!isTouch){
  canvas.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX});
  addEventListener('pointermove',e=>{if(dragging){camOrbit-=(e.clientX-px)*.006;px=e.clientX}});
  addEventListener('pointerup',()=>{dragging=false});
  canvas.addEventListener('wheel',e=>{e.preventDefault();camDist=clamp(camDist*(1+Math.sign(e.deltaY)*.1),8,32)},{passive:false});
}

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?68:58;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
let safeT=0,frame=0,simT=0;
const fwd=new THREE.Vector3(),camPos=new THREE.Vector3();
function step(dt,t){
  /* su dalgası (dokunmatikte her iki karede bir) */
  if(!isTouch||frame%2===0){for(let i=0;i<wPos.count;i++){const x=wBase[i*3],y=wBase[i*3+1];wPos.setZ(i,Math.sin(x*.3+t*1.3)*.12+Math.sin(y*.1-t*.85)*.16)}wPos.needsUpdate=true}

  let steer=(input.l||keys.ArrowLeft||keys.KeyA?1:0)-(input.r||keys.ArrowRight||keys.KeyD?1:0);
  const gas=input.gas||keys.ArrowUp||keys.KeyW,back=input.back||keys.ArrowDown||keys.KeyS;
  if(paused){steer=0}
  const MAXF=19,CRUISE=9.5,MAXR=7;
  let target=0;
  if(!paused){if(back)target=-MAXR;else if(gas)target=MAXF;else if(S.auto)target=CRUISE}
  const acc=target>speed?(speed<0?14:8):(speed>0&&target<speed?(back?18:6):10);
  speed+=clamp(target-speed,-acc*dt,acc*dt);
  heading+=steer*1.9*dt*clamp(Math.abs(speed)/5,.25,1)*(speed<-.2?-1:1);
  fwd.set(Math.sin(heading),0,Math.cos(heading));

  /* hareket + yumuşak engeller (su, dünya kenarı) */
  const nx=pos.x+fwd.x*speed*dt,nz=pos.z+fwd.z*speed*dt;
  const gN=groundInfo(nx,nz),gAhead=groundInfo(pos.x+fwd.x*2.4*Math.sign(speed||1),pos.z+fwd.z*2.4*Math.sign(speed||1));
  const out=Math.abs(nx)>300||Math.abs(nz)>300;
  /* taş köprü ve karayolu üstündeyken su kontrolü yok: korkuluk zaten tutar, araba kenar boyunca kayar */
  const gHere=groundInfo(pos.x,pos.z),onDeck=gHere.surf!=='zemin'&&(gN.surf!=='zemin'||Math.abs(pos.x)<=68&&Math.abs(nz)>2);
  if(!onDeck&&(isWater(gN)||(Math.abs(speed)>.5&&gAhead.surf==='zemin'&&isWater(gAhead)))||out){
    speed=-speed*.25;
    if(bumpCd<=0){bumpCd=2.5;bonk();if(!out)toast(L().water,L().waterSub,1600)}
  }else{pos.x=nx;pos.z=nz}
  if(bumpCd>0)bumpCd-=dt;
  /* taş köprüde korkuluk içinde kal */
  if(Math.abs(pos.x)<=68&&groundInfo(pos.x,pos.z).surf==='tas'&&Math.abs(pos.z)>2.1)pos.z=Math.sign(pos.z)*2.1;
  /* karayolunda kal */
  const gi=groundInfo(pos.x,pos.z);
  if(gi.surf==='asfalt'&&Math.abs(gi.hc.perp)>2.8){const over=Math.abs(gi.hc.perp)-2.8,nX=-HW_DIR.y/HW_LEN,nZ=HW_DIR.x/HW_LEN;pos.x-=Math.sign(gi.hc.perp)*nX*over;pos.z-=Math.sign(gi.hc.perp)*nZ*over}
  const g2=groundInfo(pos.x,pos.z);
  pos.y+=(g2.h-pos.y)*Math.min(1,dt*12);
  if(isWater(g2)){pos.copy(lastSafe);speed=0}
  else{safeT+=dt;if(safeT>.5&&g2.h>WATER_Y+1){lastSafe.copy(pos);safeT=0}}

  car.position.copy(pos);
  const gF=groundInfo(pos.x+fwd.x*1.6,pos.z+fwd.z*1.6).h,gB=groundInfo(pos.x-fwd.x*1.6,pos.z-fwd.z*1.6).h;
  const hL=groundInfo(pos.x+Math.cos(heading),pos.z-Math.sin(heading)).h,hR=groundInfo(pos.x-Math.cos(heading),pos.z+Math.sin(heading)).h;
  car.rotation.set(0,0,0);car.quaternion.setFromEuler(new THREE.Euler(Math.atan2(gB-gF,3.2),heading,Math.atan2(hR-hL,2),'YXZ'));
  wheels.forEach(w=>w.rotation.x+=speed*dt*2.2);
  blob.position.set(pos.x,g2.h+.08,pos.z);blob.rotation.z=-heading;blob.visible=!SHADOWS;

  /* köylüler */
  villagers.forEach(v=>{
    const dx=pos.x-v.g.position.x,dz=pos.z-v.g.position.z,d2=dx*dx+dz*dz;
    if(v.honk>0)v.honk-=dt;
    const near=d2<300||v.honk>0;
    v.wave+=((near?1:0)-v.wave)*Math.min(1,dt*4);
    const tr=near?Math.atan2(dx,dz):v.baseRot;let df=tr-v.g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));v.g.rotation.y+=df*Math.min(1,dt*(near?5:1.5));
    v.sh.rotation.z=-(2.45*v.wave)+Math.sin(t*7)*.5*v.wave;
    const cdx=camera.position.x-v.g.position.x,cdz=camera.position.z-v.g.position.z;
    v.bubble.visible=v.wave>.5&&cdx*cdx+cdz*cdz>110;v.bubble.material.opacity=v.wave;
    if(d2<300&&t-v.greeted>12){v.greeted=t;tone(784,.12,0,'sine',.08);tone(988,.16,.1,'sine',.08)}
  });

  /* yıldızlar ve duraklar */
  items.forEach((it,i)=>{
    if(it.type==='star'){
      if(it.done){if(it.anim<1){it.anim+=dt*3;it.mesh.position.lerp(new THREE.Vector3(pos.x,pos.y+2.5,pos.z),Math.min(1,dt*10));it.mesh.scale.setScalar(1.15*(1-it.anim));if(it.anim>=1)it.mesh.visible=false}return}
      it.mesh.rotation.y=t*2+i;it.mesh.position.y=it.y+1.7+Math.sin(t*3+i)*.25;
      const dx=pos.x-it.x,dz=pos.z-it.z;if(dx*dx+dz*dz<14&&Math.abs(pos.y-it.y)<4)collect(it,i);
    }else{
      it.mesh.children[1].rotation.y=Math.sin(t*3+i)*.3;
      if(it.done)return;
      const dx=pos.x-it.x,dz=pos.z-it.z;if(dx*dx+dz*dz<56&&Math.abs(pos.y-it.y)<5)collect(it,i);
    }
  });
  /* uzak etiketler: yakına gelince gizle (ekranı kapatmasın) */
  if(frame%10===0)labels.forEach(sp=>{const dx=pos.x-sp.position.x,dz=pos.z-sp.position.z;sp.visible=dx*dx+dz*dz>9000});
  /* hedef: ok + ışık sütunu */
  const nx2=nextItem();
  items.forEach(it=>{if(it.beacon)it.beacon.visible=false});
  if(nx2){
    const nextStop=nx2.type==='stop'?nx2:items.slice(items.indexOf(nx2)).find(i=>i.type==='stop'&&!i.done);
    if(nextStop)nextStop.beacon.visible=true;
    const dx=nx2.x-pos.x,dz=nx2.z-pos.z,d=Math.hypot(dx,dz);
    arrow.visible=d>7;arrow.position.set(pos.x,pos.y+3.6+Math.sin(t*4)*.15,pos.z);
    let ta=Math.atan2(dx,dz),cur=arrow.rotation.y,df=ta-cur;df=Math.atan2(Math.sin(df),Math.cos(df));arrow.rotation.y=cur+df*Math.min(1,dt*8);
  }else arrow.visible=false;

  /* kamera */
  if(!dragging)camOrbit*=Math.pow(.05,dt);
  const ca=heading+Math.PI+camOrbit;
  camPos.set(pos.x+Math.sin(ca)*camDist,pos.y+4.6+camDist*.16,pos.z+Math.cos(ca)*camDist);
  const cg=groundInfo(camPos.x,camPos.z).h+1.8;if(camPos.y<cg)camPos.y=cg;
  camera.position.lerp(camPos,1-Math.pow(.0005,dt));
  camera.lookAt(pos.x+fwd.x*3,pos.y+1.6,pos.z+fwd.z*3);
  const m=MODES[S.sky]||MODES.day;sun.position.set(pos.x+m.pos[0]*.4,m.pos[1],pos.z+m.pos[2]*.4);sun.target.position.copy(pos);
}
function loop(){
  requestAnimationFrame(loop);
  if(document.hidden)return;
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;frame++;
  simT+=dt;step(dt,t);
  renderer.render(scene,camera);
}

/* ---------- ekranlar ---------- */
function renderStatic(){
  const l=L();document.documentElement.lang=S.lang;document.title=l.name;
  $('gamesLink').innerHTML=ICON.games+`<span>${l.games}</span>`;$('gamesLink').setAttribute('aria-label',l.games);
  $('startGames').innerHTML=ICON.games+l.games;
  $('menuBtn').innerHTML=ICON.gear;$('menuBtn').setAttribute('aria-label',l.menu);
  $('cLeft').innerHTML=ICON.left;$('cLeft').setAttribute('aria-label',l.left);
  $('cRight').innerHTML=ICON.right;$('cRight').setAttribute('aria-label',l.right);
  $('cGas').innerHTML=ICON.up+`<b>${l.gas}</b>`;$('cGas').setAttribute('aria-label',l.gas);
  $('cBack').innerHTML=ICON.back;$('cBack').setAttribute('aria-label',l.back);
  $('cHorn').innerHTML=ICON.horn;$('cHorn').setAttribute('aria-label',l.horn);
  $('startSub').textContent=l.sub;$('startTitle').textContent=l.name;$('startText').textContent=l.start;$('startGo').textContent=l.go;
  $('colors').setAttribute('aria-label',l.car);
  $('colors').innerHTML=CAR_COLORS.map((c,i)=>`<button class="col" data-c="${i}" style="background:#fff" aria-pressed="${S.color===i}" aria-label="${l.car} ${i+1}">${ICON.car(c)}</button>`).join('');
  $('colors').querySelectorAll('.col').forEach(b=>b.onclick=()=>{S.color=+b.dataset.c;save();carMat.color.set(CAR_COLORS[S.color]);tone(660+S.color*60,.15);renderStatic()});
  document.querySelectorAll('#startOv .lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===S.lang)));
  renderMenu();renderHud();
}
function renderMenu(){
  const l=L();
  $('menuTitle').textContent=l.menu;$('oAuto').textContent=l.auto;$('oSound').textContent=l.sound;$('oVoice').textContent=l.voice;$('oSky').textContent=l.sky;$('oLang').textContent=l.lang;
  $('menuNote').textContent=l.note;$('rescueBtn').textContent=l.rescue;$('restartBtn').textContent=l.restart;$('carBtn').textContent=l.car;$('menuClose').textContent=l.close;
  const val={auto:S.auto?'1':'0',sound:S.sound?'1':'0',voice:curVoice()||S.voice,sky:S.sky,lang:S.lang};
  const txt={auto:{1:l.yes,0:l.no},sound:{1:l.yes,0:l.no},voice:l.voiceNames,sky:{day:l.day,sunset:l.sunset},lang:{tr:'TR',en:'EN'}};
  document.querySelectorAll('#menuOv .seg').forEach(sg=>{const k=sg.dataset.opt;sg.querySelectorAll('button').forEach(b=>{b.textContent=txt[k][b.dataset.v];b.setAttribute('aria-pressed',String(val[k]===b.dataset.v))})});
  $('voiceRow').hidden=!(S.lang==='tr'&&CLIPS.map&&CLIPS.map.voices.length>1);
}
document.querySelectorAll('#menuOv .seg').forEach(sg=>sg.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const k=sg.dataset.opt,v=b.dataset.v;
  if(k==='auto')S.auto=v==='1';else if(k==='sound'){S.sound=v==='1';if(!S.sound){try{speechSynthesis.cancel()}catch(_){}}}
  else if(k==='voice'){S.voice=v;save();say(L().greet)}else if(k==='sky'){S.sky=v;applySky()}
  else if(k==='lang'&&S.lang!==v){S.lang=v;relabel();revillage();renderStatic()}
  save();renderMenu();
}));
function setLang(v){if(S.lang===v)return;S.lang=v;save();relabel();revillage();renderStatic()}
document.querySelectorAll('#startOv .lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
function openMenu(){paused=true;renderMenu();$('menuOv').hidden=false}
function closeMenu(){$('menuOv').hidden=true;if($('startOv').hidden&&$('winOv').hidden)paused=false}
$('menuBtn').onclick=openMenu;$('menuClose').onclick=closeMenu;
$('menuOv').addEventListener('click',e=>{if(e.target===$('menuOv'))closeMenu()});
$('rescueBtn').onclick=()=>{closeMenu();rescue()};
$('restartBtn').onclick=()=>{closeMenu();resetTour()};
$('carBtn').onclick=()=>{$('menuOv').hidden=true;$('startOv').hidden=false};
$('startGo').onclick=()=>{$('startOv').hidden=true;paused=false;if(!started){started=true;say(L().greet)}};
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('menuOv').hidden)closeMenu();else if($('startOv').hidden&&$('winOv').hidden)openMenu()}});

resetTour();renderStatic();
$('loading').hidden=true;
loop();
window.__game={get simT(){return simT},get frame(){return frame},get pos(){return pos},get heading(){return heading},set heading(v){heading=v},get speed(){return speed},items,STOPS,groundInfo,isWater,get stopsDone(){return stopsDone},get starsGot(){return starsGot},get paused(){return paused},teleport(x,z){pos.set(x,groundInfo(x,z).h,z);lastSafe.copy(pos)},STAR_TOTAL,ROUTE};
})();
